<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:100vw; height:100vh; pointer-events:none; }
  canvas { display:block; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import { GLTFLoader }    from 'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'https://esm.sh/@pixiv/three-vrm@2';

// ═══════════════════════════════════════════════════
// CONFIGURACIÓN CENTRALIZADA
// ═══════════════════════════════════════════════════
const CONFIG = {
  // z/position.y del modelo ya no son constantes fijas: recalcularEncuadre() las
  // deriva de la altura real medida del modelo (Box3) + estas anclas normalizadas.
  camera:  { fov: 28 },
  pet:     {
    anchorX: 0.82, anchorY: 0.55,       // posición de reposo, fracción de pantalla (0=izq/arriba, 1=der/abajo)
    walkLeft: 0.62, walkRight: 0.95,    // rango de caminata, misma fracción normalizada
    alturaPantalla: 0.45,               // fracción del alto de pantalla que debe ocupar Rem
    velocity: 0.18,                     // fracción de pantalla por segundo
  },
  ws:      { port: 18766, retryDelay: 1500, maxRetries: 10 },
  lighting: {
    ambient: { color: 0xb0c0dd, intensity: 1.0 },
    key:     { color: 0xfff8f0, intensity: 1.4, pos: [1.5, 3, 2] },
    fill:    { color: 0x8899ff, intensity: 0.6, pos: [-2, 1, 0.5] },
    rim:     { color: 0xffffff, intensity: 0.3, pos: [0, 2, -2] },
  },
};

// Valores originales de las anclas horizontales, antes de cualquier ajuste por
// aspect — se preservan para poder volver a ellos si la superficie es ancha
// (navegador normal) después de haber sido angosta, o viceversa.
const _anchorXOriginal   = CONFIG.pet.anchorX;
const _walkLeftOriginal  = CONFIG.pet.walkLeft;
const _walkRightOriginal = CONFIG.pet.walkRight;

// ═══════════════════════════════════════════════════
// RENDERER + ESCENA
// ═══════════════════════════════════════════════════
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

// Cámara tipo teleobjetivo — plano medio VTuber.
// Posición/lookAt reales los fija recalcularEncuadre() una vez medido el modelo;
// esto es solo un placeholder razonable para el primer frame antes de esa carga.
const camera = new THREE.PerspectiveCamera(CONFIG.camera.fov, window.innerWidth / window.innerHeight, 0.1, 20);
camera.position.set(0, 0, 1.6);
camera.lookAt(0, 0, 0);

// Inspección manual desde la consola del navegador (window.__rem.vrm, .scene, .camera).
window.__rem = { vrm: null, scene, camera };

// El overlay es una superficie de 520x860 (aspect ~0,60, vertical) dedicada
// solo al avatar — no un monitor de 16:9. Las anclas horizontales (anchorX/
// walkLeft/walkRight) están pensadas para un monitor ancho donde Rem camina
// por un tercio de pantalla; en una superficie angosta, anchorX=0.82 cae
// FUERA del recuadro visible. Si el ancho es menor que el alto, se colapsan
// a 0.5 (centrado, sin caminata lateral). Se reevalúa en cada
// recalcularEncuadre() (carga + resize) por si la superficie cambia de forma.
function _ajustarAnclasPorAspect() {
  const esVertical = camera.aspect < 1;
  CONFIG.pet.anchorX   = esVertical ? 0.5 : _anchorXOriginal;
  CONFIG.pet.walkLeft  = esVertical ? 0.5 : _walkLeftOriginal;
  CONFIG.pet.walkRight = esVertical ? 0.5 : _walkRightOriginal;
  console.log(`[Encuadre] aspect=${camera.aspect.toFixed(3)} `
            + `(${esVertical ? 'vertical: overlay' : 'horizontal'}) -> `
            + `anchorX=${CONFIG.pet.anchorX} walkLeft=${CONFIG.pet.walkLeft} walkRight=${CONFIG.pet.walkRight}`);
  return esVertical;
}
_ajustarAnclasPorAspect(); // antes de que charX se inicialice más abajo, con el valor ya correcto

// Iluminación tipo estudio de stream
scene.add(new THREE.AmbientLight(CONFIG.lighting.ambient.color, CONFIG.lighting.ambient.intensity));
const keyLight  = new THREE.DirectionalLight(CONFIG.lighting.key.color,  CONFIG.lighting.key.intensity);  keyLight.position.set(...CONFIG.lighting.key.pos);   scene.add(keyLight);
const fillLight = new THREE.DirectionalLight(CONFIG.lighting.fill.color, CONFIG.lighting.fill.intensity); fillLight.position.set(...CONFIG.lighting.fill.pos); scene.add(fillLight);
const rimLight  = new THREE.DirectionalLight(CONFIG.lighting.rim.color,  CONFIG.lighting.rim.intensity);  rimLight.position.set(...CONFIG.lighting.rim.pos);   scene.add(rimLight);

// ═══════════════════════════════════════════════════
// ESTADO GLOBAL
// ═══════════════════════════════════════════════════
let estado = 'idle';
let prevEstado = '';
let vrm = null;
const clock = new THREE.Clock();
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ═══════════════════════════════════════════════════
// ENCUADRE RESPONSIVO — anclas normalizadas (0..1 de pantalla), no world units fijas
// ═══════════════════════════════════════════════════
// n: 0 = izquierda/arriba, 1 = derecha/abajo. worldX/anchoVisible/alturaVisible
// se recalculan en recalcularEncuadre() y se usan para convertir fracciones a
// coordenadas de mundo en el momento de escribir vrm.scene.position.
let _anchoVisible = 0, _alturaVisible = 0;
let _modeloAlturaLocal = 1.5, _modeloCentroLocal = 0.75; // fallback razonable antes de medir
let _modeloAlturaBox3 = 0;        // guardada solo para el log comparativo
let _medirHuesosPendiente = false; // se remide con huesos en el frame siguiente a la carga
let _modeloPositionY = 0;

const worldX = n => (n - 0.5) * _anchoVisible;

// Box3.setFromObject() sobre un VRM con SkinnedMesh da la caja de la geometría
// SIN aplicar el skinning (el shader deforma los vértices en GPU, no en los
// datos de la geometría en CPU) — en este modelo eso da ~la mitad de la altura
// real. Medimos altura real con huesos: head - min(leftFoot, rightFoot), con
// +18% arriba para cubrir pelo/adornos que no tienen hueso propio. Usa
// getRawBoneNode (el hueso real posado), no el proxy normalizado.
function medirAlturaHuesos() {
  const headB  = vrm?.humanoid?.getRawBoneNode('head');
  const lFootB = vrm?.humanoid?.getRawBoneNode('leftFoot');
  const rFootB = vrm?.humanoid?.getRawBoneNode('rightFoot');
  if (!headB || !lFootB || !rFootB) {
    console.warn('[Encuadre] faltan huesos head/leftFoot/rightFoot — se mantiene la medición por Box3');
    return null;
  }

  const headPos = new THREE.Vector3(), lFootPos = new THREE.Vector3(), rFootPos = new THREE.Vector3();
  headB.getWorldPosition(headPos);
  lFootB.getWorldPosition(lFootPos);
  rFootB.getWorldPosition(rFootPos);

  const pieY = Math.min(lFootPos.y, rFootPos.y);
  const alturaCruda = headPos.y - pieY;   // hueso head al pie más bajo, sin margen
  const altura = alturaCruda * 1.18;      // +18% para pelo/adornos por encima de la cabeza
  const tope = headPos.y + (altura - alturaCruda);
  const centro = (tope + pieY) / 2;

  return { altura, centro };
}

function recalcularEncuadre() {
  const fovRad = camera.fov * Math.PI / 180;

  // 0) Reevaluar anclas horizontales por si el aspect cambió (resize) —
  //    también colapsa charX al centro si se volvió vertical.
  const esVertical = _ajustarAnclasPorAspect();
  if (esVertical) charX = 0.5;

  // 1) Distancia de cámara tal que el modelo (altura real medida) ocupe
  //    CONFIG.pet.alturaPantalla del alto visible de pantalla.
  const alturaVisibleObjetivo = _modeloAlturaLocal / CONFIG.pet.alturaPantalla;
  camera.position.set(0, 0, alturaVisibleObjetivo / (2 * Math.tan(fovRad / 2)));
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();

  // 2) Alturas/anchos visibles reales a esa distancia (fórmulas pedidas).
  _alturaVisible = 2 * camera.position.z * Math.tan(fovRad / 2);
  _anchoVisible  = _alturaVisible * camera.aspect;

  // 3) Y del modelo: el centro de su caja (medida) debe caer en anchorY de
  //    pantalla, con la cámara siempre mirando al origen (paso 1).
  const centroObjetivoMundo = _alturaVisible * (0.5 - CONFIG.pet.anchorY);
  _modeloPositionY = centroObjetivoMundo - _modeloCentroLocal;

  const posX = worldX(charX);
  if (vrm) {
    vrm.scene.position.y = _modeloPositionY;
    vrm.scene.position.x = posX;
  }

  console.log(`[Encuadre] z=${camera.position.z.toFixed(3)} anchoVisible=${_anchoVisible.toFixed(3)} `
            + `alturaVisible=${_alturaVisible.toFixed(3)} position.y=${_modeloPositionY.toFixed(3)} `
            + `position.x=${posX.toFixed(3)} (charX=${charX})`);
}

// ═══════════════════════════════════════════════════
// DESKTOP PET — CAMINATA (fracciones normalizadas de pantalla)
// ═══════════════════════════════════════════════════
const VEL = CONFIG.pet.velocity;
let charX = CONFIG.pet.anchorX, charDir = -1;  // empieza en la posición de reposo
let petEstado = 'idle_anim', petTimer = 2 + Math.random() * 3;
let walkBlend = 0, walkPhase = 0;

function tickPet(dt) {
  if (estado === 'talking' || estado === 'thinking') { petEstado = 'idle_anim'; return; }
  petTimer -= dt;
  if (petTimer <= 0) {
    petEstado = petEstado === 'idle_anim' ? 'walking' : 'idle_anim';
    petTimer  = petEstado === 'walking' ? 4 + Math.random() * 6 : 3 + Math.random() * 5;
    if (petEstado === 'walking' && Math.random() < 0.3) charDir *= -1;
  }
  if (petEstado === 'walking') {
    // Se leen en vivo (no cacheadas): _ajustarAnclasPorAspect() puede haberlas
    // colapsado a 0.5 si la superficie es vertical (overlay).
    const bordeIzq = CONFIG.pet.walkLeft, bordeDer = CONFIG.pet.walkRight;
    charX += charDir * VEL * dt;
    if (charX > bordeDer) { charX = bordeDer; charDir = -1; petEstado = 'idle_anim'; petTimer = 2 + Math.random() * 3; }
    if (charX < bordeIzq) { charX = bordeIzq; charDir =  1; petEstado = 'idle_anim'; petTimer = 2 + Math.random() * 3; }
    if (vrm) vrm.scene.position.x = worldX(charX);
  }
}

// ═══════════════════════════════════════════════════
// CARGA VRM
// ═══════════════════════════════════════════════════
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

loader.load('/rem.vrm',
  gltf => {
    vrm = gltf.userData.vrm;
    window.__rem.vrm = vrm;
    VRMUtils.removeUnnecessaryJoints(vrm.scene);
    vrm.scene.rotation.y = Math.PI;
    vrm.scene.scale.set(1, 1, 1);
    vrm.scene.position.set(0, 0, 0); // posición neutra: medir la caja sin offsets propios
    scene.add(vrm.scene);

    // Medición inicial por Box3 — placeholder para el primer frame o dos, hasta
    // que la remedición por huesos (más abajo, en animate()) la corrija. Se
    // guarda en _modeloAlturaBox3 solo para el log comparativo.
    const caja = new THREE.Box3().setFromObject(vrm.scene);
    _modeloAlturaBox3 = caja.max.y - caja.min.y;
    _modeloAlturaLocal = _modeloAlturaBox3;
    _modeloCentroLocal = (caja.max.y + caja.min.y) / 2;
    console.log(`[Encuadre] altura por Box3 (provisoria): ${_modeloAlturaBox3.toFixed(3)} u`
              + ` (min.y=${caja.min.y.toFixed(3)}, max.y=${caja.max.y.toFixed(3)})`);

    recalcularEncuadre(); // fija camera.position.z, vrm.scene.position.y/x y el lookAt (provisorio)
    _medirHuesosPendiente = true; // remedir con huesos en el próximo frame, una vez posado (ver animate())

    const names = vrm.expressionManager?.expressions?.map(e => e.expressionName) ?? [];
    console.log('[VRM] OK | expressions:', names.join(', '));
    console.log('[VRM] springBones:', vrm.springBoneManager ? 'sí' : 'no');
    _exprMap = buildExprMap(names);
    localizarMallaFacial();
  },
  xhr => console.log('[VRM] cargando', Math.round(xhr.loaded / xhr.total * 100) + '%'),
  err => console.error('[VRM] error:', err)
);

// ═══════════════════════════════════════════════════
// HELPERS: HUESOS Y EXPRESIONES
// ═══════════════════════════════════════════════════
const getB = n => vrm?.humanoid?.getNormalizedBoneNode(n) ?? null;

// Candidatos de nombre por clave lógica — se resuelven contra los nombres reales del VRM al cargar
const _exprCandidates = {
  happy:     ['happy', 'joy', 'blendshape.joy', 'preset.happy'],
  sad:       ['sad', 'sorrow', 'blendshape.sorrow', 'preset.sad'],
  angry:     ['angry', 'blendshape.angry', 'preset.angry'],
  // En rem.vrm esta expresión no tiene presetName estándar (VRM 0.x, presetName='unknown'),
  // three-vrm la expone por su nombre literal: 'Surprised' con mayúscula.
  surprised: ['surprised', 'Surprised', 'blendshape.surprised', 'preset.surprised'],
  blink:     ['blink', 'blendshape.blink', 'blinkleft', 'blinkl'],
  // Presets estándar de VRM para los 5 visemes (vocales) — usados solo como
  // fallback vía expressionManager cuando el modelo no expone morph targets
  // vrc.* directos (ver localizarMallaFacial() / FONEMA_A_VISEME_VRM en lipsync.py).
  aa: ['aa', 'a', 'blendshape.a'],
  ee: ['ee', 'e', 'blendshape.e'],
  ih: ['ih', 'i', 'blendshape.i'],
  oh: ['oh', 'o', 'blendshape.o'],
  ou: ['ou', 'u', 'blendshape.u'],
};

// Mapa clave lógica → nombre real de expresión en este VRM (null si no hay equivalente)
let _exprMap = {};

function buildExprMap(names) {
  const map = {};
  for (const [key, candidates] of Object.entries(_exprCandidates)) {
    const found = names.find(n => candidates.includes(n.toLowerCase()));
    map[key] = found ?? null;
  }
  console.log('[VRM] mapa de expresiones resuelto:', map);
  return map;
}

function trySetExpr(key, value) {
  const name = _exprMap[key];
  if (!vrm?.expressionManager || !name) return;
  vrm.expressionManager.setValue(name, clamp(value, 0, 1));
}

// ═══════════════════════════════════════════════════
// SISTEMA DE EXPRESIONES EMOCIONALES
// ═══════════════════════════════════════════════════
const EXPR_PROFILES = {
  idle:      { happy: 0.0, sad: 0.0, angry: 0.0, surprised: 0.0 },
  talking:   { happy: 0.3, sad: 0.0, angry: 0.0, surprised: 0.0 },
  thinking:  { happy: 0.0, sad: 0.1, angry: 0.0, surprised: 0.0 },
  happy:     { happy: 1.0, sad: 0.0, angry: 0.0, surprised: 0.1 },
  sad:       { happy: 0.0, sad: 0.9, angry: 0.0, surprised: 0.0 },
  angry:     { happy: 0.0, sad: 0.0, angry: 0.8, surprised: 0.0 },
  surprised: { happy: 0.1, sad: 0.0, angry: 0.0, surprised: 1.0 },
};
const curExpr = { happy: 0, sad: 0, angry: 0, surprised: 0 };

function updateExpressions(dt) {
  const profile = EXPR_PROFILES[estado] ?? EXPR_PROFILES.idle;
  // "Surprised" bindea (entre otros) el morph "Huh" — un gesto de boca. Con
  // lipsync activo lo suprimimos para que no compita con los visemes (ver
  // diagnosticarExpressionBinds() / CLAUDE.md). "Talk" nunca se llama desde
  // este sistema, así que no hace falta suprimirla aparte.
  const suprimirBocaExpr = _audioActivo;
  for (const [k, target] of Object.entries(profile)) {
    curExpr[k] = lerp(curExpr[k], target, dt * 2.5);
    trySetExpr(k, (k === 'surprised' && suprimirBocaExpr) ? 0 : curExpr[k]);
  }
}

// ═══════════════════════════════════════════════════
// SISTEMA DE PARPADEO NATURAL
// ═══════════════════════════════════════════════════
let blinkPhase = 'wait'; // 'wait' | 'closing' | 'opening' | 'doubleWait'
let blinkTimer  = 2.5 + Math.random() * 2;
let blinkVal    = 0;
let blinkDouble = false;
let blinkDoubleWait = 0;

function updateBlink(dt) {
  // Intervalo base por estado — thinking parpadea más
  const baseInterval = estado === 'thinking' ? 1.8
                     : estado === 'talking'   ? 2.2 : 3.5;

  switch (blinkPhase) {
    case 'wait':
      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase = 'closing';
        blinkDouble = Math.random() < 0.05; // 5% doble parpadeo
      }
      break;
    case 'closing':
      blinkVal += dt / 0.08; // cierra en 80ms
      if (blinkVal >= 1) { blinkVal = 1; blinkPhase = 'opening'; }
      break;
    case 'opening':
      blinkVal -= dt / 0.12; // abre en 120ms
      if (blinkVal <= 0) {
        blinkVal = 0;
        if (blinkDouble) { blinkDouble = false; blinkDoubleWait = 0.07; blinkPhase = 'doubleWait'; }
        else              { blinkPhase = 'wait'; blinkTimer = baseInterval * (0.7 + Math.random() * 0.8); }
      }
      break;
    case 'doubleWait':
      blinkDoubleWait -= dt;
      if (blinkDoubleWait <= 0) blinkPhase = 'closing';
      break;
  }
  trySetExpr('blink', blinkVal);
}

// ═══════════════════════════════════════════════════
// LIPSYNC REAL — audio del backend + timeline de visemes (lipsync.py)
// ═══════════════════════════════════════════════════
// Un <audio> de HTML en vez de Web Audio API: el overlay GTK es click-through
// por diseño (_aplicar_click_through en rem_overlay.py), así que nunca puede
// recibir un gesto de usuario real — un AudioContext se queda 'suspended'
// para siempre ahí adentro, y set_media_playback_requires_user_gesture(False)
// en WebKit2 no lo destrababa porque esa política es solo para elementos de
// medios, no para la Web Audio API. HTMLMediaElement.play() no tiene esa
// restricción de gesto en este WebView, así que elimina el problema de raíz
// en vez de trabajar alrededor de él.
const _audioEl = new Audio();
let _audioActivo = false; // true entre 'playing' y 'ended'/'error'

function _avanzarCola() {
  _audioActivo = false;
  _timeline = [];
  if (_audioPlayQueue.length > 0) {
    _reproducirSiguienteDeCola();
  } else {
    _audioPlaying = false;
    if (estado === 'talking') estado = 'idle';
  }
}

// Logs de diagnóstico explícitos alrededor de toda la reproducción — hasta
// tener el volcado de consola del overlay a rem_overlay.log (ver rem_overlay.py),
// esto era la única forma indirecta de sospechar qué estaba pasando.
_audioEl.addEventListener('playing', () => {
  console.log('[Lipsync] evento "playing" ->', _audioEl.src);
  _audioActivo = true;
  estado = 'talking';
});
_audioEl.addEventListener('ended', _avanzarCola);
// MediaError.code: 1=ABORTED 2=NETWORK 3=DECODE 4=SRC_NOT_SUPPORTED.
// code=3 confirmaría que WebKit no puede decodificar el WAV (RVC produce
// 40000 Hz, un sample rate inusual) — distinto de un NotAllowedError de
// play(), que sería la política de autoplay todavía activa.
const _MEDIA_ERROR_NOMBRES = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'SRC_NOT_SUPPORTED' };
_audioEl.addEventListener('error', () => {
  const err = _audioEl.error;
  console.error('[Lipsync] evento "error" para', _audioEl.src,
    '| code:', err?.code, `(${_MEDIA_ERROR_NOMBRES[err?.code] ?? '?'})`,
    '| message:', err?.message,
    '| readyState:', _audioEl.readyState, '| networkState:', _audioEl.networkState);
  _avanzarCola();
});
_audioEl.addEventListener('stalled', () => {
  console.warn('[Lipsync] evento "stalled" para', _audioEl.src,
    '| readyState:', _audioEl.readyState, '| networkState:', _audioEl.networkState);
});

// Morph targets vrc.* que puede tocar el timeline (ver lipsync.py FONEMA_A_VISEME)
const VISEME_NAMES = [
  'vrc.v_aa', 'vrc.v_e', 'vrc.v_ih', 'vrc.v_oh', 'vrc.v_ou',
  'vrc.v_pp', 'vrc.v_ff', 'vrc.v_ss', 'vrc.v_dd', 'vrc.v_kk',
  'vrc.v_nn', 'vrc.v_rr', 'vrc.v_ch', 'vrc.v_sil',
];

// Índices confirmados por inspección directa del glTF (ver CLAUDE.md, "Cómo
// three.js construye morphTargetDictionary"): las 72 primitives de Body.baked
// comparten el mismo extras.targetNames, en el mismo orden, así que un índice
// es válido en las 72 por igual — no depende del nombre que le asigne three-vrm
// en runtime (que en este modelo es genérico, tipo "Bodybaked_NN").
const VISEME_INDEX = {
  'vrc.v_aa': 4,  'vrc.v_ch': 5,  'vrc.v_dd': 6,  'vrc.v_e': 7,   'vrc.v_ff': 8,
  'vrc.v_ih': 9,  'vrc.v_kk': 10, 'vrc.v_nn': 11, 'vrc.v_oh': 12, 'vrc.v_ou': 13,
  'vrc.v_pp': 14, 'vrc.v_rr': 15, 'vrc.v_sil': 16, 'vrc.v_ss': 17, 'vrc.v_th': 18,
};
const VISEME_INDEX_MAX = 18; // índice más alto de la tabla — una malla necesita al menos esto+1 influences

const JAW_MAX_RAD        = 0.25;  // apertura máxima del hueso jaw, en radianes (eje X)
const JAW_SMOOTH_SPEED   = 20;    // suavizado exponencial (lerp con dt)

let _visemeIndex    = {};  // nombre canónico (VISEME_NAMES) -> [{mesh, idx}, ...]  (vía "nombre")
let _visemeMeshesPorIndice = []; // mallas con morphTargetInfluences.length > VISEME_INDEX_MAX (vía "indice")
let _audioPlayQueue = [];  // cola FIFO: {url, timeline} — para no solapar frases
let _audioPlaying  = false;
let _timeline       = [];
let _timelineIdx     = 0;
let _jawApertura     = 0;

// Tres vías de lipsync, en orden de preferencia:
//   'indice'           — escribe morphTargetInfluences[índice] directo en TODAS las
//                         mallas que lo tengan (72 primitives en este modelo). Preferida:
//                         los 15 visemes completos, no depende de nombres.
//   'nombre'           — busca los 15 nombres vrc.* en morphTargetDictionary. Portable a
//                         otros modelos que sí expongan esos nombres.
//   'expressionManager' — último recurso: 5 presets estándar de VRM (aa/ee/ih/oh/ou) vía
//                         setValue(), para modelos sin ninguno de los morphs vrc.*.
let _viaLipsync = 'expressionManager';
const VRM_VISEME_KEYS = ['aa', 'ee', 'ih', 'oh', 'ou'];

// Normaliza nombres de morph target para comparar sin depender de mayúsculas/
// puntuación exacta (defensivo: GLTFLoader usa los nombres crudos de
// extras.targetNames sin sanitizar, pero no cuesta nada ser tolerante).
function _normalizarNombreMorph(s) {
  return s.toLowerCase().replace(/[^a-z0-9]/g, '');
}

function localizarMallaFacial() {
  _visemeIndex = {};
  for (const nombre of VISEME_NAMES) _visemeIndex[nombre] = [];
  _visemeMeshesPorIndice = [];

  const porNormalizado = {};
  for (const nombre of VISEME_NAMES) porNormalizado[_normalizarNombreMorph(nombre)] = nombre;

  let mallasConDiccionario = 0;
  let mallasSinDiccionario = 0;
  const clavesUnicas = new Set();   // vía B: unión de TODAS las claves reales vistas
  const mallasGrandes = [];         // vía B: mallas con > 40 claves (candidatas a "la" malla facial)

  vrm.scene.traverse(obj => {
    if (!obj.isMesh) return;

    // Vía "índice": cualquier malla con espacio suficiente en morphTargetInfluences
    // para cubrir el índice más alto de la tabla (18), sin importar el nombre.
    // Body.baked se carga como 72 Mesh separadas (una por primitive/material) —
    // TODAS comparten el mismo orden de morph targets, así que hay que registrarlas
    // todas: escribir el índice en una sola movería la cara a trozos.
    if (Array.isArray(obj.morphTargetInfluences) && obj.morphTargetInfluences.length > VISEME_INDEX_MAX) {
      _visemeMeshesPorIndice.push(obj);
    }

    const morphCount = obj.geometry?.morphAttributes?.position?.length ?? 0;

    if (!obj.morphTargetDictionary) {
      if (morphCount > 0) {
        // GLTFLoader solo construye morphTargetDictionary si
        // mesh.morphTargetInfluences.length === extras.targetNames.length.
        // Si este primitive trae una cantidad de morph attributes distinta a
        // los 59 de targetNames (común cuando el exportador reparte los
        // morphs de forma desigual entre primitives), el diccionario NUNCA
        // se crea — sin importar el nombre. Buscá en la consola el warning
        // "THREE.GLTFLoader: Invalid extras.targetNames length" para confirmarlo.
        mallasSinDiccionario++;
        console.warn(`[Lipsync] malla "${obj.name}": ${morphCount} morph attributes en la geometría` +
          ` pero SIN morphTargetDictionary (mismatch de longitud con extras.targetNames — ver warning de GLTFLoader arriba)`);
      }
      return;
    }

    mallasConDiccionario++;
    const claves = Object.keys(obj.morphTargetDictionary);
    console.log(`[Lipsync] malla "${obj.name}" — ${claves.length} morph targets:`, claves.join(', '));
    for (const c of claves) clavesUnicas.add(c);
    if (claves.length > 40) mallasGrandes.push(obj.name);

    for (const clave of claves) {
      const canonico = porNormalizado[_normalizarNombreMorph(clave)];
      if (canonico) {
        _visemeIndex[canonico].push({ mesh: obj, idx: obj.morphTargetDictionary[clave] });
      }
    }
  });

  const resueltosPorNombre = VISEME_NAMES.filter(n => _visemeIndex[n].length > 0);
  console.log(`[Lipsync] mallas registradas para índice directo: ${_visemeMeshesPorIndice.length}`);
  console.log(`[Lipsync] visemes resueltos por nombre: ${resueltosPorNombre.length}/${VISEME_NAMES.length} ->`, resueltosPorNombre);

  // Vía B — diagnóstico agregado: qué nombres hay REALMENTE en los diccionarios,
  // de un vistazo, sin tener que revisar los logs por-malla de arriba uno a uno.
  console.log(`[Lipsync][diag] claves únicas en los ${mallasConDiccionario} diccionarios `
            + `(${clavesUnicas.size} distintas):`, [...clavesUnicas].sort());
  console.log('[Lipsync][diag] mallas con más de 40 claves:', mallasGrandes);

  // Decidir qué vía de lipsync usar, en orden de preferencia: índice > nombre > expressionManager.
  if (_visemeMeshesPorIndice.length > 0) {
    _viaLipsync = 'indice';
    console.log(`[Lipsync] VÍA ACTIVA: índice directo — 15/15 visemes, `
              + `${_visemeMeshesPorIndice.length} malla(s) registrada(s)`);
  } else if (resueltosPorNombre.length > 0) {
    _viaLipsync = 'nombre';
    console.log(`[Lipsync] VÍA ACTIVA: nombre (morphTargetDictionary) — `
              + `${resueltosPorNombre.length}/${VISEME_NAMES.length} visemes resueltos`);
  } else {
    _viaLipsync = 'expressionManager';
    console.warn(`[Lipsync] VÍA ACTIVA: fallback a vrm.expressionManager (aa/ee/ih/oh/ou) — `
               + `${VRM_VISEME_KEYS.length}/${VISEME_NAMES.length} visemes (parciales), `
               + `sin morph targets vrc.* ni por índice ni por nombre.`,
               'expressionManager expone:', vrm.expressionManager?.expressions?.map(e => e.expressionName) ?? []);
  }

  diagnosticarExpressionBinds();
}

// Investigación (no toca el sistema de lipsync): para cada expresión de
// expressionManager, qué (malla, índice de morph) apunta realmente cada bind.
// Sirve para recuperar el mapeo real cuando morphTargetDictionary trae nombres
// genéricos (ej. "Bodybaked_NN") en vez de los vrc.* originales del glTF —
// los binds del VRM apuntan a (malla, índice) directo, sin pasar por el nombre.
function diagnosticarExpressionBinds() {
  if (!vrm?.expressionManager) return;
  const expresiones = vrm.expressionManager.expressions ?? [];
  console.log(`[Diag] expressionManager: ${expresiones.length} expresiones`);
  for (const expr of expresiones) {
    const binds = expr._binds ?? [];
    if (binds.length === 0) {
      console.log(`[Diag] expresión "${expr.expressionName}" — sin binds de morph target`);
      continue;
    }
    console.log(`[Diag] expresión "${expr.expressionName}" — ${binds.length} bind(s):`);
    for (const bind of binds) {
      const mallas = (bind.primitives ?? []).map(p => p.name || '<sin name>').join(', ');
      console.log(`    -> malla(s)=[${mallas}]  morph_index=${bind.index}  weight=${bind.weight}`);
    }
  }
}

// Aplica un viseme vrc.* (por su nombre canónico) según la vía activa.
// 'indice': escribe el índice fijo de VISEME_INDEX en TODAS las mallas
// registradas (72 primitives comparten el mismo orden — hay que escribir en
// todas, si no la cara se movería a trozos). 'nombre': usa el índice resuelto
// por morphTargetDictionary en localizarMallaFacial().
function setViseme(name, value) {
  if (_viaLipsync === 'indice') {
    const idx = VISEME_INDEX[name];
    if (idx === undefined) return;
    for (const mesh of _visemeMeshesPorIndice) {
      mesh.morphTargetInfluences[idx] = value;
    }
    return;
  }

  const entradas = _visemeIndex[name];
  if (!entradas) return;
  for (const { mesh, idx } of entradas) {
    mesh.morphTargetInfluences[idx] = value;
  }
}

// Encola audio+timeline recibidos por WS; reproduce en orden, nunca solapa frases.
function encolarAudio(url, timeline) {
  _audioPlayQueue.push({ url, timeline });
  if (!_audioPlaying) _reproducirSiguienteDeCola();
}

function _reproducirSiguienteDeCola() {
  const siguiente = _audioPlayQueue.shift();
  if (!siguiente) { _audioPlaying = false; return; }
  _audioPlaying = true;

  _timeline    = siguiente.timeline || [];
  _timelineIdx = 0;
  _audioEl.src = siguiente.url;

  console.log('[Lipsync] llamando a play() para', siguiente.url);
  const promesa = _audioEl.play();
  if (promesa?.then) {
    promesa
      .then(() => console.log('[Lipsync] play() resuelto (promesa) para', siguiente.url))
      .catch(err => console.error('[Lipsync] play() rechazado para', siguiente.url,
        '- name:', err?.name, '| message:', err?.message));
  }
}

// Estado del viseme activo, calculado una vez por frame y reusado por las dos
// fases de abajo (pre/post vrm.update). null si no hay audio sonando.
let _estadoVisemeFrame = null;

function _calcularEstadoViseme() {
  if (!_audioActivo || _timeline.length === 0) return null;
  // audio.currentTime ya es la posición dentro del archivo actual — no hace
  // falta llevar un start time aparte como con Web Audio API. A 60fps sobra
  // de precisión para el lipsync.
  const t = _audioEl.currentTime;

  while (_timelineIdx < _timeline.length - 1 && _timeline[_timelineIdx + 1].t <= t) _timelineIdx++;

  const actual    = _timeline[_timelineIdx];
  const siguiente = _timeline[_timelineIdx + 1] ?? actual;

  let alpha = 0;
  if (siguiente !== actual) {
    const span = siguiente.t - actual.t;
    alpha = span > 0 ? clamp((t - actual.t) / span, 0, 1) : 1;
  }
  return { actual, siguiente, alpha };
}

// FASE 1 — ANTES de vrm.update(dt). Necesaria solo para la vía de fallback:
// expressionManager.update() (llamado dentro de vrm.update()) es lo que consume
// los pesos puestos por setValue() y escribe los morphs reales — si los
// seteamos después, vrm.update() ya pasó y no hacen efecto hasta el frame
// siguiente (mismo motivo por el que updateExpressions()/updateBlink() ya
// corrían antes de vrm.update(), más arriba en animate()).
function aplicarVisemesPreUpdate() {
  _estadoVisemeFrame = _calcularEstadoViseme();
  if (_viaLipsync !== 'expressionManager') return;

  const pesos = { aa: 0, ee: 0, ih: 0, oh: 0, ou: 0 };
  if (_estadoVisemeFrame) {
    const { actual, siguiente, alpha } = _estadoVisemeFrame;
    if (actual.viseme_vrm) pesos[actual.viseme_vrm] += actual.peso_vrm * (1 - alpha);
    if (siguiente !== actual && siguiente.viseme_vrm) pesos[siguiente.viseme_vrm] += siguiente.peso_vrm * alpha;
  }
  for (const key of VRM_VISEME_KEYS) trySetExpr(key, pesos[key]);
}

// FASE 2 — DESPUÉS de vrm.update(dt). Los morph targets vrc.* van acá porque
// expressionManager escribe cero en SUS morphs en cada update() (no toca los
// vrc.* directos, así que a esos sí hay que aplicarlos después). El jaw
// siempre va acá, en ambas vías, vía getRawBoneNode (hueso real, no el
// proxy normalizado — ver CLAUDE.md).
function aplicarVisemesPostUpdate(dt) {
  let objetivoApertura = 0;

  if (_viaLipsync !== 'expressionManager') {
    if (_estadoVisemeFrame) {
      const { actual, siguiente, alpha } = _estadoVisemeFrame;
      for (const nombre of VISEME_NAMES) setViseme(nombre, 0);
      setViseme(actual.viseme, 1 - alpha);
      if (siguiente !== actual) setViseme(siguiente.viseme, alpha);
    } else {
      for (const nombre of VISEME_NAMES) setViseme(nombre, 0);
    }
  }

  if (_estadoVisemeFrame) objetivoApertura = _estadoVisemeFrame.actual.apertura ?? 0;

  _jawApertura = lerp(_jawApertura, objetivoApertura, dt * JAW_SMOOTH_SPEED);
  const jawB = vrm?.humanoid?.getRawBoneNode('jaw');
  if (jawB) jawB.rotation.x = _jawApertura * JAW_MAX_RAD;
}

// ═══════════════════════════════════════════════════
// SISTEMA DE MIRADA POR ESTADO
// ═══════════════════════════════════════════════════
const lookCur = { x: 0, y: 0 };
let lookDrift = { x: 0, y: 0 };
let lookChangeTimer = 2 + Math.random() * 3;

function updateLook(dt, t) {
  lookChangeTimer -= dt;
  if (lookChangeTimer <= 0 && (estado === 'idle' || estado === 'happy' || estado === 'sad')) {
    lookDrift.x = (Math.random() - 0.5) * 0.22;
    lookDrift.y = (Math.random() - 0.5) * 0.10;
    lookChangeTimer = 2.5 + Math.random() * 3.5;
  }

  let tgtX, tgtY, lerpSpd;
  switch (estado) {
    case 'thinking':
      tgtX = -0.18; tgtY = 0.12; lerpSpd = 1.2; // arriba-izquierda
      break;
    case 'talking':
      tgtX = Math.sin(t * 0.12) * 0.04; tgtY = Math.sin(t * 0.09) * 0.03; lerpSpd = 2.5;
      break;
    default:
      tgtX = lookDrift.x; tgtY = lookDrift.y; lerpSpd = 1.3;
  }
  lookCur.x = lerp(lookCur.x, tgtX, dt * lerpSpd);
  lookCur.y = lerp(lookCur.y, tgtY, dt * lerpSpd);
}

// ═══════════════════════════════════════════════════
// SISTEMA DE SPRINGS (AMORTIGUADORES)
// ═══════════════════════════════════════════════════
class Spring {
  constructor(init = 0, k = 20, d = 6) { this.v = init; this.vel = 0; this.k = k; this.d = d; }
  step(target, dt) {
    const f = -this.k * (this.v - target) - this.d * this.vel;
    this.vel += f * dt; this.v += this.vel * dt; return this.v;
  }
  tune(k, d) { this.k = k; this.d = d; }
}

const spr = {
  hX: new Spring(0,    18, 5.5),
  hY: new Spring(0,    18, 5.5),
  hZ: new Spring(-0.04,18, 5.5),
  bZ: new Spring(0,    14, 4.5),
  bX: new Spring(0,    12, 4.0),
  ruZ: new Spring(-1.28, 22, 7.0),
  luZ: new Spring( 1.28, 22, 7.0),
  ruX: new Spring(0.05,  16, 5.0),
  luX: new Spring(0.05,  16, 5.0),
};

// Perfiles de stiffness/damping por estado
const SPRING_CFG = {
  idle:      [18, 5.5, 14, 4.5],
  talking:   [20, 5.0, 16, 4.0],
  thinking:  [14, 6.0, 10, 5.0],
  happy:     [22, 4.5, 18, 3.5],
  sad:       [10, 7.0,  8, 6.0],
  angry:     [26, 3.0, 22, 2.8], // menos damping = más brusco
  surprised: [30, 4.0, 25, 3.5],
};

function applySpringConfig() {
  const [hk, hd, bk, bd] = SPRING_CFG[estado] ?? SPRING_CFG.idle;
  spr.hX.tune(hk, hd); spr.hY.tune(hk, hd); spr.hZ.tune(hk, hd);
  spr.bZ.tune(bk, bd); spr.bX.tune(bk, bd);
}

// ═══════════════════════════════════════════════════
// POSE PROCEDURAL POR ESTADO
// ═══════════════════════════════════════════════════
let surprisedSnap = 0;

function getStatePose(t) {
  // Velocidades de animación por estado
  const SPEEDS = { idle:1.0, talking:1.8, thinking:0.5, happy:1.5, sad:0.4, angry:1.3, surprised:2.0 };
  const ts = t * (SPEEDS[estado] ?? 1.0); // tiempo escalado por emoción

  // Respiración siempre presente
  const breath = Math.sin(ts * 0.8 / (SPEEDS[estado] ?? 1.0)) * 0.018;

  switch (estado) {

    case 'idle':
      return {
        hX: Math.sin(ts * 0.3) * Math.sin(ts * 0.71) * 0.025,
        hY: Math.sin(ts * 0.2) * Math.sin(ts * 0.53) * 0.018,
        hZ: -0.04 + Math.sin(ts * 0.4) * Math.sin(ts * 0.61) * 0.015,
        bZ: Math.sin(ts * 0.4) * 0.008,
        bX: breath,
        ruZ: -1.28, luZ: 1.28, ruX: 0.05, luX: 0.05,
      };

    case 'talking':
      return {
        hX: Math.sin(ts * 0.45) * Math.sin(ts * 1.27) * 0.09,
        hY: Math.sin(ts * 0.54) * Math.sin(ts * 0.95) * 0.12,
        hZ: Math.sin(ts * 0.72) * Math.sin(ts * 1.27) * 0.13,
        bZ: Math.sin(ts * 1.2)  * 0.025,
        bX: breath,
        ruZ: -1.28,
        luZ: 1.18,  // brazo izquierdo ligeramente elevado (gesto)
        ruX: Math.sin(ts * 1.1) * 0.04 + 0.05,
        luX: Math.sin(ts * 1.3) * 0.07 + 0.09,
      };

    case 'thinking': {
      return {
        hX:  0.18 + Math.sin(ts * 0.1) * 0.018,
        hY:  0.15 + Math.sin(ts * 0.13) * 0.012,
        hZ: -0.22 + Math.sin(ts * 0.2)  * 0.012,
        bZ: Math.sin(ts * 0.2) * 0.005,
        bX: breath * 0.7,
        ruZ: -1.05, // brazo derecho elevado (pensativa, mano cerca de la cara)
        luZ: 1.28,
        ruX: 0.15, luX: 0.05,
      };
    }

    case 'happy': {
      const bob = Math.sin(ts * 2.5) * 0.015; // pequeño rebote de cabeza
      return {
        hX: bob + Math.sin(ts * 0.6) * 0.03,
        hY: Math.sin(ts * 0.7) * 0.045,
        hZ: Math.sin(ts * 0.8) * 0.055,
        bZ: Math.sin(ts * 0.8) * 0.022,
        bX: breath * 1.2,
        ruZ: -1.15, luZ: 1.15, // brazos más abiertos (postura alegre)
        ruX: 0.09, luX: 0.09,
      };
    }

    case 'sad':
      return {
        hX:  0.25 + Math.sin(ts * 0.15) * 0.012, // cabeza caída
        hY:  Math.sin(ts * 0.1) * 0.008,
        hZ:  0.05,
        bZ:  Math.sin(ts * 0.2) * 0.004,
        bX:  0.05 + breath * 0.5, // spine ligeramente inclinada
        ruZ: -1.30, luZ: 1.30,
        ruX: 0.02, luX: 0.02,
      };

    case 'angry': {
      // Micro-sacudidas bruscos (sin suavidad)
      const jZ = Math.sin(ts * 12) * Math.sign(Math.sin(ts * 7)) * 0.018;
      const jY = Math.sin(ts *  9) * Math.sign(Math.sin(ts * 5)) * 0.012;
      return {
        hX: 0.06,
        hY: jY,
        hZ: jZ,
        bZ: Math.sin(ts * 1.5) * 0.018,
        bX: 0.02,
        ruZ: -1.24, luZ: 1.24,
        ruX: 0.08, luX: 0.08,
      };
    }

    case 'surprised': {
      const snap = clamp(surprisedSnap, 0, 1);
      return {
        hX: -0.20 * snap + Math.sin(ts * 0.3) * 0.018 * (1 - snap),
        hY:  Math.sin(ts * 0.2) * 0.015,
        hZ:  Math.sin(ts * 0.4) * 0.010,
        bZ: -0.04 * snap,
        bX: -0.03 * snap + breath,
        ruZ: -1.28 - 0.12 * snap,
        luZ:  1.28 + 0.12 * snap,
        ruX: 0.12, luX: 0.12,
      };
    }

    default:
      return { hX:0, hY:0, hZ:-0.04, bZ:0, bX:0, ruZ:-1.28, luZ:1.28, ruX:0.05, luX:0.05 };
  }
}

// ═══════════════════════════════════════════════════
// ANIMACIÓN DE CAMINATA ORGÁNICA
// ═══════════════════════════════════════════════════
function updateWalking(dt) {
  const shouldWalk = petEstado === 'walking' && estado !== 'talking' && estado !== 'thinking';

  // Blend con aceleración/desaceleración gradual
  walkBlend = clamp(walkBlend + (shouldWalk ? dt * 2.5 : -dt * 3.0), 0, 1);

  // Bug 2 fix: charDir=1→derecha=1.45π, charDir=-1→izquierda=0.55π
  const tgtRotY = walkBlend > 0.01
    ? (charDir > 0 ? Math.PI * 1.45 : Math.PI * 0.55)
    : Math.PI;
  if (vrm) vrm.scene.rotation.y = lerp(vrm.scene.rotation.y, tgtRotY, dt * 5);

  if (walkBlend < 0.001) return;

  walkPhase = (walkPhase + dt * 2.2 * walkBlend) % 1;
  const wt = walkPhase * Math.PI * 2;
  const wb = walkBlend;

  // Caderas: bob vertical vía scene.position.y + rock lateral en hueso
  const hipBob  = -Math.abs(Math.sin(wt)) * 0.022 * wb;
  const hipRock =  Math.sin(wt) * 0.055 * wb;
  if (vrm) vrm.scene.position.y = _modeloPositionY + hipBob;   // bob se SUMA sobre la Y del encuadre, no la reemplaza
  const hipB = getB('hips');
  if (hipB) { hipB.rotation.z = hipRock; hipB.rotation.x = Math.sin(wt * 0.5) * 0.015 * wb; }

  // Torso: contra-rotación respecto a caderas (se añade sobre pose del estado)
  const spineB = getB('spine');
  if (spineB) spineB.rotation.z += -hipRock * 0.4;

  // Piernas
  const legSwing = 0.32 * wb, kneeFlex = 0.40 * wb;
  const lul = getB('leftUpperLeg');  if (lul) lul.rotation.x =  Math.sin(wt) * legSwing;
  const rul = getB('rightUpperLeg'); if (rul) rul.rotation.x = -Math.sin(wt) * legSwing;
  const lll = getB('leftLowerLeg');  if (lll) lll.rotation.x = Math.max(0, -Math.sin(wt)) * kneeFlex * 1.5;
  const rll = getB('rightLowerLeg'); if (rll) rll.rotation.x = Math.max(0,  Math.sin(wt)) * kneeFlex * 1.5;
  const lft = getB('leftFoot');      if (lft) lft.rotation.x =  Math.sin(wt) * 0.15 * wb;
  const rft = getB('rightFoot');     if (rft) rft.rotation.x = -Math.sin(wt) * 0.15 * wb;

  // Brazos: swing opuesto a piernas (brazo derecho con pierna izquierda)
  const armSwing = 0.22 * wb;
  const rua = getB('rightUpperArm'), lua = getB('leftUpperArm');
  if (rua) rua.rotation.x += Math.sin(wt + Math.PI) * armSwing;
  if (lua) lua.rotation.x += Math.sin(wt) * armSwing;

  // Cabeza: mira levemente hacia donde camina
  const headB = getB('head');
  if (headB) headB.rotation.y += charDir * 0.04 * wb;
}

// ═══════════════════════════════════════════════════
// LOOP PRINCIPAL
// ═══════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!vrm) { renderer.render(scene, camera); return; }

  const t = clock.getElapsedTime();

  // Detectar cambio de estado
  if (estado !== prevEstado) {
    if (estado === 'surprised') surprisedSnap = 1.0;
    applySpringConfig();
    prevEstado = estado;
  }

  // Decaer snap de sorpresa
  if (surprisedSnap > 0) surprisedSnap = Math.max(0, surprisedSnap - dt * 1.8);

  // ── Sistemas de expresión / parpadeo / mirada / caminata ──
  updateExpressions(dt);
  updateBlink(dt);
  aplicarVisemesPreUpdate(); // vía fallback: expressionManager necesita el valor ANTES de vrm.update()
  updateLook(dt, t);
  tickPet(dt);

  // ── Pose procedural del estado actual ──
  const pose = getStatePose(t);

  // Cabeza: pose base + mirada + spring
  const tHX = pose.hX - lookCur.y * 0.32;
  const tHY = pose.hY - lookCur.x * 0.26;
  const tHZ = pose.hZ + lookCur.x * 0.48;

  const headB = getB('head'), neckB = getB('neck');
  if (headB) {
    headB.rotation.x = spr.hX.step(tHX, dt);
    headB.rotation.y = spr.hY.step(tHY, dt);
    headB.rotation.z = spr.hZ.step(tHZ, dt);
  }
  if (neckB) {
    neckB.rotation.x = spr.hX.v * 0.38;
    neckB.rotation.y = spr.hY.v * 0.30;
    neckB.rotation.z = spr.hZ.v * 0.28;
  }

  // Cuerpo
  const spineB = getB('spine'), chestB = getB('upperChest') ?? getB('chest');
  const bZ = spr.bZ.step(pose.bZ, dt);
  const bX = spr.bX.step(pose.bX, dt);
  if (spineB) { spineB.rotation.z = bZ; spineB.rotation.x = bX; }
  if (chestB) { chestB.rotation.x = Math.sin(t * 0.8) * 0.018; } // respiración visible en pecho

  // Brazos — pose natural + variaciones emocionales
  const rua = getB('rightUpperArm'), lua = getB('leftUpperArm');
  const rla = getB('rightLowerArm'), lla = getB('leftLowerArm');
  if (rua) { rua.rotation.z = spr.ruZ.step(pose.ruZ, dt); rua.rotation.x = spr.ruX.step(pose.ruX, dt); }
  if (lua) { lua.rotation.z = spr.luZ.step(pose.luZ, dt); lua.rotation.x = spr.luX.step(pose.luX, dt); }
  if (rla) { rla.rotation.x = -0.15; rla.rotation.z = -0.08; }
  if (lla) { lla.rotation.x = -0.15; lla.rotation.z =  0.08; }

  // Caminata: se añade SOBRE los valores ya aplicados (+=)
  updateWalking(dt);

  vrm.update(dt); // spring bones + morphs internos del VRM — después de posar los huesos

  // Remedir con huesos ahora que el modelo ya se posó al menos un frame
  // (no en el mismo frame de la carga, donde el esqueleto podía no reflejar
  // la pose real todavía).
  if (_medirHuesosPendiente) {
    _medirHuesosPendiente = false;
    vrm.scene.updateMatrixWorld(true); // asegurar matrices de mundo frescas para getWorldPosition
    const medida = medirAlturaHuesos();
    if (medida) {
      console.log(`[Encuadre] altura Box3=${_modeloAlturaBox3.toFixed(3)}u  `
                + `altura huesos=${medida.altura.toFixed(3)}u`);
      _modeloAlturaLocal = medida.altura;
      _modeloCentroLocal = medida.centro;
      recalcularEncuadre(); // vuelve a fijar z/position.y — su propio log muestra el z resultante
    }
  }

  // Visemes (vía vrc.*) + jaw: DESPUÉS de vrm.update(), porque expressionManager
  // escribe cero en SUS morphs en cada update() y borraría lo que hubiéramos
  // puesto ahí (por eso la vía de fallback se aplica ANTES, ver aplicarVisemesPreUpdate).
  aplicarVisemesPostUpdate(dt);

  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  renderer.setSize(window.innerWidth, window.innerHeight);
  // charX y anchorY son fracciones normalizadas — se preservan solas. Solo hay
  // que recalcular a qué coordenada de mundo corresponden con el nuevo aspect.
  recalcularEncuadre();
});

// ═══════════════════════════════════════════════════
// WEBSOCKET — con límite de reintentos
// ═══════════════════════════════════════════════════
let _wsRetries = 0;
let _ws = null;

(function conectar() {
  if (_wsRetries >= CONFIG.ws.maxRetries) {
    console.warn('[WS] Máximo de reintentos alcanzado, deteniendo reconexión');
    return;
  }
  _ws = new WebSocket(`ws://localhost:${CONFIG.ws.port}`);
  _ws.onopen = () => {
    console.log('[WS] conectado');
    _wsRetries = 0;
  };
  _ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.tipo === 'audio') {
        console.log('[Lipsync] mensaje de audio recibido, url=', d.url, '| eventos de timeline:', d.timeline?.length);
        encolarAudio(d.url, d.timeline);
      } else if (d.estado) {
        estado = d.estado;
      }
    } catch (err) {
      console.warn('[WS] JSON inválido:', err);
    }
  };
  _ws.onclose = () => {
    _wsRetries++;
    setTimeout(conectar, CONFIG.ws.retryDelay);
  };
  _ws.onerror = e => console.warn('[WS] Error de conexión:', e.type);
})();

window.setEstado = s => { estado = s; };
</script>
</body>
</html>
