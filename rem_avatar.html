<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<!-- Marca <html> como escritorio (y fijado) ANTES de que pinte nada: el fondo
     transparente y el ocultar el panel de chat no pueden esperar al script
     principal (un frame de fondo oscuro sobre el escritorio sería un parpadeo
     visible). ?modo=overlay es un alias de escritorio fijado en la esquina. -->
<script>{ const q = new URLSearchParams(location.search), m = q.get('modo');
  if (m === 'overlay' || m === 'escritorio') document.documentElement.classList.add('escritorio');
  if (m === 'overlay' || (m === 'escritorio' && q.get('fijo') === '1')) {
    document.documentElement.classList.add('fijado');
    document.documentElement.style.setProperty('--aire-fijo', `${Number(q.get('aire')) || 0}px`);
  } }</script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#05000f; overflow:hidden; width:100vw; height:100vh; }
  canvas { display:block; }

  /* ── Caja de texto del escritorio FIJADO en la esquina (el antiguo modo
     overlay, avatar/overlay_ui.js): solo se ve con <html class="fijado">. Qué
     recibe el ratón lo decide la región de entrada de GTK (escritorio.py). */
  #ov-root { display: none; }
  html.fijado #ov-root {
    /* Dentro del cuadro de Yoru, no en el aire lateral (ver config.toml [overlay] aire_lateral). */
    position: fixed; left: calc(var(--aire-fijo, 0px) + 10px); right: calc(var(--aire-fijo, 0px) + 10px); bottom: 10px;
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    pointer-events: none;
    z-index: 10;
  }
  #ov-status {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px;
    background: rgba(6,12,18,0.58);
    border: 1px solid rgba(43,232,255,0.20);
    color: #bfe9f3; font-size: 11px; letter-spacing: 0.02em;
    opacity: 0; transition: opacity .18s ease;
    pointer-events: none;
  }
  #ov-status.visible { opacity: 1; }
  #ov-status::before {
    content: ''; width: 6px; height: 6px; border-radius: 50%; flex: 0 0 auto;
    background: #2be8ff;
  }
  #ov-status.pensando::before, #ov-status.hablando::before { animation: chat-pulse 1s ease-in-out infinite; }
  #ov-status.escuchando { border-color: rgba(255,90,110,0.55); color: #ffd6dc; }
  #ov-status.escuchando::before { background: #ff5a6e; animation: chat-pulse 0.8s ease-in-out infinite; }
  #ov-box {
    width: 100%;
    background: rgba(6,12,18,0.55);
    border: 1px solid rgba(43,232,255,0.26);
    border-radius: 12px;
    padding: 3px;
    pointer-events: auto;
  }
  #ov-input {
    width: 100%;
    background: transparent; border: none; outline: none;
    color: #eaf6ff; font: inherit; font-size: 13px;
    padding: 7px 10px;
  }
  #ov-input::placeholder { color: rgba(190,225,235,0.45); }
  #ov-input.transcrito { color: #7ff0ff; font-style: italic; }
  #ov-box:focus-within { border-color: rgba(43,232,255,0.6); background: rgba(6,12,18,0.72); }

</style>
<link rel="stylesheet" href="/avatar/temas.css">
<link rel="stylesheet" href="/avatar/panel_chat.css">
<link rel="stylesheet" href="/avatar/escritorio.css">
</head>
<body>
<!-- El script del avatar vive en avatar/ (ver avatar/README.md): primero el módulo con
     three/three-vrm y después los scripts clásicos, en este orden (comparten ámbito global). -->
<script type="module" src="/avatar/dependencias.mjs"></script>
<script defer src="/avatar/config.js"></script>
<script defer src="/avatar/escena.js"></script>
<script defer src="/avatar/modelo.js"></script>
<script defer src="/avatar/cara.js"></script>
<script defer src="/avatar/cuerpo.js"></script>
<script defer src="/avatar/clips.js"></script>
<script defer src="/avatar/director.js"></script>
<script defer src="/avatar/bucle.js"></script>
<script defer src="/avatar/chat_local.js"></script>
<script defer src="/avatar/panel_chat.js"></script>
<script defer src="/avatar/overlay_ui.js"></script>
<script defer src="/avatar/escritorio_ui.js"></script>
<script defer src="/avatar/ws.js"></script>
</body>
</html>
