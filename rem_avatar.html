  // más alto = menos retardo. Se actualiza siempre, incluso en 'thinking'
  // (donde yawFinal/pitchFinal son el punto fijo -10/8 más saccades) — es
  // animate() quien decide NO aplicar esta contribución en 'thinking',
  // porque ese estado ya tiene su propio desvío de cabeza fijo vía
  // updateLook() y sumar los dos duplicaría el giro.
  _cabezaMiradaYaw   = lerp(_cabezaMiradaYaw,   yawFinal,   dt * CONFIG.mirada.cabezaVelocidad);
  _cabezaMiradaPitch = lerp(_cabezaMiradaPitch, pitchFinal, dt * CONFIG.mirada.cabezaVelocidad);

  // Diagnóstico pedido explícitamente: el yaw/pitch que se le pide a los
  // ojos cada 2s, para poder ver a simple vista si se está saturando contra
  // el rango real del modelo (ver el log de rangos al cargar el VRM, más
  // arriba — con xRange=90/yRange=10 en las cuatro curvas, un pedido de
  // 20-30° ya se recorta a apenas 2-3° reales).
  _miradaLogTimer -= dt;
  if (_miradaLogTimer <= 0) {
    _miradaLogTimer = 2;
    console.log(`[Mirada] pedido yaw=${yawFinal.toFixed(1)}° pitch=${pitchFinal.toFixed(1)}°`);
  }
}

// ═══════════════════════════════════════════════════
// DEDOS — curvatura de reposo (30 huesos, 5 dedos × 3 falanges × 2 manos)
// ═══════════════════════════════════════════════════
// Sin esto las manos quedan completamente abiertas y rectas — una de las
// señales más claras de "muñeco" en un modelo por lo demás bien animado.
// Curvatura decreciente hacia la punta (proximal > intermedio > distal,
// ver CONFIG.dedos) + una única deriva de ruido muy lenta por mano (no una
// por dedo — con una alcanza para que no se vean congeladas, sin que cada
// dedo se mueva por su cuenta como una araña). Eje de curvado: rotation.z,
// con signo espejado entre manos (confirmado en vivo con captura de
// pantalla — si algún día el modelo cambia y las manos se ven mal, es acá
// donde revisar el signo).
const _DEDOS_NOMBRE = ['Index', 'Middle', 'Ring', 'Little'];
const _FALANGES = ['Proximal', 'Intermediate', 'Distal'];

function aplicarCurvaturaDedos(t) {
  const D = CONFIG.dedos;
  const curls = { Proximal: D.curlProximal, Intermediate: D.curlIntermedio, Distal: D.curlDistal };
  for (const lado of ['left', 'right']) {
    const signo = lado === 'left' ? -1 : 1;
    const deriva = ruido(lado === 'left' ? 900 : 901, D.derivaFreq, t) * D.derivaAmp;
    for (const dedo of _DEDOS_NOMBRE) {
      for (const falange of _FALANGES) {
        const bone = getB(`${lado}${dedo}${falange}`);
        if (bone) bone.rotation.z = signo * (curls[falange] + deriva);
      }
    }
    // Pulgar: se curva menos que el resto (curlPulgar < curlProximal) y se
    // opone — rotation.y extra, para que no quede en el mismo plano que
    // los demás dedos.
    const derivaPulgar = deriva * 0.6;
    for (const falange of _FALANGES) {
      const bone = getB(`${lado}Thumb${falange}`);
      if (bone) {
        bone.rotation.z = signo * (D.curlPulgar + derivaPulgar);
        bone.rotation.y = -signo * 0.25;
      }
    }
  }
}

// ═══════════════════════════════════════════════════
// POSE PROCEDURAL DE CUERPO — pose por estado (getStatePose) + springs
// ═══════════════════════════════════════════════════
// Antes vivía inline en animate(). Se extrajo a una función porque ahora es
// uno de los dos caminos de pose de cuerpo: se usa cuando NO hay clip VRMA
// activo, y como fuente de la mezcla durante un crossfade procedural<->clip
// (ver "ANIMACIÓN POR CLIPS VRMA" abajo). Lógica sin cambios respecto de
// cuando era inline. Escribe .rotation en los huesos normalizados.
function aplicarCuerpoProcedural(t, dt) {
  const pose = getStatePose(t);

  // Cabeza: pose base + drift de updateLook() + "sigue la mirada" (fracción
  // de hacia dónde miran los ojos — base de cámara + saccade + apartar, ya
  // con el retardo propio calculado en updateSaccades()) + spring. En
  // 'thinking' NO se suma la mirada acá: ese estado ya tiene su propio
  // desvío de cabeza fijo vía lookCur (arriba, en updateLook()) apuntando
  // al mismo punto que usa _miradaBase() para los ojos — sumar los dos
  // duplicaría el giro.
  const S_MIRADA = CONFIG.mirada;
  const cabezaSigueMirada = estado !== 'thinking';
  const miradaYawRad   = cabezaSigueMirada ? (_cabezaMiradaYaw   * Math.PI / 180) * S_MIRADA.cabezaFraccion : 0;
  const miradaPitchRad = cabezaSigueMirada ? (_cabezaMiradaPitch * Math.PI / 180) * S_MIRADA.cabezaFraccion : 0;

  const tHX = pose.hX - lookCur.y * 0.32 - miradaPitchRad;
  const tHY = pose.hY - lookCur.x * 0.26 + miradaYawRad;
  const tHZ = pose.hZ + lookCur.x * 0.48;

  // headB.rotation.{x,y,z} recibe el spring completo; neckB recibe una
  // fracción del MISMO spring ya resuelto (spr.hX.v/etc., más abajo) — así
  // el giro se reparte entre cabeza y cuello (no todo cargado en la
  // cabeza) automáticamente, para CUALQUIER fuente que alimente tHX/tHY/tHZ
  // (drift de reposo, mirada nueva, lo que sea) sin necesidad de un reparto
  // aparte por cada una.
  const headB = getB('head'), neckB = getB('neck');
  if (headB) {
    headB.rotation.x = spr.hX.step(tHX, dt);
    headB.rotation.y = spr.hY.step(tHY, dt);
    headB.rotation.z = spr.hZ.step(tHZ, dt);
  }
  if (neckB) {
    neckB.rotation.x = spr.hX.v * 0.38;
    neckB.rotation.y = spr.hY.v * 0.30;
    neckB.rotation.z = spr.hZ.v * 0.28;
  }

  // Cuerpo
  const spineB = getB('spine'), chestB = getB('upperChest') ?? getB('chest');
  const bZ = spr.bZ.step(pose.bZ, dt);
  const bX = spr.bX.step(pose.bX, dt);
  if (spineB) { spineB.rotation.z = bZ; spineB.rotation.x = bX; }

  // Traslado de peso PRIMERO: hombros y brazos lo necesitan para
  // acompañarlo (ver más abajo) — reemplaza el bob/rock que aportaba la
  // caminata eliminada, para que la cadera no se vea muerta estando quieta.
  const { rock: pesoRock } = updateTrasladoPeso(dt, t);

  // Respiración visible en pecho y hombros — mismo seno base (breath, ver
  // getStatePose). Los hombros también acompañan el traslado de peso: el
  // lado que "pesa más" baja un poco, como alguien real recargado de un
  // costado — no solo suben con la inhalación (Math.max(0,...), no bajan
  // de la base, para que se lea como elevación real y no una oscilación
  // simétrica).
  const respFase = Math.sin(t * 0.8);
  if (chestB) chestB.rotation.x = respFase * 0.018;
  const lShoulderB = getB('leftShoulder'), rShoulderB = getB('rightShoulder');
  if (lShoulderB) lShoulderB.rotation.z =  Math.max(0, respFase) * 0.013 - pesoRock * 0.4;
  if (rShoulderB) rShoulderB.rotation.z = -Math.max(0, respFase) * 0.013 - pesoRock * 0.4;

  // ── BRAZOS ACOPLADOS AL CUERPO ──────────────────────────────────────
  // No son ruido independiente: el target del upperArm suma una fracción
  // de spr.bX.v/spr.bZ.v (el TORSO ya resuelto por su propio spring, que
  // ya tiene su propio retardo) — así, cuando el cuerpo se inclina, el
  // brazo lo sigue con un retardo sobre otro retardo (el suyo propio, al
  // pasar de nuevo por spr.ruX/luX). Rangos en CONFIG.brazos.
  const S = CONFIG.brazos;
  const acopleCuerpo = spr.bX.v * S.acopleRespiracion + spr.bZ.v * S.acopleInclinacion;

  const rua = getB('rightUpperArm'), lua = getB('leftUpperArm');
  const rla = getB('rightLowerArm'), lla = getB('leftLowerArm');
  if (rua) {
    rua.rotation.z = spr.ruZ.step(pose.ruZ, dt);
    rua.rotation.x = spr.ruX.step(pose.ruX + acopleCuerpo, dt);
  }
  if (lua) {
    lua.rotation.z = spr.luZ.step(pose.luZ, dt);
    lua.rotation.x = spr.luX.step(pose.luX + acopleCuerpo, dt);
  }

  // Antebrazos: flexión base (nunca brazos rectos) + deriva de ruido, con
  // el mismo acoplamiento al cuerpo (a la mitad de fuerza que el upperArm).
  // pose.rlX/llX (solo 'thinking' los define, ver getStatePose) reemplazan
  // la base universal cuando el estado necesita algo distinto — la mano
  // hacia la cara, en ese caso.
  const codoR = pose.rlX ?? (S.codoFlexionBase + ruido(70, 0.09, t) * S.codoDerivaAmp);
  const codoL = pose.llX ?? (S.codoFlexionBase + ruido(72, 0.09, t) * S.codoDerivaAmp);
  if (rla) {
    rla.rotation.x = spr.rlX.step(codoR + acopleCuerpo * 0.5, dt);
    rla.rotation.z = -0.08 + ruido(71, 0.07, t) * 0.02;
  }
  if (lla) {
    lla.rotation.x = spr.llX.step(codoL + acopleCuerpo * 0.5, dt);
    lla.rotation.z =  0.08 + ruido(73, 0.07, t) * 0.02;
  }

  aplicarCurvaturaDedos(t);
}

// ═══════════════════════════════════════════════════
// ANIMACIÓN POR CLIPS VRMA — pose de cuerpo con THREE.AnimationMixer
// ═══════════════════════════════════════════════════
// Los .vrma (formato VRM Animation) reemplazan las poses de cuerpo por estado
// y el "giro de bailarina" a mano. Regla dura: los clips SOLO mueven huesos
// de cuerpo — se excluyen leftEye/rightEye/jaw y se ignoran las pistas de
// expresión/mirada que traiga el .vrma (pelean con el lipsync por índice y el
// parpadeo, que ya funcionan). Respiración, parpadeo, saccades, mirada a
// cámara y jaw se aplican SIEMPRE encima del mixer, también durante un clip.
// Toda transición (procedural<->clip, clip<->clip) va con crossfade
// (CONFIG.animaciones.crossfadeS, 0,3-0,5s). Carga perezosa + cache; si un
// clip falta en disco o no parsea, se cae a lo procedural con un aviso.
// Config: CONFIG.animaciones.
let _mixer = null;
let _accionActual = null;      // THREE.AnimationAction en curso, o null (= procedural puro)
let _accionAnterior = null;    // la de antes, mantenida viva durante un crossfade clip->clip
let _clipPeso = 0;             // 0 = procedural puro, 1 = clip puro; rampa en actualizarAnimacionClips()
let _clipPesoObjetivo = 0;
let _clipTopeTimer = null;     // segundos restantes de un clip 'bucle' con duracionS, o null
const _clipCache = new Map();  // archivo -> {archivo, clip} | {archivo, error}
const _huesosNorm = [];        // [{nombre, node, q:Quaternion}] — todos los huesos normalizados, para la mezcla
let _hipsNode = null;

// Clip de POSE BASE de idle (CONFIG.animaciones.idle): de él solo se toman los
// brazos (el problema real: cuelgan rectos en procedural); el resto del cuerpo
// queda 100% procedural. Ver reproducirIdle()/actualizarAnimacionClips().
const _HUESOS_BRAZO_IDLE = new Set([
  'leftShoulder', 'rightShoulder', 'leftUpperArm', 'rightUpperArm',
  'leftLowerArm', 'rightLowerArm', 'leftHand', 'rightHand',
]);
let _idleVelObjetivo = 1.0;    // timeScale objetivo del clip de idle en bucle
let _idleVelTimer = 0;
let _idleAmpMult = 1;          // multiplicador del ruido de getStatePose('idle') — >1 con clip de idle
const _qClipTmp = new THREE.Quaternion();
const _vClipTmp = new THREE.Vector3();
const _hipsPosProc = new THREE.Vector3();
let _tokenClip = 0;            // invalida cargas async pendientes si el estado/gesto cambió mientras tanto

// Fundido procedural<->clip (ver CONFIG.animaciones.fadeIn/fadeOut/
// fadeOutInterrupcion). _clipPeso sigue siendo el progreso LINEAL 0..1 (lo
// que ya leen los umbrales/ramas de actualizarAnimacionClips sin cambiar);
// easeInOutCubic(_clipPeso) es el peso real usado para mezclar cuaterniones,
// respiración y mirada — así el umbral "<=0.001"/">=0.999" sigue siendo
// exacto (ease(0)=0, ease(1)=1, monótona) y solo la curva de MEZCLA cambia.
let _clipFadeSalidaS = null; // duración de la salida en curso (fadeOut o fadeOutInterrupcion) — null = no hay salida en curso
function easeInOutCubic(x) {
  return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
}

// ¿El cuerpo lo controla ahora mismo un clip pedido A MANO? (paleta
// "/animaciones" o 'clip <nombre>' de bench_chat.py). Se lee de la acción en
// curso, así que no hay flag de módulo que pueda quedarse pegado.
function hayClipManual() { return _accionActual?._esManual === true; }

// Gestos de reposo: máquina de estados chica (esperando -> reproduciendo).
let _gestoTimer = _sortearIntervaloGesto();
let _gestoActivo = false;      // un gesto de reposo controla el cuerpo (incluida la salida con fundido)
let _ultimoGestoDisparado = null; // archivo del último gesto — para no repetirlo dos veces seguidas

function _sortearIntervaloGesto() {
  const { minS, maxS } = CONFIG.animaciones.intervaloReposo;
  return minS + Math.random() * (maxS - minS);
}

function inicializarAnimacionClips() {
  _mixer = new THREE.AnimationMixer(vrm.scene);
  _mixer.addEventListener('finished', _alTerminarClip);
  _huesosNorm.length = 0;
  for (const nombre of Object.keys(vrm.humanoid.humanBones)) {
    const node = vrm.humanoid.getNormalizedBoneNode(nombre);
    if (node) _huesosNorm.push({ nombre, node, q: new THREE.Quaternion() });
  }
  _hipsNode = vrm.humanoid.getNormalizedBoneNode('hips');
  console.log(`[Anim] mixer listo — ${_huesosNorm.length} huesos normalizados para la mezcla`);
}

// Los .vrma de tk256ailab no traen extensions.VRMC_vrm_animation.specVersion y
// VRMAnimationLoaderPlugin@2.1.3 aborta el parseo sin él. Se parchea una COPIA
// en memoria (specVersion:"1.0") — el archivo en disco queda intacto. El pack
// oficial VRoid ya lo trae: para esos devuelve la URL original sin tocar nada.
async function normalizarVrma(url) {
  const MAGIC = 0x46546c67, JSON_T = 0x4e4f534a, BIN_T = 0x004e4942;
  let buf;
  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    buf = await resp.arrayBuffer();
  } catch (e) {
    throw new Error(`no se pudo descargar (${e.message})`);
  }
  const dv = new DataView(buf);
  if (buf.byteLength < 20 || dv.getUint32(0, true) !== MAGIC || dv.getUint32(16, true) !== JSON_T) {
    return url; // no parece un .glb — que GLTFLoader tire su propio error
  }
  const version = dv.getUint32(4, true);
  const jsonLen = dv.getUint32(12, true);
  const json = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 20, jsonLen)));
  const ext = json.extensions && json.extensions.VRMC_vrm_animation;
  if (!ext || ext.specVersion != null) return url; // ya está bien
  ext.specVersion = '1.0';

  const binOff = 20 + jsonLen;
  let bin = null;
  if (binOff + 8 <= buf.byteLength && dv.getUint32(binOff + 4, true) === BIN_T) {
    bin = new Uint8Array(buf, binOff + 8, dv.getUint32(binOff, true));
  }
  let jsonBytes = new TextEncoder().encode(JSON.stringify(json));
  const pad = (4 - (jsonBytes.length % 4)) % 4;
  if (pad) {
    const p = new Uint8Array(jsonBytes.length + pad);
    p.set(jsonBytes); p.fill(0x20, jsonBytes.length);
    jsonBytes = p;
  }
  const total = 12 + 8 + jsonBytes.length + (bin ? 8 + bin.length : 0);
  const out = new Uint8Array(total);
  const odv = new DataView(out.buffer);
  odv.setUint32(0, MAGIC, true); odv.setUint32(4, version, true); odv.setUint32(8, total, true);
  odv.setUint32(12, jsonBytes.length, true); odv.setUint32(16, JSON_T, true);
  out.set(jsonBytes, 20);
  if (bin) {
    const bp = 20 + jsonBytes.length;
    odv.setUint32(bp, bin.length, true); odv.setUint32(bp + 4, BIN_T, true);
    out.set(bin, bp + 8);
  }
  console.log(`[Anim] ${url.split('/').pop()}: specVersion ausente → parcheado a "1.0" en memoria`);
  return URL.createObjectURL(new Blob([out], { type: 'model/gltf-binary' }));
}

// Arma un THREE.AnimationClip SOLO con las pistas de hueso de cuerpo, replicando
// la parte humanoid de createVRMAnimationHumanoidTracks (three-vrm-animation
// v2.1.3) pero con el THREE de esta página (el mismo que el mixer) y sin las
// pistas de expresión/mirada. El retargetizado real (matrices de mundo del rig
// origen -> local del rig del modelo) ya lo hizo VRMAnimationLoaderPlugin.
const _EXCLUIR_HUESOS_CLIP = new Set(['leftEye', 'rightEye', 'jaw']);
function clipDeVrma(va) {
  const metaV = vrm.meta?.metaVersion ?? '1';   // '0' para rem.vrm (VRM 0.x)
  const tracks = [];
  for (const [name, orig] of va.humanoidTracks.rotation) {
    if (_EXCLUIR_HUESOS_CLIP.has(name)) continue;
    const node = vrm.humanoid.getNormalizedBoneNode(name);
    if (!node) continue;                          // hueso que rem.vrm no tiene → se ignora
    // VRM0: espejo 180° en Y → negar x,z de cada cuaternión (índices pares del array plano).
    const values = metaV === '0'
      ? Float32Array.from(orig.values, (v, i) => (i % 2 === 0 ? -v : v))
      : Float32Array.from(orig.values);
    tracks.push(new THREE.QuaternionKeyframeTrack(`${node.name}.quaternion`, orig.times, values));
  }
  for (const [name, orig] of va.humanoidTracks.translation) {   // solo hips
    const node = vrm.humanoid.getNormalizedBoneNode(name);
    if (!node) continue;
    const animY = va.restHipsPosition?.y || 1;
    const humanY = vrm.humanoid.normalizedRestPose?.hips?.position?.[1] ?? animY;
    const scale = humanY / animY;
    const values = Float32Array.from(orig.values, (v, i) => (metaV === '0' && i % 3 !== 1 ? -v : v) * scale);
    tracks.push(new THREE.VectorKeyframeTrack(`${node.name}.position`, orig.times, values));
  }
  return new THREE.AnimationClip('cuerpo', va.duration ?? -1, tracks);
}

// Carga perezosa + cache. Cachea también el fallo, para no reintentar en cada
// disparo. Nunca lanza: en error devuelve {archivo, error} y el llamador cae a
// lo procedural.
async function obtenerClip(archivo) {
  if (_clipCache.has(archivo)) return _clipCache.get(archivo);
  let entry;
  try {
    const urlUsable = await normalizarVrma(CONFIG.animaciones.carpeta + archivo);
    let gltf;
    try {
      gltf = await loader.loadAsync(urlUsable);
    } finally {
      if (urlUsable.startsWith('blob:')) URL.revokeObjectURL(urlUsable);
    }
    const va = gltf.userData?.vrmAnimations?.[0];
    if (!va) throw new Error('sin vrmAnimations (¿glTF sin extensión VRMC_vrm_animation?)');
    const clip = clipDeVrma(va);
    if (clip.tracks.length === 0) throw new Error('0 pistas de hueso tras el filtrado');
    entry = { archivo, clip };
    console.log(`[Anim] "${archivo}" cargado — ${clip.tracks.length} pistas, ${clip.duration.toFixed(2)}s`);
  } catch (e) {
    console.warn(`[Anim] "${archivo}" no disponible: ${e.message} — se mantiene la animación procedural`);
    entry = { archivo, error: e };
  }
  _clipCache.set(archivo, entry);
  return entry;
}

// ── REGISTRO DE CLIPS + PRECARGA ─────────────────────────────────────────
// Registro en memoria de CONFIG.animaciones.catalogo con el resultado real de
// cargar cada .vrma. Lo consume la paleta de comandos "/animaciones" del panel
// de chat: un clip que no parsea (p.ej. si normalizarVrma() no logra arreglarle
// el specVersion) queda en estado 'error' y NO se ofrece en la paleta, en vez
// de aparecer y no hacer nada al elegirlo.
const _registroClips = new Map(); // archivo -> {nombre, etiqueta, giraCuerpo, estado, motivo}

function infoClip(archivo) { return _registroClips.get(archivo) ?? null; }

// Etiqueta legible de un archivo, con el nombre crudo como respaldo para un
// .vrma que se dispare por WS sin estar en el catálogo (bench_chat.py puede
// mandar cualquier nombre).
function etiquetaClip(archivo) {
  return CONFIG.animaciones.catalogo[archivo]?.etiqueta ?? archivo.replace(/\.vrma$/i, '');
}

function clipGiraCuerpo(archivo) {
  return CONFIG.animaciones.catalogo[archivo]?.giraCuerpo === true;
}

// Clips cargados correctamente, en el orden del catálogo — lo que lista la
// paleta. Devuelve [] mientras la precarga no haya terminado.
function clipsDisponibles() {
  return [..._registroClips.values()].filter(c => c.estado === 'ok');
}

// Precarga TODOS los clips del catálogo en paralelo. No bloquea el render: se
// lanza y no se espera (obtenerClip ya es perezoso/cacheado y nunca lanza, así
// que cada .vrma queda listo para el primer disparo real sin pagar la descarga
// en ese momento). Se llama una sola vez, al cargar el VRM.
function precargarClips() {
  const cat = CONFIG.animaciones.catalogo;
  const archivos = Object.keys(cat);
  return Promise.all(archivos.map(async archivo => {
    const entry = await obtenerClip(archivo);
    _registroClips.set(archivo, {
      nombre: archivo,
      etiqueta: cat[archivo].etiqueta,
      giraCuerpo: cat[archivo].giraCuerpo === true,
      estado: entry.error ? 'error' : 'ok',
      motivo: entry.error ? entry.error.message : '',
    });
  })).then(() => {
    const fallidos = [..._registroClips.values()].filter(c => c.estado !== 'ok');
    console.log(`[Anim] precarga: ${archivos.length - fallidos.length}/${archivos.length} clips cargados`);
    if (fallidos.length) {
      console.warn('[Anim] clips NO disponibles (fuera de la paleta):',
        fallidos.map(c => `${c.nombre} (${c.motivo})`).join(' | '));
    }
  });
}

function reproducirClip(entry, { modo, duracionS, esGesto, esManual }) {
  if (!_mixer || !entry?.clip) return;
  const CF = CONFIG.animaciones.crossfadeS;
  const nueva = _mixer.clipAction(entry.clip);
  // Ya es el clip activo y a pleno peso (p.ej. thinking re-entrado en el mismo
  // turno): no reiniciar el loop desde t=0, solo refrescar el tope.
  if (nueva === _accionActual && _clipPesoObjetivo === 1 && !nueva.paused) {
    _clipTopeTimer = (duracionS != null) ? duracionS : null;
    _gestoActivo = !!esGesto;
    nueva._esManual = !!esManual;
    return;
  }
  nueva.reset();
  nueva.setLoop(modo === 'bucle' ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  nueva.clampWhenFinished = (modo !== 'bucle'); // sostiene el último frame estable durante el crossfade de salida
  nueva.enabled = true;
  nueva.paused = false;
  nueva.timeScale = 1;
  nueva.setEffectiveWeight(1);
  nueva._esGesto = !!esGesto;
  nueva._esIdle = false;
  // Disparo explícito (paleta "/animaciones" o 'clip <nombre>' de
  // bench_chat.py): lo pedido a mano no lo interrumpe el audio ni un cambio de
  // estado que no traiga clip propio — ver updateGestos/sincronizarClipConEstado.
  // Vive en la ACCIÓN, no en una variable de módulo: cuando _accionActual
  // cambia o se anula, el flag desaparece con ella y no puede quedar colgado.
  nueva._esManual = !!esManual;
  nueva.play();

  if (_accionActual && _accionActual !== nueva) {
    // clip -> clip: el mixer hace el crossfade; _clipPeso se queda en 1.
    if (_accionAnterior && _accionAnterior !== nueva && _accionAnterior !== _accionActual) {
      _accionAnterior.stop();
    }
    _accionActual.crossFadeTo(nueva, CF, false);
    _accionAnterior = _accionActual;
  }
  _accionActual = nueva;
  _gestoActivo = !!esGesto;
  _clipTopeTimer = (duracionS != null) ? duracionS : null;
  _clipPesoObjetivo = 1;
  console.log(`[Anim] reproduciendo "${entry.archivo}" (${modo}${duracionS != null ? `, tope ${duracionS}s` : ''}${esGesto ? ', gesto' : ''})`);
}

// No corta el mixer: solo baja el objetivo de mezcla. actualizarAnimacionClips()
// rampa _clipPeso a 0 y recién ahí para las acciones y resetea la pose. La CARA
// no se toca — la maneja updateExpressions() por 'estado', así que si el estado
// emocional sigue activo la expresión se conserva mientras el cuerpo vuelve a
// respirar/moverse en procedural.
function volverAProcedural(interrumpido = false) {
  _clipPesoObjetivo = 0;
  _clipTopeTimer = null;
  _clipFadeSalidaS = interrumpido ? CONFIG.animaciones.fadeOutInterrupcion : CONFIG.animaciones.fadeOut;
}

// Clip de POSE BASE de idle (CONFIG.animaciones.idle). No es un gesto ni un clip
// de estado: es la base sobre la que corre todo lo demás. Loop continuo; cede a
// gestos/clips de estado con crossfade y se vuelve a él al terminar (ver
// volverABaseIdle). Marca _accionActual._esIdle para que actualizarAnimacionClips()
// haga la mezcla especial (del clip solo los brazos, el resto procedural).
async function reproducirIdle() {
  const cfg = CONFIG.animaciones.idle;
  if (!_mixer || !cfg?.archivo) { volverAProcedural(); return; }
  const tok = ++_tokenClip;
  const entry = await obtenerClip(cfg.archivo);
  if (tok !== _tokenClip || estado !== 'idle' || _audioActivo) return;
  if (entry.error) { volverAProcedural(); return; }

  const acc = _mixer.clipAction(entry.clip);
  if (acc === _accionActual && _accionActual._esIdle) { _clipPesoObjetivo = 1; return; }

  acc.reset();
  acc.setLoop(THREE.LoopRepeat, Infinity);
  acc.clampWhenFinished = false;
  acc.enabled = true;
  acc.paused = false;
  acc.setEffectiveWeight(1);
  acc._esGesto = false;
  acc._esIdle = true;
  acc.play();
  // 'poseFija': timeScale 0 (no 'paused') — el frame no avanza pero la acción
  // sigue entrando en la mezcla, así que el crossfade hacia ella funciona.
  acc.timeScale = (cfg.modo === 'poseFija') ? 0 : 1;
  if (cfg.modo === 'poseFija') acc.time = 0;

  const CF = CONFIG.animaciones.crossfadeS;
  if (_accionActual && _accionActual !== acc) {
    if (_accionAnterior && _accionAnterior !== acc && _accionAnterior !== _accionActual) _accionAnterior.stop();
    _accionActual.crossFadeTo(acc, CF, false);
    _accionAnterior = _accionActual;
  }
  _accionActual = acc;
  _gestoActivo = false;
  _clipTopeTimer = null;
  _idleVelObjetivo = 1.0;
  _idleVelTimer = 0;
  _clipPesoObjetivo = 1;
  console.log(`[Anim] idle base: "${cfg.archivo}" (${cfg.modo})`);
}

// Fin de un gesto de reposo, o su interrupción: volver a la BASE — al clip de
// idle si está configurado y seguimos elegibles, o a lo procedural.
// interrumpido: true si esto es un corte forzado (audio/estado) en vez de un
// final natural — decide fadeOutInterrupcion vs fadeOut en volverAProcedural.
function volverABaseIdle(interrumpido = false) {
  if (estado === 'idle' && !_audioActivo && CONFIG.animaciones.idle?.archivo) {
    reproducirIdle(); // entrada al clip de idle — fundido de ENTRADA (fadeIn), no de salida
  } else {
    volverAProcedural(interrumpido);
  }
}

// Varía lento el timeScale del clip de idle en bucle (velMin..velMax) — un clip
// de reposo de ~4s en loop se nota repetitivo enseguida; la velocidad variable
// rompe el patrón sin leerse como "cámara lenta".
function _actualizarVelIdle(dt) {
  const cfg = CONFIG.animaciones.idle;
  _idleVelTimer -= dt;
  if (_idleVelTimer <= 0) {
    _idleVelObjetivo = cfg.velMin + Math.random() * (cfg.velMax - cfg.velMin);
    _idleVelTimer = (cfg.velCambioS ?? 9) * (0.6 + Math.random() * 0.8);
  }
  if (_accionActual) _accionActual.timeScale = lerp(_accionActual.timeScale, _idleVelObjetivo, dt * 0.4);
}

function _alTerminarClip(e) {
  if (e.action !== _accionActual) return;   // una acción vieja terminando su fade — ignorar
  // Backstop: el fundido de salida NATURAL ya debería estar en curso desde
  // los últimos CONFIG.animaciones.fadeOut segundos del propio clip (ver el
  // chequeo de "restante" en actualizarAnimacionClips) — esto solo cubre el
  // caso de un clip más corto que fadeOut, o timeScale atípico, donde ese
  // disparo anticipado no llegó a activarse. Si ya estaba en curso, esto es
  // un no-op (el objetivo ya es 0).
  if (e.action._esGesto) volverABaseIdle(false); else volverAProcedural(false);
  // _gestoActivo/_gestoTimer NO se tocan acá: se liberan/resortean recién
  // cuando el peso realmente llega a 0 (ver actualizarAnimacionClips) — si no,
  // updateGestos() podría sortear y arrancar OTRO gesto encima mientras este
  // todavía se está desvaneciendo.
}

// estado -> clip mapeado (CONFIG.animaciones.porEstado). Sin mapeo (talking/idle)
// -> procedural. Con guarda de carrera: si el estado cambia mientras el clip
// carga (async), el token no coincide y se descarta.
function sincronizarClipConEstado() {
  const m = CONFIG.animaciones.porEstado[estado];
  const tok = ++_tokenClip;
  _gestoActivo = false; // un cambio de estado siempre gana sobre un gesto de reposo
  if (m) {
    obtenerClip(m.archivo).then(entry => {
      if (tok !== _tokenClip) return;                 // el estado cambió mientras cargaba
      if (entry.error) { volverAProcedural(true); return; } // fallback a procedural, forzado
      reproducirClip(entry, { modo: m.modo, duracionS: m.duracionS, esGesto: false });
    });
    return;
  }
  // Un clip manual en curso sobrevive a un estado que no trae clip propio
  // (idle/talking): si no, terminar de hablar (talking -> idle) cortaba a la
  // mitad el clip que el usuario acababa de pedir. Un estado CON clip mapeado
  // sí gana — lo resuelve el bloque de arriba, antes de llegar acá.
  if (hayClipManual()) { _gestoActivo = true; return; }

  // Sin clip de estado: idle usa el clip de pose base (si está configurado);
  // talking (y idle con el clip desactivado) van a procedural. Un cambio de
  // estado que corta lo que hubiera antes es siempre un corte FORZADO
  // (fadeOutInterrupcion), nunca un final natural.
  if (estado === 'idle' && CONFIG.animaciones.idle?.archivo) {
    reproducirIdle();
  } else {
    volverAProcedural(true);
  }
}

// excluir: archivo a evitar repetir (el último gesto disparado) — solo se
// respeta si queda al menos otro candidato elegible, para no bloquearse
// cuando el repertorio disponible (p.ej. de noche, solo Sleepy) tiene uno solo.
function _elegirGestoPorPeso(excluir) {
  const hora = new Date().getHours();
  let disp = CONFIG.animaciones.gestos.repertorio.filter(g =>
    g.horaDesde == null || (hora >= g.horaDesde && hora < g.horaHasta));
  if (excluir != null) {
    const sinRepetir = disp.filter(g => g.archivo !== excluir);
    if (sinRepetir.length > 0) disp = sinRepetir;
  }
  const total = disp.reduce((s, g) => s + g.peso, 0);
  if (total <= 0) return null;
  let r = Math.random() * total;
  for (const g of disp) { r -= g.peso; if (r <= 0) return g; }
  return disp[disp.length - 1];
}

// Log temporal de diagnóstico de frecuencia — cada disparo real, cada
// cancelación, y el timestamp (clock.getElapsedTime()) de ambos. Se deja
// permanente (bajo console.log, sin costo real) para poder auditar la
// cadencia real sin instrumentar de nuevo si el reporte vuelve a diferir de
// lo esperado.
function _logGesto(msg) {
  console.log(`[Gesto] t=${clock.getElapsedTime().toFixed(1)}s ${msg}`);
}

function updateGestos(dt) {
  const hayClipEstado = !!CONFIG.animaciones.porEstado[estado];

  if (_gestoActivo) {
    // Interrupción (regla: la voz manda): si dejó de ser elegible a mitad de
    // gesto, fundido corto (fadeOutInterrupcion) de vuelta a la base (clip de
    // idle o procedural). EXCEPCIÓN: un clip pedido a mano no se corta por
    // audio ni por estado — se pidió explícitamente. Los que SÍ molestarían
    // mientras habla (los de giraCuerpo, que la sacan de cámara) ni siquiera
    // llegan acá: se encolan antes de dispararse (dispararClipManual).
    if (!hayClipManual() && (estado !== 'idle' || _audioActivo)) {
      _logGesto(`interrumpido (motivo: ${estado !== 'idle' ? `estado=${estado}` : 'audio'})`);
      volverABaseIdle(true); // fundido CORTO (fadeOutInterrupcion) — la voz manda
      _gestoActivo = false;
      _gestoTimer = _sortearIntervaloGesto();
    }
    return;
  }

  // Un gesto SÍ puede dispararse sobre el clip de pose base de idle (crossfade
  // idle -> gesto -> idle) — solo lo bloquean un clip de estado, audio, o no-idle.
  if (estado !== 'idle' || _audioActivo || hayClipEstado) {
    _gestoTimer = _sortearIntervaloGesto();
    return;
  }

  _gestoTimer -= dt;
  if (_gestoTimer > 0) return;

  const g = _elegirGestoPorPeso(_ultimoGestoDisparado);
  if (!g) { _gestoTimer = _sortearIntervaloGesto(); return; }
  _gestoActivo = true;
  const tok = ++_tokenClip;
  obtenerClip(g.archivo).then(entry => {
    if (tok !== _tokenClip || estado !== 'idle' || _audioActivo) {
      _logGesto(`cancelado antes de reproducir "${g.archivo}" (motivo: ${tok !== _tokenClip ? 'token obsoleto' : (estado !== 'idle' ? `estado=${estado}` : 'audio')})`);
      _gestoActivo = false;
      _gestoTimer = _sortearIntervaloGesto();
      return;
    }
    if (entry.error) {
      _logGesto(`cancelado — "${g.archivo}" no disponible (${entry.error.message})`);
      _gestoActivo = false;
      _gestoTimer = _sortearIntervaloGesto();
      return;
    }
    _ultimoGestoDisparado = g.archivo;
    _logGesto(`disparando "${g.archivo}"`);
    reproducirClip(entry, { modo: 'unaVez', esGesto: true });
  });
}

// Depuración: dispara un clip por nombre bajo demanda, como si fuera un gesto
// de reposo (unaVez + vuelta a la base con crossfade) — para grabar un clip
// concreto sin esperar al sorteo de updateGestos(). Acepta el nombre con o sin
// ".vrma". Llega por WebSocket ({tipo:'debug_clip', nombre:'VRMA_05'}, ver
// rem_avatar_server._ws_handler) o a mano desde la consola del inspector.
// Se comporta como cualquier gesto: si entra audio o cambia el estado, se
// interrumpe con crossfade (la voz manda).
window.dispararClipDebug = function (nombre) {
  const archivo = /\.vrma$/i.test(nombre) ? nombre : `${nombre}.vrma`;
  const tok = ++_tokenClip;
  _gestoActivo = true;   // ya acá, para que updateGestos() no sortee otro mientras carga
  obtenerClip(archivo).then(entry => {
    // Otro clip/estado ganó mientras cargaba. Se libera _gestoActivo igual que
    // hace updateGestos() en su misma rama: si el ganador es otro gesto, ya lo
    // puso en true por su cuenta; lo que NO puede pasar es que quede en true sin
    // dueño (un .vrma lento + un cambio de estado dejaría los gestos muertos).
    if (tok !== _tokenClip) { _gestoActivo = false; return; }
    if (entry.error) {
      console.warn(`[Anim] debug_clip "${archivo}": no disponible — no se dispara`);
      _gestoActivo = false;
      return;
    }
    _gestoTimer = _sortearIntervaloGesto();
    console.log(`[Anim] debug_clip -> "${archivo}"`);
    reproducirClip(entry, { modo: 'unaVez', esGesto: true, esManual: true });
  });
};

// ── CLIP EN ESPERA (solo los de giraCuerpo) ──────────────────────────────
// Un clip que gira el cuerpo mientras Rem habla la saca de cámara a mitad de
// frase, así que no se dispara: queda acá y sale al vaciarse la cola de audio
// (_avanzarCola, más arriba). Solo se guarda UNO: un pedido nuevo reemplaza al
// anterior en vez de encolarse detrás.
//
// _gestoActivo NO se toca al encolar — se pone recién en dispararClipDebug, en
// el momento del disparo real. Un clip que queda en espera y nunca llega a
// dispararse (lo reemplaza otro, o la ventana se cierra) no deja nada colgado.
let _clipEnEspera = null;     // nombre de archivo, o null
let _clipEsperaTimer = null;  // setTimeout del rebote, o null

// Con voz por oraciones (ver SentenceSplitter en CLAUDE.md) la cola se vacía un
// instante ENTRE dos frases de la misma respuesta. Por eso no se dispara en el
// acto: se espera un poco y se vuelve a comprobar que no haya arrancado otro
// audio, para no soltar el giro en mitad de la respuesta.
const _ESPERA_TRAS_AUDIO_MS = 700;

function hayVozSonando() {
  return _audioActivo || _audioPlaying || _audioPlayQueue.length > 0 || estado === 'talking';
}

function ponerClipEnEspera(archivo) { _clipEnEspera = archivo; }

// Llamada desde _avanzarCola() cuando la cola de audio queda vacía.
function _intentarLanzarClipEnEspera() {
  if (!_clipEnEspera || _clipEsperaTimer !== null) return;
  _clipEsperaTimer = setTimeout(() => {
    _clipEsperaTimer = null;
    const archivo = _clipEnEspera;
    if (!archivo) return;                 // lo cancelaron mientras esperaba
    if (hayVozSonando()) return;          // llegó otra frase: sigue en espera
    _clipEnEspera = null;
    _gestoTimer = _sortearIntervaloGesto();
    window.dispararClipDebug(archivo);
    window.__remChat?.onClipLanzado?.(archivo);
  }, _ESPERA_TRAS_AUDIO_MS);
}

// Respiración encima del clip — aditiva (+=), suave. La respiración real es
// rítmica (seno limpio), no es lo que hacía ver a Rem como un robot. Se escala
// por k (= _clipPeso): cuando lo procedural domina la mezcla ya trae su propia
// respiración; cuando el clip domina, esta la reemplaza. Sin doble conteo en
// la transición.
function aplicarRespiracionEncima(t, k) {
  const respFase = Math.sin(t * 0.8) * k;
  const chestB = getB('upperChest') ?? getB('chest');
  if (chestB) chestB.rotation.x += respFase * 0.018;
  const spineB = getB('spine');
  if (spineB) spineB.rotation.x += respFase * 0.009;
  const lS = getB('leftShoulder'), rS = getB('rightShoulder');
  if (lS) lS.rotation.z +=  Math.max(0, respFase) * 0.013;
  if (rS) rS.rotation.z += -Math.max(0, respFase) * 0.013;
}

// La cabeza sigue la mirada también durante un clip, pero más contenida (el
// clip ya posa la cabeza) — mitad de CONFIG.mirada.cabezaFraccion, y escalada
// por k (= _clipPeso) para no doblar el aporte procedural en la transición.
// _cabezaMirada* lo actualiza updateSaccades() cada frame, antes de esto.
function aplicarCabezaSigueMiradaEncima(k) {
  const f = CONFIG.mirada.cabezaFraccion * 0.5 * k;
  const headB = getB('head');
  if (!headB) return;
  headB.rotation.y += (_cabezaMiradaYaw   * Math.PI / 180) * f;
  headB.rotation.x -= (_cabezaMiradaPitch * Math.PI / 180) * f;
}

// Llamada desde animate() en lugar del bloque de pose de cuerpo. Decide entre
// procedural puro, clip puro, o la mezcla de los dos durante un crossfade.
function actualizarAnimacionClips(dt, t) {
  if (!_mixer) { _idleAmpMult = 1; aplicarCuerpoProcedural(t, dt); return; } // aún no cargó el VRM
  updateGestos(dt);

  // Salida NATURAL de un clip 'bucle' con tope (sad/angry, duracionS): arranca
  // el fundido en los últimos fadeOut segundos del tope, no de golpe al llegar
  // a 0 — mismo criterio que el chequeo de abajo para clips 'unaVez'.
  if (_clipTopeTimer != null) {
    _clipTopeTimer -= dt;
    if (_clipTopeTimer <= CONFIG.animaciones.fadeOut) { _clipTopeTimer = null; volverABaseIdle(false); }
  }

  // Salida NATURAL de un clip 'unaVez' (gesto, o surprised/happy): arranca el
  // fundido en los últimos fadeOut segundos de SU PROPIA duración —medida
  // contra el reloj interno del clip (accion.time), no contra el evento
  // 'finished' del mixer, que solo dispara recién al terminar del todo. Así
  // el peso ya está en (o cerca de) 0 cuando el clip realmente termina, en
  // vez de saltar del último frame a la pose procedural y ahí SÍ empezar a
  // desvanecer. Si ya se disparó un corte forzado este mismo frame (arriba,
  // en updateGestos), _clipPesoObjetivo ya es 0 y esto no hace nada.
  if (_accionActual && _accionActual.loop === THREE.LoopOnce && !_accionActual.paused && _clipPesoObjetivo === 1) {
    const dur = _accionActual.getClip().duration;
    const restante = isFinite(dur) ? (dur - _accionActual.time) / Math.abs(_accionActual.timeScale || 1) : Infinity;
    if (restante <= CONFIG.animaciones.fadeOut) {
      if (_accionActual._esGesto) volverABaseIdle(false); else volverAProcedural(false);
    }
  }

  // Rampa de _clipPeso (progreso LINEAL 0..1) con duración distinta según la
  // dirección: fadeIn al entrar, fadeOut/fadeOutInterrupcion al salir (el que
  // corresponda, fijado en volverAProcedural/volverABaseIdle). La curva de
  // easing se aplica solo al PESO DE MEZCLA (pesoBlend, más abajo) — los
  // umbrales de acá (0.001/0.999/0.5) siguen leyendo el progreso lineal.
  {
    const subiendo = _clipPesoObjetivo > _clipPeso;
    const dur = subiendo ? CONFIG.animaciones.fadeIn : (_clipFadeSalidaS ?? CONFIG.animaciones.fadeOut);
    _clipPeso += clamp(_clipPesoObjetivo - _clipPeso, -dt / dur, dt / dur);
  }
  const pesoBlend = easeInOutCubic(clamp(_clipPeso, 0, 1));

  const esIdleClip = _accionActual?._esIdle === true;
  // Ruido procedural amplificado solo mientras el clip de idle domina la mezcla.
  _idleAmpMult = (esIdleClip && _clipPeso > 0.5) ? (CONFIG.animaciones.idle.ampProcedural ?? 1) : 1;

  if (_clipPeso <= 0.001) {
    _clipPeso = 0;
    if (_accionActual || _accionAnterior) {
      const eraGesto = _accionActual?._esGesto === true;
      _mixer.stopAllAction();
      _accionActual = _accionAnterior = null;
      vrm.humanoid.resetNormalizedPose(); // huesos que el clip movió y el procedural no toca (piernas, hips.position)
      // El gesto se da por terminado recién ACÁ (peso realmente en 0), no en
      // 'finished' ni al disparar el fundido — ver _alTerminarClip/updateGestos.
      if (eraGesto && _gestoActivo) {
        _logGesto('fundido de salida completo — libre para el próximo');
        _gestoActivo = false;
        _gestoTimer = _sortearIntervaloGesto();
      }
    }
    _clipFadeSalidaS = null;
    _idleAmpMult = 1;
    aplicarCuerpoProcedural(t, dt);
    return;
  }

  // Idle a pleno peso: mezcla ESPECIAL — del clip solo se toman los brazos
  // (hombro/upperArm/lowerArm/mano), el resto del cuerpo queda 100% procedural
  // (getStatePose('idle') ya con ampProcedural). Durante el crossfade
  // (mezclando) todavía se mezclan todos los huesos por _clipPeso.
  const idleBrazos = esIdleClip && _clipPeso >= 0.999;
  const mezclando  = _clipPeso < 0.999;

  if (mezclando || idleBrazos) {
    aplicarCuerpoProcedural(t, dt);                          // escribe .rotation (pose procedural)
    for (const h of _huesosNorm) h.q.copy(h.node.quaternion); // snapshot procedural
    if (_hipsNode) _hipsPosProc.copy(_hipsNode.position);
  }

  if (esIdleClip && CONFIG.animaciones.idle.modo === 'bucle') _actualizarVelIdle(dt);
  _mixer.update(dt);                                          // el clip escribe .quaternion

  if (idleBrazos) {
    const m = CONFIG.animaciones.idle.mezclaBrazos ?? 0.8;
    for (const h of _huesosNorm) {
      if (_HUESOS_BRAZO_IDLE.has(h.nombre)) {
        _qClipTmp.copy(h.node.quaternion);
        h.node.quaternion.slerpQuaternions(h.q, _qClipTmp, m);
      } else {
        h.node.quaternion.copy(h.q);   // resto: 100% procedural
      }
    }
    if (_hipsNode) _hipsNode.position.copy(_hipsPosProc);
    // aplicarCuerpoProcedural ya puso respiración/mirada para todo el cuerpo;
    // NO se suman de nuevo (sería doble). La mínima pérdida de respiración en
    // hombros (mezclados 0.8 al clip) no se nota.
    return;
  }

  if (mezclando) {
    for (const h of _huesosNorm) {
      _qClipTmp.copy(h.node.quaternion);
      h.node.quaternion.slerpQuaternions(h.q, _qClipTmp, pesoBlend);
    }
    if (_hipsNode) {
      _vClipTmp.copy(_hipsNode.position);
      _hipsNode.position.lerpVectors(_hipsPosProc, _vClipTmp, pesoBlend);
    }
  }

  aplicarRespiracionEncima(t, pesoBlend);
  if (estado !== 'thinking') aplicarCabezaSigueMiradaEncima(pesoBlend);
}

// ═══════════════════════════════════════════════════
// LOOP PRINCIPAL
// ═══════════════════════════════════════════════════
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!vrm) { renderer.render(scene, camera); return; }

  const t = clock.getElapsedTime();

  // Detectar cambio de estado
  if (estado !== prevEstado) {
    if (estado === 'surprised') surprisedSnap = 1.0;
    applySpringConfig();
    sincronizarClipConEstado(); // mapea estado -> clip VRMA (o crossfade a procedural)
    prevEstado = estado;
    // Segunda salida para el clip en espera, además de _avanzarCola(): con la
    // voz del panel apagada NO hay audio, pero el backend igual manda
    // estado='talking' con el primer delta — sin esto, un clip encolado por
    // "está hablando" se quedaba encolado para siempre, porque _avanzarCola()
    // nunca llega a correr. _intentarLanzarClipEnEspera() revalida que no haya
    // voz sonando antes de soltarlo, así que llamarlo de más es inofensivo.
    if (estado !== 'talking') _intentarLanzarClipEnEspera();
  }

  // Decaer snap de sorpresa
  if (surprisedSnap > 0) surprisedSnap = Math.max(0, surprisedSnap - dt * 1.8);

  // ── Sistemas de expresión / parpadeo / mirada / saccades ──
  updateExpressions(dt);
  updateBlink(dt);
  aplicarVisemesPreUpdate(); // vía fallback: expressionManager necesita el valor ANTES de vrm.update()
  updateLook(dt, t);
  updateSaccades(dt);
  // _jawApertura es del frame anterior acá (se recalcula al final de este
  // mismo animate(), en aplicarVisemesPostUpdate) — un frame de atraso es
  // imperceptible para algo tan lento como _hablaEnergia.
  actualizarHablaEnergia(dt);

  // ── Pose de cuerpo: clip VRMA, procedural, o mezcla de los dos ──
  // Reemplaza el bloque de pose procedural inline + el giro de bailarina a
  // mano. Ver "ANIMACIÓN POR CLIPS VRMA" más arriba: cuando hay un clip
  // activo lo aplica el mixer y la respiración/mirada van encima; si no,
  // corre aplicarCuerpoProcedural() tal cual antes.
  actualizarAnimacionClips(dt, t);

  vrm.update(dt); // spring bones + morphs internos del VRM — después de posar los huesos

  // Remedir con huesos ahora que el modelo ya se posó al menos un frame
  // (no en el mismo frame de la carga, donde el esqueleto podía no reflejar
  // la pose real todavía).
  if (_medirHuesosPendiente) {
    _medirHuesosPendiente = false;
    vrm.scene.updateMatrixWorld(true); // asegurar matrices de mundo frescas para getWorldPosition
    const medida = medirAlturaHuesos();
    if (medida) {
      console.log(`[Encuadre] altura Box3=${_modeloAlturaBox3.toFixed(3)}u  `
                + `altura huesos=${medida.altura.toFixed(3)}u`);
      _modeloAlturaLocal = medida.altura;
      _modeloCentroLocal = medida.centro;
      recalcularEncuadre(); // vuelve a fijar z/position.y — su propio log muestra el z resultante
    }
  }

  // Visemes (vía vrc.*) + jaw: DESPUÉS de vrm.update(), porque expressionManager
  // escribe cero en SUS morphs en cada update() y borraría lo que hubiéramos
  // puesto ahí (por eso la vía de fallback se aplica ANTES, ver aplicarVisemesPreUpdate).
  aplicarVisemesPostUpdate(dt);

  renderer.render(scene, camera);
}
animate();

// ═══════════════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════════════
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  aplicarTamanoRender();
  // anchorX/anchorY son fracciones normalizadas — se preservan solas. Solo hay
  // que recalcular a qué coordenada de mundo corresponden con el nuevo aspect
  // (y reposicionar el suelo synthwave si está activo).
  recalcularEncuadre();
});

// ═══════════════════════════════════════════════════
// PANEL DE CHAT (ver también el CSS en <head>)
// ═══════════════════════════════════════════════════
// HTML/CSS/JS vanilla, sin frameworks ni dependencias externas. El envío usa
// _ws directo (declarado más abajo, en WEBSOCKET) — los handlers de click
// solo lo LEEN al momento del click, mucho después de que el módulo entero
// ya terminó de evaluarse, así que el orden de declaración no importa acá.
// La recepción es al revés: window.__remChat se define ACÁ (antes de la
// sección WEBSOCKET) para que _ws.onmessage, más abajo, ya lo encuentre
// armado desde el primer mensaje que llegue.
function crearPanelChat() {

  // Única fuente de verdad para el ancho del panel: CONFIG.chat.anchoFrac.
  // fraccionAreaVisible3D() (encuadre 3D) lee ese mismo número directo de
  // CONFIG; el CSS del <head> no puede leer CONFIG (vive en el JS de acá
  // abajo), así que un custom property es el único puente entre los dos —
  // fijado acá, antes de crear el panel, para que ambos queden atados al
  // mismo valor sin poder desincronizarse.
  document.documentElement.style.setProperty('--chat-panel-width', `${CONFIG.chat.anchoFrac * 100}%`);

  const panel = document.createElement('div');
  panel.id = 'chat-panel';
  panel.innerHTML = `
    <div id="chat-header">
      <div id="chat-modeselect">
        <button data-modo="ia" class="activo" type="button">IA</button>
        <button data-modo="eco" type="button">Eco</button>
      </div>
      <div id="chat-header-actions">
        <button id="chat-voz" type="button" title="Silenciar voz">🔊</button>
        <button id="chat-reset" type="button" title="Limpiar conversación">🗑</button>
      </div>
    </div>
    <div id="chat-messages"></div>
    <div id="chat-status"></div>
    <div id="chat-inputbar">
      <div id="chat-paleta"></div>
      <input id="chat-input" type="text" placeholder="Escribile algo a Rem... (/ para comandos)" autocomplete="off">
      <button id="chat-send" type="button" title="Enviar">➤</button>
    </div>
  `;
  document.body.appendChild(panel);

  const $mensajes = panel.querySelector('#chat-messages');
  const $status   = panel.querySelector('#chat-status');
  const $input    = panel.querySelector('#chat-input');
  const $send     = panel.querySelector('#chat-send');
  const $voz      = panel.querySelector('#chat-voz');
  const $reset    = panel.querySelector('#chat-reset');
  const $modoBtns = panel.querySelectorAll('#chat-modeselect button');
  const $paleta   = panel.querySelector('#chat-paleta');

  let modoActivo = 'ia';
  let esperandoRespuesta = false;
  let burbujaRemActual = null; // <div> de la respuesta en curso (streaming), o null
  // Arranca en true — el backend también arranca con la voz activa por
  // defecto (ver rem_avatar_server._chat_voz_activa), este botón es para
  // silenciarla, no para tener que prenderla primero. Puramente local: a
  // diferencia del modo, no hay confirmación del backend ni sincronización
  // con el REPL — "voz on|off" del REPL controla SUS PROPIOS turnos, este
  // botón los del panel (ver CLAUDE.md, "Voz en la ventana de chat").
  let vozActiva = true;

  function alFondo() { $mensajes.scrollTop = $mensajes.scrollHeight; }

  function agregarBurbuja(texto, clase) {
    const div = document.createElement('div');
    div.className = `msg ${clase}`;
    div.textContent = texto;
    $mensajes.appendChild(div);
    alFondo();
    return div;
  }

  function agregarSistema(texto) {
    agregarBurbuja(texto, 'sistema');
  }

  function setEstadoUI(texto, clase) {
    $status.textContent = texto || '';
    $status.className = clase || '';
  }

  function actualizarInputHabilitado() {
    $input.disabled = esperandoRespuesta;
    $send.disabled = esperandoRespuesta;
  }

  // ═══════════════════════════════════════════════════
  // COMANDOS "/" — se resuelven ENTEROS en el frontend
  // ═══════════════════════════════════════════════════
  // Nunca salen por el WebSocket: el registro de clips solo lo conoce esta
  // página, así que un comando no genera chat_message ni turno del LLM.
  //
  // Cada comando: {descripcion, listar()?, ejecutar(arg)}. listar() (opcional)
  // es lo que hace que la paleta tenga un segundo nivel — devuelve
  // [{valor, titulo, desc}]. Un solo argumento posicional a propósito: no hace
  // falta un parser genérico de flags para lo que se necesita acá.

  // Dispara un clip a mano. Regla: los que giran el cuerpo (giraCuerpo, ver
  // CONFIG.animaciones.catalogo) sacan a Rem de cámara, así que mientras haya
  // voz sonando NO se disparan — quedan en espera y salen al vaciarse la cola
  // de audio. Los demás salen al momento, aunque esté hablando.
  function dispararClipManual(archivo) {
    const etiqueta = etiquetaClip(archivo);
    if (clipGiraCuerpo(archivo) && hayVozSonando()) {
      ponerClipEnEspera(archivo);   // reemplaza al anterior; solo se guarda uno
      agregarSistema(`⏳ ${etiqueta} — en espera: gira el cuerpo y Rem está hablando`);
      return;
    }
    // El disparo manual corre el temporizador de gestos espontáneos, para que
    // no se encadene uno automático encima del que se acaba de pedir.
    _gestoTimer = _sortearIntervaloGesto();
    window.dispararClipDebug(archivo);   // MISMA función que el handler WS debug_clip
    agregarSistema(`▶ ${etiqueta}`);
  }

  const COMANDOS = {
    animaciones: {
      descripcion: 'Disparar un clip de animación',
      listar() {
        return clipsDisponibles().map(c => ({
          valor: c.nombre,
          titulo: c.etiqueta,
          desc: c.giraCuerpo ? 'gira el cuerpo' : '',
        }));
      },
      ejecutar(arg) {
        const disponibles = clipsDisponibles();
        if (disponibles.length === 0) {
          agregarSistema('No hay clips de animación cargados.');
          return;
        }
        const f = (arg || '').trim().toLowerCase();
        if (!f) { agregarSistema('Uso: /animaciones <nombre>'); return; }
        const hit = disponibles.find(c => c.nombre.toLowerCase() === f)
                 ?? disponibles.find(c => c.etiqueta.toLowerCase() === f)
                 ?? disponibles.find(c => c.etiqueta.toLowerCase().includes(f));
        if (!hit) { agregarSistema(`No hay ninguna animación que coincida con "${arg}".`); return; }
        dispararClipManual(hit.nombre);
      },
    },
  };

  // ── Paleta ────────────────────────────────────────────────────────────
  let palAbierta = false;
  let palItems = [];      // [{valor, titulo, desc}]
  let palSel = 0;
  let palNivel = 'raiz';  // 'raiz' o el nombre del comando cuyo argumento se elige

  // "/" SOLO como primer carácter: "a/b" no abre nada. Devuelve null si el
  // texto no es un comando.
  function parsearEntrada(v) {
    if (!v.startsWith('/')) return null;
    const m = v.match(/^\/([^\s]*)(\s([\s\S]*))?$/);
    if (!m) return null;
    return { comando: m[1], tieneArg: m[2] !== undefined, arg: m[3] ?? '' };
  }

  function cerrarPaleta() {
    palAbierta = false;
    palItems = [];
    $paleta.style.display = 'none';
    $paleta.innerHTML = '';
  }

  function pintarPaleta() {
    $paleta.innerHTML = '';
    if (palItems.length === 0) {
      const v = document.createElement('div');
      v.className = 'pal-vacio';
      v.textContent = 'Sin coincidencias';
      $paleta.appendChild(v);
      return;
    }
    palItems.forEach((it, i) => {
      const fila = document.createElement('div');
      fila.className = 'pal-item' + (i === palSel ? ' sel' : '');
      const n = document.createElement('span');
      n.className = 'pal-nombre';
      n.textContent = it.titulo;
      fila.appendChild(n);
      if (it.desc) {
        const d = document.createElement('span');
        d.className = 'pal-desc';
        d.textContent = it.desc;
        fila.appendChild(d);
      }
      // mousedown, no click: preventDefault evita que el input pierda el foco,
      // así el flujo de dos niveles sigue siendo tecleable sin volver a clickear.
      fila.addEventListener('mousedown', e => { e.preventDefault(); elegir(i); });
      $paleta.appendChild(fila);
    });
    const sel = $paleta.querySelector('.pal-item.sel');
    if (sel) sel.scrollIntoView({ block: 'nearest' });
  }

  function actualizarPaleta() {
    const p = parsearEntrada($input.value);
    if (!p) { cerrarPaleta(); return; }
    const cmd = COMANDOS[p.comando];
    if (p.tieneArg && cmd && cmd.listar) {
      palNivel = p.comando;
      const f = p.arg.trim().toLowerCase();
      palItems = cmd.listar().filter(i =>
        !f || i.titulo.toLowerCase().includes(f) || i.valor.toLowerCase().includes(f));
    } else {
      palNivel = 'raiz';
      const f = p.comando.toLowerCase();
      palItems = Object.entries(COMANDOS)
        .filter(([n]) => n.toLowerCase().startsWith(f))
        .map(([n, c]) => ({ valor: n, titulo: '/' + n, desc: c.descripcion }));
    }
    palSel = 0;
    palAbierta = true;
    $paleta.style.display = '';
    pintarPaleta();
  }

  function elegir(i) {
    const it = palItems[i];
    if (!it) return;
    if (palNivel === 'raiz') {
      // Primer nivel: deja el comando escrito y pasa a listar sus argumentos.
      $input.value = `/${it.valor} `;
      $input.focus();
      if (COMANDOS[it.valor]?.listar) actualizarPaleta();
      else cerrarPaleta();
      return;
    }
    COMANDOS[palNivel]?.ejecutar(it.valor);
    $input.value = '';
    cerrarPaleta();
    $input.focus();
  }

  // Texto que empieza por "/" — se resuelve acá y NUNCA se manda al backend.
  function ejecutarComandoTexto(texto) {
    const p = parsearEntrada(texto);
    const cmd = p && COMANDOS[p.comando];
    if (!cmd) { agregarSistema(`Comando desconocido: ${texto}`); return; }
    cmd.ejecutar(p.arg);
  }

  $input.addEventListener('input', actualizarPaleta);

  function enviarMensaje() {
    const texto = $input.value.trim();
    if (!texto || esperandoRespuesta) return;
    // Un comando "/" se resuelve entero en el frontend: ni chat_message ni
    // turno del LLM. Va antes del chequeo de WS a propósito — /animaciones
    // funciona aunque el socket esté caído, no necesita backend.
    if (texto.startsWith('/')) {
      ejecutarComandoTexto(texto);
      $input.value = '';
      cerrarPaleta();
      return;
    }
    if (!_ws || _ws.readyState !== WebSocket.OPEN) {
      agregarSistema('Sin conexión con Rem — reintentando...');
      return;
    }
    agregarBurbuja(texto, 'user');
    _ws.send(JSON.stringify({ tipo: 'chat_message', texto }));
    $input.value = '';
    esperandoRespuesta = true;
    burbujaRemActual = null;
    actualizarInputHabilitado();
    setEstadoUI('Rem está pensando…', 'pensando');
  }

  $send.addEventListener('click', enviarMensaje);
  $input.addEventListener('keydown', e => {
    // La paleta se atiende PRIMERO y en el MISMO listener que el envío: así
    // el preventDefault de Enter llega seguro antes de enviarMensaje(), sin
    // depender del orden en que se hayan registrado los handlers.
    if (palAbierta) {
      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (palItems.length) { palSel = (palSel + 1) % palItems.length; pintarPaleta(); }
        return;
      }
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (palItems.length) { palSel = (palSel - 1 + palItems.length) % palItems.length; pintarPaleta(); }
        return;
      }
      if (e.key === 'Enter' || e.key === 'Tab') {
        // Con la paleta abierta Enter SELECCIONA, nunca envía — ni siquiera
        // cuando no hay coincidencias (si no, un "/anim" a medio escribir se
        // le mandaría al LLM).
        e.preventDefault();
        elegir(palSel);
        return;
      }
      if (e.key === 'Escape') { e.preventDefault(); cerrarPaleta(); return; }
    }
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviarMensaje(); }
  });

  $modoBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      const modo = btn.dataset.modo;
      if (modo === modoActivo || !_ws || _ws.readyState !== WebSocket.OPEN) return;
      _ws.send(JSON.stringify({ tipo: 'cambiar_modo', modo }));
    });
  });

  // Interruptor de voz — equivalente a "voz on|off" del REPL, para poder
  // silenciar el panel sin cerrar la ventana. Optimista (no espera
  // confirmación del backend, a diferencia del modo): un simple on/off no
  // puede fallar, y esto es puramente local al panel — no hay "voz_actual"
  // que sincronizar con nadie más.
  $voz.addEventListener('click', () => {
    vozActiva = !vozActiva;
    $voz.textContent = vozActiva ? '🔊' : '🔇';
    $voz.title = vozActiva ? 'Silenciar voz' : 'Activar voz';
    if (_ws && _ws.readyState === WebSocket.OPEN) {
      _ws.send(JSON.stringify({ tipo: 'voz', activa: vozActiva }));
    }
  });

  $reset.addEventListener('click', () => {
    if (_ws && _ws.readyState === WebSocket.OPEN) {
      _ws.send(JSON.stringify({ tipo: 'reset' }));
    }
    $mensajes.innerHTML = '';
    burbujaRemActual = null;
    esperandoRespuesta = false;
    actualizarInputHabilitado();
    setEstadoUI('', '');
  });

  // Llamado desde _ws.onmessage (ver WEBSOCKET más abajo) — traduce los
  // tipos del protocolo de chat a cambios concretos del panel.
  window.__remChat = {
    onDelta(fragmento) {
      if (!burbujaRemActual) {
        burbujaRemActual = agregarBurbuja('', 'rem');
        setEstadoUI('Rem está hablando…', 'hablando');
      }
      burbujaRemActual.textContent += fragmento;
      alFondo();
    },
    onDone() {
      esperandoRespuesta = false;
      burbujaRemActual = null;
      actualizarInputHabilitado();
      setEstadoUI('', '');
    },
    onError(mensaje) {
      esperandoRespuesta = false;
      burbujaRemActual = null;
      actualizarInputHabilitado();
      setEstadoUI('', '');
      agregarSistema(`⚠ ${mensaje}`);
    },
    onModoActual(modo) {
      const cambioReal = modo !== modoActivo;
      modoActivo = modo;
      $modoBtns.forEach(b => b.classList.toggle('activo', b.dataset.modo === modo));
      if (cambioReal) {
        $mensajes.innerHTML = '';
        agregarSistema(`Modo: ${modo === 'ia' ? 'IA' : 'Eco'}`);
      }
    },
    // Lo llama _intentarLanzarClipEnEspera() cuando por fin sale un clip que
    // estaba esperando a que Rem terminara de hablar.
    onClipLanzado(archivo) {
      agregarSistema(`▶ ${etiquetaClip(archivo)}`);
    },
  };

  cerrarPaleta();   // arranca oculta
  $input.focus();
}
crearPanelChat();

// ═══════════════════════════════════════════════════
// WEBSOCKET — con límite de reintentos
// ═══════════════════════════════════════════════════
let _wsRetries = 0;
let _ws = null;

(function conectar() {
  if (_wsRetries >= CONFIG.ws.maxRetries) {
    console.warn('[WS] Máximo de reintentos alcanzado, deteniendo reconexión');
    return;
  }
  _ws = new WebSocket(`ws://localhost:${CONFIG.ws.port}`);
  _ws.onopen = () => {
    console.log('[WS] conectado');
    _wsRetries = 0;
  };
  _ws.onmessage = e => {
    try {
      const d = JSON.parse(e.data);
      if (d.tipo === 'audio') {
        console.log('[Lipsync] mensaje de audio recibido, url=', d.url, '| eventos de timeline:', d.timeline?.length);
        encolarAudio(d.url, d.timeline);
      } else if (d.tipo === 'chat_delta') {
        window.__remChat?.onDelta(d.texto ?? '');
      } else if (d.tipo === 'chat_done') {
        window.__remChat?.onDone();
      } else if (d.tipo === 'modo_actual') {
        window.__remChat?.onModoActual(d.modo);
      } else if (d.tipo === 'error') {
        window.__remChat?.onError(d.mensaje ?? 'error desconocido');
      } else if (d.tipo === 'debug_clip') {
        window.dispararClipDebug?.(String(d.nombre ?? ''));
      } else if (d.estado) {
        estado = d.estado;
      }
    } catch (err) {
      console.warn('[WS] JSON inválido:', err);
    }
  };
  _ws.onclose = () => {
    _wsRetries++;
    setTimeout(conectar, CONFIG.ws.retryDelay);
  };
  _ws.onerror = e => console.warn('[WS] Error de conexión:', e.type);
})();

window.setEstado = s => { estado = s; };


</script>
