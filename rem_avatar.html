<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:transparent; overflow:hidden; width:100vw; height:100vh; pointer-events:none; }
  canvas { display:block; }
  #dbg { position:fixed; top:4px; left:6px; color:lime; font:11px monospace; pointer-events:none; }
</style>
</head>
<body>
<div id="dbg">iniciando…</div>

<script type="module">
// esm.sh resuelve todas las dependencias sin necesidad de importmap
import * as THREE from 'https://esm.sh/three@0.169.0';
import { GLTFLoader }    from 'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'https://esm.sh/@pixiv/three-vrm@2';

const dbg = document.getElementById('dbg');
const log = s => { dbg.textContent = s; };

// ── Renderer transparente ──────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── Escena ────────────────────────────────────────────────────────────
const scene  = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 30);
camera.position.set(0, 0.85, 2.4);
camera.lookAt(0, 0.7, 0);

scene.add(new THREE.AmbientLight(0xaabbdd, 1.1));
const key = new THREE.DirectionalLight(0xfff5e0, 1.4); key.position.set(1,3,2); scene.add(key);
const fill= new THREE.DirectionalLight(0x88aaff, 0.5); fill.position.set(-2,1,0.5); scene.add(fill);

// ── Estado ────────────────────────────────────────────────────────────
let estadoRemoto = 'idle';
let vrm = null;
const clock = new THREE.Clock();

// ── Carga VRM ─────────────────────────────────────────────────────────
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));

log('cargando modelo…');
loader.load('/rem.vrm',
  gltf => {
    vrm = gltf.userData.vrm;
    VRMUtils.removeUnnecessaryJoints(vrm.scene);
    vrm.scene.rotation.y = Math.PI;
    vrm.scene.position.set(charX, 0, 0);
    scene.add(vrm.scene);
    dbg.style.display = 'none';
    console.log('VRM cargado OK | springBones:', vrm.springBoneManager ? 'sí':'no');
  },
  xhr => log('cargando ' + Math.round(xhr.loaded/xhr.total*100) + '%'),
  err => { log('ERROR VRM: '+err); console.error(err); }
);

// ── Desktop pet — movimiento ───────────────────────────────────────────
const BORDE_IZQ=-2.0, BORDE_DER=2.0, VEL=0.5;
let charX=0, charDir=1;
let petEstado='idle_anim', petTimer=3+Math.random()*3;

function tickPet(dt) {
  if (estadoRemoto==='talking'||estadoRemoto==='thinking'){ petEstado='idle_anim'; return; }
  petTimer -= dt;
  if (petTimer<=0) {
    petEstado = petEstado==='idle_anim' ? 'walking' : 'idle_anim';
    petTimer  = petEstado==='walking' ? 3+Math.random()*5 : 2+Math.random()*4;
    if (petEstado==='walking'&&Math.random()<0.3) charDir*=-1;
  }
  if (petEstado==='walking') {
    charX += charDir*VEL*dt;
    if (charX>BORDE_DER){ charX=BORDE_DER; charDir=-1; petEstado='idle_anim'; petTimer=1+Math.random()*2; }
    if (charX<BORDE_IZQ){ charX=BORDE_IZQ; charDir= 1; petEstado='idle_anim'; petTimer=1+Math.random()*2; }
    if (vrm) vrm.scene.position.x=charX;
  }
}

// ── Helpers ───────────────────────────────────────────────────────────
const getB = n => vrm?.humanoid?.getNormalizedBoneNode(n)??null;
const setE = (n,v) => { try{vrm?.expressionManager?.setValue(n,Math.max(0,Math.min(1,v)));}catch(_){} };
const lerp  = (a,b,t) => a+(b-a)*t;

// Spring crítico: movimiento orgánico sin oscilación
function spStep(pos, vel, target, stiffness, damping, dt) {
  const f = -stiffness*(pos-target) - damping*vel;
  vel += f*dt; pos += vel*dt;
  return [pos, vel];
}

// ── Estado dinámico ───────────────────────────────────────────────────
const S = {
  // cabeza
  hZ:0,hX:0,hY:0, hvZ:0,hvX:0,hvY:0,
  // cuerpo
  bZ:0,bvZ:0,
  // brazos z (pose natural: derecho negativo, izquierdo positivo)
  ruZ:-1.30, ruVZ:0,
  luZ: 1.30, luVZ:0,
  // swing de brazos en x durante caminata
  ruX:0, ruVX:0,
  luX:0, luVX:0,
  // caderas
  hipZ:0,hipVZ:0,
  // piernas
  lulX:0,lulV:0, rulX:0,rulV:0,
  lllX:0,lllV:0, rllX:0,rllV:0,
  lftX:0,lftV:0, rftX:0,rftV:0,
};

// ── Parpadeo ──────────────────────────────────────────────────────────
let blinkT=2+Math.random()*2, blinkV=0, blinkClose=false;

// ── Habla ─────────────────────────────────────────────────────────────
const VOWELS=['aa','ih','ou','ee','oh'];
let talkT=0, lastVowel='';

// ── Mirada ────────────────────────────────────────────────────────────
let lookT=0, lookTgt={x:0,y:0}, lookCur={x:0,y:0};

// ── Fase caminata ─────────────────────────────────────────────────────
let walkPhase=0, breathT=0, swayT=0;

// ── Loop principal ────────────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  if (!vrm) { renderer.render(scene,camera); return; }

  vrm.update(dt);  // actualiza spring bones + expression manager

  breathT+=dt; swayT+=dt;

  // ── Pet logic ──────────────────────────────────────────────────────
  tickPet(dt);
  const walk = petEstado==='walking' && estadoRemoto!=='talking' && estadoRemoto!=='thinking';

  // Orientar personaje hacia dirección de marcha
  const tgtY = walk ? (charDir>0?Math.PI*0.55:Math.PI*1.45) : Math.PI;
  vrm.scene.rotation.y = lerp(vrm.scene.rotation.y, tgtY, dt*4);

  // ── Respiración ───────────────────────────────────────────────────
  const breath = Math.sin(breathT*1.05)*0.013;
  const spineB = getB('spine'), chestB = getB('upperChest')??getB('chest');
  if (chestB) chestB.rotation.x = breath*0.6;

  // ── Balanceo idle ─────────────────────────────────────────────────
  ;[S.bZ,S.bvZ] = spStep(S.bZ, S.bvZ, walk?0:Math.sin(swayT*0.6)*0.025, 16,5,dt);
  if (spineB) { spineB.rotation.z=S.bZ; spineB.rotation.x=breath; }

  // ── Animación caminata ────────────────────────────────────────────
  const wspd  = walk ? 2.2 : 0;
  walkPhase   = (walkPhase + dt*wspd) % 1;
  const wt    = walkPhase * Math.PI * 2;
  const legA  = walk ? 0.42 : 0;
  const kneeA = walk ? 0.55 : 0;
  const armA  = walk ? 0.30 : 0;
  const hipA  = walk ? 0.06 : 0;
  const hipB_ = walk ? 0.022: 0;
  const K=10, D=4;

  ;[S.lulX,S.lulV]=spStep(S.lulX,S.lulV, Math.sin(wt)*legA,K,D,dt);
  ;[S.rulX,S.rulV]=spStep(S.rulX,S.rulV,-Math.sin(wt)*legA,K,D,dt);
  ;[S.lllX,S.lllV]=spStep(S.lllX,S.lllV,Math.max(0,-Math.sin(wt))*kneeA,K,D,dt);
  ;[S.rllX,S.rllV]=spStep(S.rllX,S.rllV,Math.max(0, Math.sin(wt))*kneeA,K,D,dt);
  ;[S.lftX,S.lftV]=spStep(S.lftX,S.lftV, Math.sin(wt)*0.18,K,D,dt);
  ;[S.rftX,S.rftV]=spStep(S.rftX,S.rftV,-Math.sin(wt)*0.18,K,D,dt);
  // Swing de brazos opuesto a piernas
  ;[S.ruX,S.ruVX]=spStep(S.ruX,S.ruVX, Math.sin(wt)*armA,K,D,dt);
  ;[S.luX,S.luVX]=spStep(S.luX,S.luVX,-Math.sin(wt)*armA,K,D,dt);

  const lul=getB('leftUpperLeg');  if(lul){lul.rotation.x=S.lulX;}
  const rul=getB('rightUpperLeg'); if(rul){rul.rotation.x=S.rulX;}
  const lll=getB('leftLowerLeg');  if(lll){lll.rotation.x=S.lllX;}
  const rll=getB('rightLowerLeg'); if(rll){rll.rotation.x=S.rllX;}
  const lft=getB('leftFoot');      if(lft){lft.rotation.x=S.lftX;}
  const rft=getB('rightFoot');     if(rft){rft.rotation.x=S.rftX;}

  // Caderas — rock y bob
  ;[S.hipZ,S.hipVZ]=spStep(S.hipZ,S.hipVZ,Math.sin(wt)*hipA,18,5,dt);
  const hipB=getB('hips');
  if(hipB){hipB.rotation.z=S.hipZ; hipB.position.y=Math.abs(Math.sin(wt*2))*(-hipB_);}

  // ── Brazos ────────────────────────────────────────────────────────
  ;[S.ruZ,S.ruVZ]=spStep(S.ruZ,S.ruVZ,-1.30,22,6,dt);
  ;[S.luZ,S.luVZ]=spStep(S.luZ,S.luVZ, 1.30,22,6,dt);
  const rua=getB('rightUpperArm'), lua=getB('leftUpperArm');
  const rla=getB('rightLowerArm'), lla=getB('leftLowerArm');
  if(rua){rua.rotation.z=S.ruZ; rua.rotation.x=S.ruX+0.05;}
  if(lua){lua.rotation.z=S.luZ; lua.rotation.x=S.luX+0.05;}
  if(rla){rla.rotation.x=-0.15; rla.rotation.z=-0.08;}
  if(lla){lla.rotation.x=-0.15; lla.rotation.z= 0.08;}

  // ── Mirada dinámica ───────────────────────────────────────────────
  lookT-=dt;
  if(lookT<=0){ lookTgt.x=(Math.random()-0.5)*0.28; lookTgt.y=(Math.random()-0.5)*0.14; lookT=2+Math.random()*4; }
  lookCur.x=lerp(lookCur.x,lookTgt.x,dt*1.8);
  lookCur.y=lerp(lookCur.y,lookTgt.y,dt*1.8);

  // ── Cabeza con springs ────────────────────────────────────────────
  let tHZ=lookCur.x*0.55, tHX=-lookCur.y*0.35, tHY=-lookCur.x*0.28;
  if(estadoRemoto==='thinking'){tHZ=lerp(tHZ,-0.20,0.75);tHX=lerp(tHX,0.13,0.75);tHY=lerp(tHY,0.18,0.75);}
  ;[S.hZ,S.hvZ]=spStep(S.hZ,S.hvZ,tHZ,20,6,dt);
  ;[S.hX,S.hvX]=spStep(S.hX,S.hvX,tHX,20,6,dt);
  ;[S.hY,S.hvY]=spStep(S.hY,S.hvY,tHY,20,6,dt);
  const headB=getB('head'), neckB=getB('neck');
  if(headB){headB.rotation.z=S.hZ;headB.rotation.x=S.hX;headB.rotation.y=S.hY;}
  if(neckB){neckB.rotation.z=S.hZ*0.3;neckB.rotation.x=S.hX*0.4;}

  // ── Parpadeo ──────────────────────────────────────────────────────
  blinkT-=dt;
  if(blinkT<=0){blinkClose=true;blinkT=3+Math.random()*3;}
  blinkClose ? (blinkV+=dt*16, blinkV>=1&&(blinkV=1,blinkClose=false))
             : (blinkV=Math.max(0,blinkV-dt*12));
  setE('blink',blinkV);

  // ── Boca ──────────────────────────────────────────────────────────
  if(estadoRemoto==='talking'){
    talkT+=dt;
    const v=VOWELS[Math.floor(talkT*5)%VOWELS.length];
    if(v!==lastVowel){if(lastVowel)setE(lastVowel,0);lastVowel=v;}
    setE(v, Math.max(0.1, 0.45+Math.sin(talkT*9)*0.3));
  } else {
    if(lastVowel){setE(lastVowel,0);lastVowel='';}
    talkT=0;
  }
  setE('thinking', estadoRemoto==='thinking'?0.55:0);

  renderer.render(scene,camera);
}
animate();

// ── Resize ────────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{
  camera.aspect=window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth,window.innerHeight);
});

// ── WebSocket ─────────────────────────────────────────────────────────
(function conectar(){
  const ws=new WebSocket('ws://localhost:18766');
  ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.estado)estadoRemoto=d.estado;}catch(_){}};
  ws.onclose=()=>setTimeout(conectar,1500);
})();

window.setEstado=s=>{estadoRemoto=s;};
</script>
</body>
</html>
