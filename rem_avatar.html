<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#05000f; overflow:hidden; width:100vw; height:100vh; }
  canvas { display:block; }

  /* ── Panel de chat (ver crearPanelChat() en el script) ── mitad derecha
     de la ventana, opaca, con foco de teclado. Paleta a tono con el suelo
     synthwave (CONFIG.suelo): mismo cian, mismo fondo casi negro. */
  #chat-panel {
    position: fixed;
    top: 0; right: 0;
    /* --chat-panel-width la fija crearPanelChat() a partir de
       CONFIG.chat.anchoFrac — única fuente de verdad, compartida con el
       cálculo del encuadre 3D (fraccionAreaVisible3D()) para que no puedan
       desincronizarse. 50% es solo el valor de respaldo antes de que el
       script corra (nunca debería notarse, se fija sincrónicamente muy
       temprano). */
    width: var(--chat-panel-width, 50%);
    height: 100%;
    min-width: 300px;
    display: flex;
    flex-direction: column;
    background: linear-gradient(165deg, #070212 0%, #04000c 60%);
    border-left: 1px solid rgba(43,232,255,0.22);
    box-shadow: -28px 0 56px -28px rgba(0,0,0,0.65);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #eaf6ff;
    pointer-events: auto;
    z-index: 10;
  }

  #chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid rgba(43,232,255,0.16);
    flex: 0 0 auto;
  }

  #chat-modeselect {
    display: flex;
    gap: 4px;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(43,232,255,0.22);
    border-radius: 999px;
    padding: 3px;
  }
  #chat-modeselect button {
    appearance: none; border: none; background: transparent;
    color: #7d94a3; font: inherit; font-size: 12px; font-weight: 600;
    letter-spacing: 0.03em;
    padding: 5px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }
  #chat-modeselect button:hover { color: #eaf6ff; }
  #chat-modeselect button.activo {
    background: #2be8ff;
    color: #04141a;
    box-shadow: 0 0 12px rgba(43,232,255,0.35);
  }

  #chat-header-actions {
    display: flex;
    gap: 6px;
    flex: 0 0 auto;
  }
  #chat-voz, #chat-reset {
    appearance: none;
    border: 1px solid rgba(43,232,255,0.22);
    background: transparent;
    color: #7d94a3;
    width: 30px; height: 30px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color .15s ease, color .15s ease;
    flex: 0 0 auto;
  }
  #chat-voz:hover, #chat-reset:hover { color: #2be8ff; border-color: #2be8ff; }

  #chat-messages {
    flex: 1 1 auto;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px;
  }
  #chat-messages::-webkit-scrollbar { width: 8px; }
  #chat-messages::-webkit-scrollbar-thumb { background: #244047; border-radius: 4px; }
  #chat-messages::-webkit-scrollbar-track { background: transparent; }

  .msg {
    max-width: 82%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #182430;
    border-bottom-right-radius: 3px;
  }
  .msg.rem {
    align-self: flex-start;
    background: #0c1c22;
    border: 1px solid rgba(43,232,255,0.28);
    border-bottom-left-radius: 3px;
    box-shadow: 0 0 14px rgba(43,232,255,0.07);
  }
  .msg.sistema {
    align-self: center;
    background: transparent;
    color: #7d94a3;
    font-size: 12px;
    font-style: italic;
    max-width: 100%;
    text-align: center;
  }

  #chat-status {
    flex: 0 0 auto;
    min-height: 26px;
    padding: 0 16px;
    font-size: 12px;
    color: #7d94a3;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #chat-status::before {
    content: '';
    width: 6px; height: 6px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #2be8ff;
    opacity: 0;
    transition: opacity .15s ease;
  }
  #chat-status.pensando::before,
  #chat-status.hablando::before {
    opacity: 1;
    animation: chat-pulse 1s ease-in-out infinite;
  }
  @keyframes chat-pulse {
    0%, 100% { transform: scale(0.7); opacity: 0.4; }
    50%      { transform: scale(1.25); opacity: 1; }
  }

  #chat-inputbar {
    flex: 0 0 auto;
    display: flex;
    gap: 8px;
    padding: 10px 16px 16px;
    /* Contexto de posicionamiento para #chat-paleta, que se ancla encima
       con bottom:100% — así la paleta queda SIEMPRE dentro del panel de
       chat, sin desbordarlo ni taparse con el borde de la ventana. */
    position: relative;
  }

  /* Paleta de comandos "/" — ver crearPanelChat()/COMANDOS en el script.
     Flotante encima de la barra de input, dentro del panel. */
  #chat-paleta {
    position: absolute;
    left: 16px; right: 16px;
    bottom: 100%;
    margin-bottom: 6px;
    z-index: 5;
    max-height: 240px;
    overflow-y: auto;
    background: #081a20;
    border: 1px solid rgba(43,232,255,0.30);
    border-radius: 10px;
    box-shadow: 0 10px 30px -8px rgba(0,0,0,0.75);
    padding: 4px;
  }
  #chat-paleta::-webkit-scrollbar { width: 8px; }
  #chat-paleta::-webkit-scrollbar-thumb { background: #244047; border-radius: 4px; }
  #chat-paleta::-webkit-scrollbar-track { background: transparent; }
  #chat-paleta .pal-vacio {
    padding: 9px 11px;
    font-size: 13px;
    color: #7d94a3;
    font-style: italic;
  }
  #chat-paleta .pal-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 11px;
    border-radius: 7px;
    cursor: pointer;
    font-size: 13px;
    color: #eaf6ff;
  }
  #chat-paleta .pal-item.sel { background: rgba(43,232,255,0.14); }
  #chat-paleta .pal-item .pal-nombre { font-weight: 600; white-space: nowrap; }
  #chat-paleta .pal-item .pal-desc {
    color: #7d94a3;
    font-size: 12px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #chat-input {
    flex: 1 1 auto;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(43,232,255,0.22);
    border-radius: 10px;
    color: #eaf6ff;
    font: inherit;
    font-size: 14px;
    padding: 10px 12px;
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  #chat-input:focus {
    border-color: #2be8ff;
    box-shadow: 0 0 0 3px rgba(43,232,255,0.18);
  }
  #chat-input::placeholder { color: #56707d; }
  #chat-input:disabled { opacity: 0.5; }

  #chat-send {
    appearance: none;
    border: none;
    background: #2be8ff;
    color: #04141a;
    width: 40px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    transition: filter .15s ease, transform .1s ease, opacity .15s ease;
  }
  #chat-send:hover { filter: brightness(1.1); }
  #chat-send:active { transform: scale(0.94); }
  #chat-send:disabled { opacity: 0.4; cursor: default; }
</style>
</head>
<body>
<script type="module">
import * as THREE from 'https://esm.sh/three@0.169.0';
import { GLTFLoader }    from 'https://esm.sh/three@0.169.0/examples/jsm/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from 'https://esm.sh/@pixiv/three-vrm@2';
// Solo el loader plugin (parser + retargetizador de rotaciones al rig del modelo).
// NO se usa createVRMAnimationClip: ese además arma pistas de expresión/mirada y
// auto-crea un VRMLookAtQuaternionProxy en la escena — acá los clips solo mueven
// huesos de cuerpo (ver "ANIMACIÓN POR CLIPS VRMA" más abajo). Versión 2.1.3:
// empareja con @pixiv/three-vrm@2 (mismo three-vrm-core, mismo módulo three vía esm.sh).
import { VRMAnimationLoaderPlugin } from 'https://esm.sh/@pixiv/three-vrm-animation@2.1.3';

// Un único frontend: la ventana de escritorio (rem_chat.py — GTK3 + WebKit2,
// decorada y opaca, con foco). El overlay transparente de escritorio
// (rem_overlay.py, layer surface click-through) se eliminó; rem_chat.py lo
// sustituye por completo. rem_chat.py carga esta página con ?modo=ventana,
// que ya no cambia nada — se mantiene solo por si algún día vuelve a haber
// más de un modo.

// ═══════════════════════════════════════════════════
// CONFIGURACIÓN CENTRALIZADA
// ═══════════════════════════════════════════════════
const CONFIG = {
  // z/position.y del modelo ya no son constantes fijas: recalcularEncuadre() las
  // deriva de la altura real medida del modelo (Box3) + estas anclas normalizadas.
  camera:  { fov: 28 },
  pet:     {
    anchorY: 0.55,           // altura de reposo, fracción de pantalla (0=arriba, 1=abajo)
    // anchorX es una fracción del ÁREA 3D VISIBLE (el ancho de la ventana
    // menos CONFIG.chat.anchoFrac, la parte que no tapa el panel de chat),
    // no de la ventana completa — ver fraccionAreaVisible3D()/worldX().
    anchorX: 0.5,            // centrada en su área visible
    alturaPantalla: 0.65,   // el modelo ocupa esta fracción del alto visible
  },
  // Ancho del panel de chat, como fracción del ancho total de la ventana —
  // ÚNICA fuente de verdad: tanto el CSS del panel (var(--chat-panel-width),
  // fijada desde JS al arrancar, ver crearPanelChat()) como el encuadre 3D
  // (fraccionAreaVisible3D(), más abajo) leen este mismo número, para que no
  // puedan desincronizarse.
  chat: {
    anchoFrac: 0.5,
  },
  // Suelo de cuadrícula synthwave — ver crearSueloSynthwave().
  // Nada de reflejos ni post-procesado: GPU justa (ver CLAUDE.md, calibración de VRAM).
  suelo: {
    colorLinea:     0x2be8ff,  // cian brillante
    colorHorizonte: 0x9be8ff,  // línea de horizonte, más clara que el resto de la cuadrícula
    colorFondo:     0x05000f,  // casi negro con un tinte violeta sutil
    tamano: 40,       // lado del área cuadriculada, en unidades de mundo
    divisiones: 40,
    nieblaCerca: 3.0, // arranca justo detrás de Rem — a ella no la toca
    nieblaLejos: 16,  // a partir de acá el suelo ya se perdió en el fondo
  },
  ws:      { port: 18766, retryDelay: 1500, maxRetries: 10 },
  lighting: {
    ambient: { color: 0xb0c0dd, intensity: 1.0 },
    key:     { color: 0xfff8f0, intensity: 1.4, pos: [1.5, 3, 2] },
    fill:    { color: 0x8899ff, intensity: 0.6, pos: [-2, 1, 0.5] },
    rim:     { color: 0xffffff, intensity: 0.3, pos: [0, 2, -2] },
  },
  // Brazos/antebrazos — todo en radianes. Ver "BRAZOS ACOPLADOS AL CUERPO"
  // más abajo para cómo se combinan. Pensado para poder afinarse sin leer
  // el resto del código.
  brazos: {
    separacion:        1.20,  // ángulo de reposo de ruZ/luZ — antes 1.28 (pegados al cuerpo)
    balanceoDelante:   0.14,  // inclinación hacia delante base del upperArm (ruX/luX)
    codoFlexionBase:  -0.30,  // flexión de codo en reposo — nunca brazos rectos del todo
    codoDerivaAmp:     0.05,  // amplitud del ruido que hace derivar el codo (además de la base)
    acopleRespiracion: 0.35,  // cuánto de spr.bX (torso, respiración) se filtra al balanceo del brazo
    acopleInclinacion: 0.25,  // cuánto de spr.bZ (torso, traslado de peso) se filtra al brazo
    gestoRuidoAmp:     1.6,   // cuánto empuja el envolvente de ruido la amplitud del gesto al hablar
    gestoHablaAmp:     0.5,   // cuánto empuja la energía real del habla (apertura de mandíbula)
  },
  // Dedos — 5 dedos × 3 falanges × 2 manos, todos con el mismo patrón de
  // curvatura de reposo (decrece hacia la punta) + deriva lenta. Radianes.
  dedos: {
    curlProximal:    0.55,  // falange más cercana a la palma — la que más se curva
    curlIntermedio:  0.42,
    curlDistal:      0.28,  // la punta — la que menos se curva
    curlPulgar:      0.32,  // el pulgar se curva menos que los demás dedos, y se opone (ver código)
    derivaAmp:       0.05,  // amplitud del ruido de micro-variación, para que no queden congelados
    derivaFreq:      0.025, // muy lento a propósito — es solo para que no se vean muertos
  },
  // Animación de cuerpo con clips VRMA — ver "ANIMACIÓN POR CLIPS VRMA" más
  // abajo. Los clips controlan SOLO la pose del cuerpo; respiración, parpadeo,
  // saccades, mirada a cámara y jaw se aplican siempre encima del mixer.
  animaciones: {
    carpeta: '/Animaciones/VRMA_MotionPack/',
    // ── CATÁLOGO: el registro de TODOS los .vrma disponibles ─────────────
    // Única fuente de verdad del nombre legible y del giro de cuerpo. Lo usan
    // la precarga del arranque (construirRegistroClips) y la paleta de
    // comandos "/animaciones" del panel de chat. porEstado/gestos de más abajo
    // referencian estos archivos y heredan la etiqueta de acá — no se duplica.
    //
    //   etiqueta:   nombre legible que muestra la paleta.
    //   giraCuerpo: el clip rota el torso lo bastante como para que Rem deje
    //               de mirar a cámara. MEDIDO sobre la pista de rotación del
    //               hueso 'hips' de cada .vrma (yaw desenrollado, para contar
    //               los giros que cruzan ±180°): solo VRMA_01 (418°) y VRMA_05
    //               (408°) dan vueltas completas; el siguiente del ranking es
    //               LookAround con 40°, que no saca a Rem de cámara. El corte
    //               entre 40° y 408° no es ambiguo.
    //               Estos clips NO se disparan a mano mientras Rem habla: se
    //               encolan y salen al vaciarse la cola de audio (ver
    //               dispararClipManual en crearPanelChat).
    catalogo: {
      'Angry.vrma':      { etiqueta: 'Enfado',                giraCuerpo: false },
      'Blush.vrma':      { etiqueta: 'Sonrojo',               giraCuerpo: false },
      'Clapping.vrma':   { etiqueta: 'Aplaudir',              giraCuerpo: false },
      'Goodbye.vrma':    { etiqueta: 'Despedida',             giraCuerpo: false },
      'LookAround.vrma': { etiqueta: 'Mirar alrededor',       giraCuerpo: false },
      'Relax.vrma':      { etiqueta: 'Relajarse',             giraCuerpo: false },
      'Sad.vrma':        { etiqueta: 'Tristeza',              giraCuerpo: false },
      'Sleepy.vrma':     { etiqueta: 'Sueño',                 giraCuerpo: false },
      'Surprised.vrma':  { etiqueta: 'Sorpresa',              giraCuerpo: false },
      'Thinking.vrma':   { etiqueta: 'Pensar',                giraCuerpo: false },
      // Pack oficial VRoid — etiquetas tomadas de su propio Readme
      // (Readme_VRMA_MotionPack_EN.txt), no inventadas.
      'VRMA_01.vrma':    { etiqueta: 'Mostrar cuerpo entero', giraCuerpo: true  },
      'VRMA_02.vrma':    { etiqueta: 'Saludo',                giraCuerpo: false },
      'VRMA_03.vrma':    { etiqueta: 'Señal de V',            giraCuerpo: false },
      'VRMA_04.vrma':    { etiqueta: 'Disparar',              giraCuerpo: false },
      'VRMA_05.vrma':    { etiqueta: 'Giro de bailarina',     giraCuerpo: true  },
      'VRMA_06.vrma':    { etiqueta: 'Pose de modelo',        giraCuerpo: false },
      'VRMA_07.vrma':    { etiqueta: 'Sentadillas',           giraCuerpo: false },
    },
    crossfadeS: 0.4,  // transición clip<->clip (nativa del mixer, AnimationAction.crossFadeTo)
    // Fundido procedural<->clip (el peso de mezcla, _clipPeso — ver
    // actualizarAnimacionClips). Con easing (easeInOutCubic), no lineal.
    // fadeIn: al entrar a un clip (procedural -> clip). Empieza a contar
    //   ANTES de que el clip corra a pleno peso (mismo mecanismo de siempre).
    // fadeOut: salida NATURAL — arranca en los últimos `fadeOut` segundos del
    //   clip (medidos contra su duración real), así el peso ya llega a 0
    //   justo cuando el clip termina, en vez de saltar de golpe al último
    //   frame y recién ahí empezar a desvanecer.
    // fadeOutInterrupcion: salida FORZADA (llegó audio, cambió de estado, un
    //   estado sin clip propio corta lo que hubiera) — más corta que fadeOut
    //   a propósito: "la voz manda" tiene que notarse, no arrastrarse 0,8s.
    fadeIn: 0.5,
    fadeOut: 0.8,
    fadeOutInterrupcion: 0.3,
    // Estado emocional -> clip. talking/idle NO tienen clip (siguen procedurales).
    //   modo 'bucle'  : el clip se repite. duracionS (opcional) = tope de segundos
    //                   que el clip controla el cuerpo; al vencer hace crossfade de
    //                   vuelta a lo procedural. La CARA sigue con la emoción
    //                   (la maneja updateExpressions() por 'estado', aparte del mixer).
    //                   Sin duracionS: el clip repite hasta que cambie el estado.
    //   modo 'unaVez' : LoopOnce; al terminar el clip hace crossfade de vuelta a lo
    //                   procedural aunque el estado siga activo — nunca deja el
    //                   cuerpo plantado en el frame final (getStatePose tiene pose
    //                   procedural para sad/angry/happy/surprised, + EXPR_PROFILES).
    porEstado: {
      thinking:  { archivo: 'Thinking.vrma',  modo: 'bucle' },                // sin tope: dura lo que dure thinking
      sad:       { archivo: 'Sad.vrma',       modo: 'bucle', duracionS: 6 },
      angry:     { archivo: 'Angry.vrma',     modo: 'bucle', duracionS: 4 },
      surprised: { archivo: 'Surprised.vrma', modo: 'unaVez' },
      happy:     { archivo: 'Blush.vrma',     modo: 'unaVez' },
    },
    // Intervalo de reposo entre gestos — se sortea en este rango CADA VEZ que
    // termina un gesto (ver _alTerminarClip/updateGestos), nunca desde que
    // empieza: la espera es tiempo de reposo real, no tiempo total de ciclo.
    // El ritmo real visible es intervalo + duración del clip elegido.
    intervaloReposo: { minS: 4, maxS: 9 },
    // Gestos de reposo aleatorios — reemplazan el "giro de bailarina" a mano.
    // Solo se disparan en estado idle + sin audio. Selección ponderada por
    // 'peso'; 'horaDesde'/'horaHasta' (opcionales, hora local 0-23) restringen
    // la franja. No se repite el mismo clip dos veces seguidas (ver
    // _elegirGestoPorPeso).
    gestos: {
      repertorio: [
        { archivo: 'VRMA_05.vrma',    peso: 10 },                             // girar — el más frecuente
        { archivo: 'LookAround.vrma', peso: 3 },
        { archivo: 'VRMA_07.vrma',    peso: 1 },                              // flexiones
        { archivo: 'VRMA_01.vrma',    peso: 1 },                              // mostrar cuerpo entero
        { archivo: 'Sleepy.vrma',     peso: 3, horaDesde: 0, horaHasta: 6 }, // solo 00:00-06:00
      ],
      // disponibles pero sin usar por ahora: Goodbye.vrma, Clapping.vrma, VRMA_02.vrma
    },
    // Clip de POSE BASE para idle. A diferencia de porEstado/gestos, este sería
    // la base: cede el paso a cualquier gesto o clip de estado (crossfade) y
    // vuelve a él al terminar. Todo lo procedural sigue encima (respiración,
    // saccades, mirada, dedos, traslado de peso, ruido de cabeza).
    //
    // DESACTIVADO (archivo: null) — el reposo es el idle PROCEDURAL, con los
    // brazos en CONFIG.brazos.*. Motivo: se probó con Relax.vrma y producía una
    // T-pose casi permanente. Medido sobre las pistas del .vrma (ángulo Z del
    // upperArm, ya con el espejo VRM0 que aplica clipDeVrma; el reposo
    // procedural es ±68,8° = CONFIG.brazos.separacion 1,20 rad):
    //     t=0,0s  izq +69,7°  der -60,0°   ← coincide con el reposo procedural
    //     t=0,9s  izq +12,0°  der  -8,4°
    //     t=1,8s  izq -17,1°  der  +7,0°   ← brazos en horizontal
    //     t=3,9s  izq -18,5°  der  +1,5°
    // Es decir: el clip arranca con los brazos abajo y en ~1,2s los sube a la
    // horizontal, donde se queda el 83-85% de su ciclo de 3,93s — y corre en
    // bucle, mezclado al 0,8 sobre los brazos (mezclaBrazos). Reposo real =
    // 0,8 × T-pose. NO es un bug del mixer ni del orden de la mezcla: es el
    // contenido del clip.
    //
    // Si se quiere recuperar la pose de manos/brazos del clip sin la T-pose, el
    // camino es modo:'poseFija' (congela el frame 0, que SÍ tiene los brazos
    // abajo), no modo:'bucle'. Antes de habilitar cualquier otro .vrma acá,
    // medirle el ángulo del upperArm a lo largo del clip, no solo mirar su
    // primer frame.
    //   archivo:  null → procedural puro (el reposo por defecto, brazos en CONFIG.brazos.*).
    //             un .vrma → pose base (ver la advertencia de arriba).
    //   modo:  'bucle'    → el clip corre en loop, con timeScale variable (velMin..
    //                       velMax) para romper la periodicidad de un ciclo corto.
    //          'poseFija'  → solo el primer frame, congelado — arregla la pose sin
    //                        aportar movimiento; todo el movimiento queda procedural.
    //   mezclaBrazos: 0..1 — cuánto la pose del clip reemplaza a la procedural EN
    //                        LOS BRAZOS (hombro/upperArm/lowerArm/mano). El resto
    //                        del cuerpo queda 100% procedural: los brazos rectos
    //                        son el problema real, el resto ya se ve bien.
    //   ampProcedural: multiplica el ruido Perlin de getStatePose('idle') mientras
    //                  el clip de idle está activo (>1 rompe el patrón del bucle).
    //   velMin/velMax/velCambioS: solo 'bucle' — timeScale deriva lento entre
    //                             velMin y velMax, objetivo nuevo cada ~velCambioS s.
    idle: {

// que reporte nvidia-smi (que solo ve lo que llega a la GPU NVIDIA, no dice

    return;

// Tamaño del framebuffer con tope de VRAM (CONFIG.render). setPixelRatio(r) +
// setSize(w,h) → framebuffer = w·r × h·r, canvas CSS = w × h: con r<1 renderiza
// a menos resolución y el navegador reescala el canvas. Se llama al arrancar y
// en cada resize.
function aplicarTamanoRender() {
  const w = window.innerWidth, h = window.innerHeight;
  const R = CONFIG.render;
  let ratio = Math.min(window.devicePixelRatio || 1, R.pixelRatioMax);
  if (R.resolucionMaxPx > 0) {
    const px = w * h * ratio * ratio;
    if (px > R.resolucionMaxPx) ratio *= Math.sqrt(R.resolucionMaxPx / px);
  }
  renderer.setPixelRatio(ratio);
  renderer.setSize(w, h);
  console.log(`[Render] ventana ${w}x${h} · ratio ${ratio.toFixed(3)} · framebuffer `
            + `${Math.round(w * ratio)}x${Math.round(h * ratio)}`);
}
aplicarTamanoRender();

// ESTADO GLOBAL

let estado = 'idle';
let prevEstado = '';
let vrm = null;
const clock = new THREE.Clock();
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

// ═══════════════════════════════════════════════════
// ENCUADRE RESPONSIVO — anclas normalizadas (0..1 de pantalla), no world units fijas
// ═══════════════════════════════════════════════════
// n: 0 = izquierda/arriba, 1 = derecha/abajo. worldX/anchoVisible/alturaVisible
// se recalculan en recalcularEncuadre() y se usan para convertir fracciones a
// coordenadas de mundo en el momento de escribir vrm.scene.position.
let _anchoVisible = 0, _alturaVisible = 0;
let _modeloAlturaLocal = 1.5, _modeloCentroLocal = 0.75; // fallback razonable antes de medir
let _modeloAlturaBox3 = 0;        // guardada solo para el log comparativo
let _medirHuesosPendiente = false; // se remide con huesos en el frame siguiente a la carga
let _modeloPositionY = 0;

const worldX = n => (n - 0.5) * _anchoVisible;

// El panel de chat tapa el CONFIG.chat.anchoFrac derecho de la ventana — el
// área 3D realmente visible es más angosta que window.innerWidth. worldX()
// de arriba sigue midiendo en fracciones del CANVAS COMPLETO (a propósito:
// camera.aspect tiene que seguir atado al tamaño real del render, si no la
// imagen se distorsiona) — esta función devuelve qué fracción del canvas
// completo ocupa el área 3D visible, para convertir un anchorX pensado
// "dentro de esa área" (0=su borde izquierdo, 1=su borde derecho, justo
// donde empieza el panel) a la fracción real del canvas completo que
// worldX() espera.
function fraccionAreaVisible3D() {
  return 1 - CONFIG.chat.anchoFrac;
}

// Box3.setFromObject() sobre un VRM con SkinnedMesh da la caja de la geometría
// SIN aplicar el skinning (el shader deforma los vértices en GPU, no en los
// datos de la geometría en CPU) — en este modelo eso da ~la mitad de la altura
// real. Medimos altura real con huesos: head - min(leftFoot, rightFoot), con
// +18% arriba para cubrir pelo/adornos que no tienen hueso propio. Usa
// getRawBoneNode (el hueso real posado), no el proxy normalizado.
function medirAlturaHuesos() {
  const headB  = vrm?.humanoid?.getRawBoneNode('head');
  const lFootB = vrm?.humanoid?.getRawBoneNode('leftFoot');
  const rFootB = vrm?.humanoid?.getRawBoneNode('rightFoot');
  if (!headB || !lFootB || !rFootB) {
    console.warn('[Encuadre] faltan huesos head/leftFoot/rightFoot — se mantiene la medición por Box3');
    return null;
  }

  // Medir con vrm.scene.position.y en 0 — si no, el offset Y que ya haya
  // puesto la pasada anterior (Box3, o esta misma función en una llamada
  // previa tras un resize) se filtra en "centro". "altura" es una RESTA
  // (head - pie) y cancela ese offset sola, pero "centro" es un PROMEDIO y
  // no lo cancela — sin este reset, recalcularEncuadre() queda contaminado
  // con el offset anterior completo. Confirmado en vivo con
  // models/rem_naenae.vrm: sin esto, el modelo terminaba ~0.93u más arriba
  // de lo debido (cabeza fuera de cuadro); rem.vrm tenía el mismo bug pero
  // ~0.46u, nunca lo bastante grave como para notarse a simple vista.
  const yPrevio = vrm.scene.position.y;
  vrm.scene.position.y = 0;
  vrm.scene.updateMatrixWorld(true);

  const headPos = new THREE.Vector3(), lFootPos = new THREE.Vector3(), rFootPos = new THREE.Vector3();
  headB.getWorldPosition(headPos);
  lFootB.getWorldPosition(lFootPos);
  rFootB.getWorldPosition(rFootPos);

  vrm.scene.position.y = yPrevio;
  vrm.scene.updateMatrixWorld(true);

  const pieY = Math.min(lFootPos.y, rFootPos.y);
  const alturaCruda = headPos.y - pieY;   // hueso head al pie más bajo, sin margen
  const altura = alturaCruda * 1.18;      // +18% para pelo/adornos por encima de la cabeza
  const tope = headPos.y + (altura - alturaCruda);
  const centro = (tope + pieY) / 2;

  return { altura, centro };
}

function recalcularEncuadre() {
  const fovRad = camera.fov * Math.PI / 180;

  // 1) Distancia de cámara tal que el modelo (altura real medida) ocupe
  //    CONFIG.pet.alturaPantalla del alto visible de pantalla.
  const alturaVisibleObjetivo = _modeloAlturaLocal / CONFIG.pet.alturaPantalla;
  camera.position.set(0, 0, alturaVisibleObjetivo / (2 * Math.tan(fovRad / 2)));
  camera.lookAt(0, 0, 0);
  camera.updateProjectionMatrix();

  // 2) Alturas/anchos visibles reales a esa distancia (fórmulas pedidas).
  _alturaVisible = 2 * camera.position.z * Math.tan(fovRad / 2);
  _anchoVisible  = _alturaVisible * camera.aspect;

  // 3) Y del modelo: el centro de su caja (medida) debe caer en anchorY de
  //    pantalla, con la cámara siempre mirando al origen (paso 1).
  const centroObjetivoMundo = _alturaVisible * (0.5 - CONFIG.pet.anchorY);
  _modeloPositionY = centroObjetivoMundo - _modeloCentroLocal;

  // La X es fija (sin caminata): CONFIG.pet.anchorX, una fracción del ÁREA 3D
  // VISIBLE (no del canvas completo) — fraccionAreaVisible3D() la convierte a
  // fracción de canvas completo antes de pasarla a worldX() (ver esa función).
  const fracXCanvas = CONFIG.pet.anchorX * fraccionAreaVisible3D();
  const posX = worldX(fracXCanvas);
  if (vrm) {
    vrm.scene.position.y = _modeloPositionY;
    vrm.scene.position.x = posX;
  }

  // Cámara alineada con Rem en X — antes quedaba siempre en x=0 mientras
  // Rem estaba desplazada a un costado (posX), así que la veía en tres
  // cuartos: su cuerpo mira al frente de la escena (-Z), pero el vector
  // cámara->Rem tenía una componente en X, y los ojos (ver "MIRADA A
  // CÁMARA" más abajo) tenían que girar para compensar ESE ángulo
  // estructural además de cualquier seguimiento real — y ese giro extra
  // competía con el rango de mirada bastante angosto que trae el modelo
  // (ver CONFIG.mirada y el log de rangos al cargar el VRM). Con
  // camera.position.x y el lookAt en el mismo X que el modelo, el vector
  // cámara->Rem es puramente -Z: vista frontal de verdad.
  //
  // Como el punto que mira la cámara siempre proyecta al centro de la
  // imagen, esto por sí solo centraría a Rem en el medio del CANVAS
  // COMPLETO — en modo ventana, debajo del panel de chat. setViewOffset()
  // corrige eso sin volver a rotar la cámara (que reintroduciría el
  // ángulo que se acaba de eliminar): es un corrimiento de "lente
  // descentrado" (el mismo truco que un objetivo tilt-shift o un
  // corrimiento de cámara de arquitectura) que reencuadra la imagen ya
  // renderizada para que Rem siga apareciendo en fracXCanvas del canvas,
  // como antes.
  camera.position.x = posX;
  camera.lookAt(posX, 0, 0);
  const offsetX = (0.5 - fracXCanvas) * window.innerWidth;
  camera.setViewOffset(window.innerWidth, window.innerHeight, offsetX, 0, window.innerWidth, window.innerHeight);
  camera.updateProjectionMatrix();

  posicionarSuelo(posX);

  console.log(`[Encuadre] z=${camera.position.z.toFixed(3)} anchoVisible=${_anchoVisible.toFixed(3)} `
            + `alturaVisible=${_alturaVisible.toFixed(3)} position.y=${_modeloPositionY.toFixed(3)} `
            + `position.x=${posX.toFixed(3)} (anchorX=${CONFIG.pet.anchorX}) viewOffsetX=${offsetX.toFixed(1)}px`);
}

// ═══════════════════════════════════════════════════
// SUELO DE CUADRÍCULA SYNTHWAVE
// ═══════════════════════════════════════════════════
// GridHelper + Fog — nada de reflejos ni post-procesado (la GPU de esta
// máquina ya anda justa compartiendo VRAM con RVC/el LLM local, ver
// CLAUDE.md). La niebla es lo que da la sensación de perspectiva hacia un
// horizonte, no geometría extra: las líneas lejanas se funden con
// colorFondo en vez de dibujarse nítidas hasta el infinito.
let _grid = null, _horizonte = null;

function crearSueloSynthwave() {
  const cfg = CONFIG.suelo;
  _grid = new THREE.GridHelper(cfg.tamano, cfg.divisiones, cfg.colorLinea, cfg.colorLinea);
  _grid.material.transparent = true;
  _grid.material.opacity = 0.8;
  scene.add(_grid);

  // Línea de horizonte: más brillante que el resto de la cuadrícula, en el
  // borde lejano — refuerza el punto de fuga. fog=false para que no se
  // apague con la distancia como el resto de la cuadrícula: es justo la
  // marca de "hasta acá se ve", tiene que quedar siempre legible.
  const mitad = cfg.tamano / 2;
  const geomHorizonte = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(-mitad, 0, -mitad),
    new THREE.Vector3( mitad, 0, -mitad),
  ]);
  const matHorizonte = new THREE.LineBasicMaterial({
    color: cfg.colorHorizonte, transparent: true, opacity: 0.9, fog: false,
  });
  _horizonte = new THREE.Line(geomHorizonte, matHorizonte);
  scene.add(_horizonte);

  scene.fog = new THREE.Fog(cfg.colorFondo, cfg.nieblaCerca, cfg.nieblaLejos);
  scene.background = new THREE.Color(cfg.colorFondo);
  renderer.setClearColor(cfg.colorFondo, 1); // opaca — la ventana no es transparente

  console.log('[Suelo] synthwave creado:', cfg);
}

// Alinea el suelo con los pies de Rem (Y) y con la cámara (X) — se llama
// desde recalcularEncuadre() cada vez que cambia _modeloPositionY/posX
// (carga, remedición por huesos, resize). El punto de fuga de la cuadrícula
// lo determina el eje óptico REAL de la cámara (camera.position.x, no dónde
// termina apareciendo Rem en pantalla tras el setViewOffset) — como ahora
// la cámara mira exactamente a posX (ver recalcularEncuadre()), centrar
// también el suelo en posX pone el punto de fuga justo detrás de Rem, en
// vez de en el x=0 fijo de antes (que ya no significa nada particular).
function posicionarSuelo(posX = 0) {
  if (!_grid) return;
  const pieY = _modeloPositionY + (_modeloCentroLocal - _modeloAlturaLocal / 2);
  _grid.position.set(posX, pieY, 0);
  if (_horizonte) _horizonte.position.set(posX, pieY, 0);
}

crearSueloSynthwave();

// ═══════════════════════════════════════════════════
// CARGA VRM
// ═══════════════════════════════════════════════════
const loader = new GLTFLoader();
loader.register(p => new VRMLoaderPlugin(p));
// El MISMO loader carga .vrm y .vrma. El plugin de animación es inerte para un
// .vrm (su afterRoot chequea la extensión VRMC_vrm_animation y sale si no está).
loader.register(p => new VRMAnimationLoaderPlugin(p));

// Retry con espera exponencial: el WebKit2GTK de este proyecto sufre crashes
// internos del Network Process (ver CLAUDE.md, "crash interno del Network
// Process de WebKit") que pueden tirar abajo este fetch justo en el peor
// momento. El WebSocket ya se reconecta solo; loader.load() no tiene retry propio,
// así que sin esto un crash en esa ventana deja el avatar invisible por el
// resto de la sesión aunque el resto del pipeline (audio, lipsync, WS) siga
// funcionando con normalidad. La causa raíz es un bug de WebKit, no algo que
// se arregle acá — esto solo evita que un fallo transitorio sea permanente.
const VRM_MAX_INTENTOS = 5;

function _cargarVRM(intento = 1) {
  const _t0Carga = performance.now();
  loader.load('/' + MODELO_ACTIVO,
    gltf => {
      console.log(`[Modelo] "${MODELO_ACTIVO}" descargado+parseado en ${(performance.now() - _t0Carga).toFixed(0)}ms`);
      vrm = gltf.userData.vrm;
      window.__rem.vrm = vrm;
      VRMUtils.removeUnnecessaryJoints(vrm.scene);
      vrm.scene.rotation.y = Math.PI;
      vrm.scene.scale.set(1, 1, 1);
      vrm.scene.position.set(0, 0, 0); // posición neutra: medir la caja sin offsets propios
      // Un clip VRMA puede sacar un miembro fuera del bounding box con el que se
      // subió la geometría — sin esto el frustum culling lo recorta en silencio
      // a mitad de animación (está en el ejemplo oficial de three-vrm-animation).
      vrm.scene.traverse(o => { o.frustumCulled = false; });
      scene.add(vrm.scene);
      inicializarAnimacionClips(); // mixer + lista de huesos normalizados para la mezcla
      precargarClips();        // .vrma del catálogo en paralelo, sin bloquear el render

      // Medición inicial por Box3 — placeholder para el primer frame o dos, hasta
      // que la remedición por huesos (más abajo, en animate()) la corrija. Se
      // guarda en _modeloAlturaBox3 solo para el log comparativo.
      const caja = new THREE.Box3().setFromObject(vrm.scene);
      _modeloAlturaBox3 = caja.max.y - caja.min.y;
      _modeloAlturaLocal = _modeloAlturaBox3;
      _modeloCentroLocal = (caja.max.y + caja.min.y) / 2;
      console.log(`[Encuadre] altura por Box3 (provisoria): ${_modeloAlturaBox3.toFixed(3)} u`
                + ` (min.y=${caja.min.y.toFixed(3)}, max.y=${caja.max.y.toFixed(3)})`);

      recalcularEncuadre(); // fija camera.position.z, vrm.scene.position.y/x y el lookAt (provisorio)
      _medirHuesosPendiente = true; // remedir con huesos en el próximo frame, una vez posado (ver animate())

      const names = vrm.expressionManager?.expressions?.map(e => e.expressionName) ?? [];
      console.log('[VRM] OK | expressions:', names.join(', '));
      console.log('[VRM] springBones:', vrm.springBoneManager ? 'sí' : 'no');
      // Diagnóstico de lo que necesita la animación natural (ver "RUIDO
      // PERLIN 1D"/"MICRO-SACCADES" más abajo): si este modelo no trajera
      // alguno de estos, mejor saberlo acá que verlo fallar en silencio.
      console.log('[VRM] lookAt (micro-saccades):', vrm.lookAt ? 'sí' : 'no',
                  '| leftShoulder/rightShoulder (respiración en hombros):',
                  !!getB('leftShoulder'), !!getB('rightShoulder'));
      if (vrm.lookAt) {
        // target=camera es solo documentación viva (vrm.lookAt.target dice
        // "mira a la cámara" a quien lea/inspeccione esto en consola) —
        // autoUpdate=false porque el cálculo real lo dispara a mano
        // updateSaccades() (más abajo, "MIRADA A CÁMARA + MICRO-SACCADES"),
        // llamando a vrm.lookAt.lookAt(...) él mismo para poder sumarle
        // encima las saccades y el apartar-la-mirada antes de que
        // vrm.update() aplique el resultado a los huesos de los ojos. Con
        // autoUpdate en true (el default), vrm.update() volvería a llamar a
        // este mismo lookAt() por su cuenta y pisaría ese trabajo.
        vrm.lookAt.target = camera;
        vrm.lookAt.autoUpdate = false;

        // Rangos reales del lookAt de ESTE modelo (extensión VRM 0.x
        // firstPerson.lookAt{Horizontal,Vertical}{Inner,Outer,Down,Up}):
        // cada uno define inputMaxValue/outputScale — el ángulo pedido
        // (yaw/pitch en grados) se recorta a outputScale grados de rotación
        // real de ojo, en proporción lineal hasta inputMaxValue grados de
        // pedido (más allá de eso, se satura en outputScale). Confirmado
        // para rem.vrm inspeccionando el glTF crudo (dump_vrm.py): las
        // cuatro curvas son la identidad soportada por three-vrm
        // ([0,0,0,1,1,1,1,0], sin easing extra), con xRange=90/yRange=10 —
        // o sea el ojo real solo gira ~1/9 de lo que se le pide, hasta un
        // tope de 10° en cualquier dirección. Se loguea acá (no solo en el
        // script de inspección offline) para que quede visible en vivo si
        // el modelo cambia algún día.
        const ap = vrm.lookAt.applier;
        if (ap?.rangeMapHorizontalInner) {
          const fmt = rm => `in≤${rm.inputMaxValue}° -> out≤${rm.outputScale}°`;
          console.log('[VRM] rangos de lookAt — horizontal(inner/outer):',
                      fmt(ap.rangeMapHorizontalInner), '/', fmt(ap.rangeMapHorizontalOuter),
                      '| vertical(down/up):', fmt(ap.rangeMapVerticalDown), '/', fmt(ap.rangeMapVerticalUp));
        } else {
          console.warn('[VRM] no se pudo leer vrm.lookAt.applier.rangeMap* — ¿lookAtTypeName no es "Bone"?');
        }
      }
      {
        const dedosFaltantes = [];
        for (const lado of ['left', 'right']) {
          for (const dedo of ['Thumb', 'Index', 'Middle', 'Ring', 'Little']) {
            for (const falange of ['Proximal', 'Intermediate', 'Distal']) {
              if (!getB(`${lado}${dedo}${falange}`)) dedosFaltantes.push(`${lado}${dedo}${falange}`);
            }
          }
        }
        console.log(`[VRM] dedos: ${30 - dedosFaltantes.length}/30 mapeados`,
                    dedosFaltantes.length ? `— faltan: ${dedosFaltantes.join(', ')}` : '');
        console.log('[VRM] piernas (para clips VRMA):',
                    !!getB('rightUpperLeg'), !!getB('rightLowerLeg'),
                    !!getB('leftUpperLeg'), !!getB('leftLowerLeg'));
        // Sin jaw, aplicarVisemesPostUpdate() ya lo tolera (jawB queda null,
        // ver el guard `if (jawB)`) — esto es solo para que se note en el
        // log de arranque, no un chequeo funcional.
        if (!vrm.humanoid.getRawBoneNode('jaw')) {
          console.log('[VRM] sin hueso "jaw" — la apertura de mandíbula no se anima por hueso; '
                     + 'los visemes (morph targets) siguen moviendo la boca igual.');
        }
      }
      _exprMap = buildExprMap(names);
      localizarMallaFacial();
    },
    xhr => console.log('[VRM] cargando', Math.round(xhr.loaded / xhr.total * 100) + '%'),
    err => {
      console.error(`[VRM] error (intento ${intento}/${VRM_MAX_INTENTOS}):`, err);
      if (intento < VRM_MAX_INTENTOS) {
        const espera = Math.min(500 * (2 ** intento), 5000);
        console.warn(`[VRM] reintentando en ${espera}ms...`);
        setTimeout(() => _cargarVRM(intento + 1), espera);
      } else {
        console.error(`[VRM] no se pudo cargar tras ${VRM_MAX_INTENTOS} intentos — el avatar queda invisible por el resto de la sesión.`);
      }
    }
  );
}

_cargarVRM();

// ═══════════════════════════════════════════════════
// HELPERS: HUESOS Y EXPRESIONES
// ═══════════════════════════════════════════════════
const getB = n => vrm?.humanoid?.getNormalizedBoneNode(n) ?? null;

// Candidatos de nombre por clave lógica — se resuelven contra los nombres reales del VRM al cargar
const _exprCandidates = {
  happy:     ['happy', 'joy', 'blendshape.joy', 'preset.happy'],
  sad:       ['sad', 'sorrow', 'blendshape.sorrow', 'preset.sad'],
  angry:     ['angry', 'blendshape.angry', 'preset.angry'],
  // En rem.vrm esta expresión no tiene presetName estándar (VRM 0.x, presetName='unknown'),
  // three-vrm la expone por su nombre literal: 'Surprised' con mayúscula.
  surprised: ['surprised', 'Surprised', 'blendshape.surprised', 'preset.surprised'],
  blink:     ['blink', 'blendshape.blink', 'blinkleft', 'blinkl'],
  // Presets estándar de VRM para los 5 visemes (vocales) — usados solo como
  // fallback vía expressionManager cuando el modelo no expone morph targets
  // vrc.* directos (ver localizarMallaFacial() / FONEMA_A_VISEME_VRM en lipsync.py).
  aa: ['aa', 'a', 'blendshape.a'],
  ee: ['ee', 'e', 'blendshape.e'],
  ih: ['ih', 'i', 'blendshape.i'],
  oh: ['oh', 'o', 'blendshape.o'],
  ou: ['ou', 'u', 'blendshape.u'],
};

// Mapa clave lógica → nombre real de expresión en este VRM (null si no hay equivalente)
let _exprMap = {};

function buildExprMap(names) {
  const map = {};
  for (const [key, candidates] of Object.entries(_exprCandidates)) {
    const found = names.find(n => candidates.includes(n.toLowerCase()));
    map[key] = found ?? null;
  }
  console.log('[VRM] mapa de expresiones resuelto:', map);
  return map;
}

function trySetExpr(key, value) {
  const name = _exprMap[key];
  if (!vrm?.expressionManager || !name) return;
  vrm.expressionManager.setValue(name, clamp(value, 0, 1));
}

// ═══════════════════════════════════════════════════
// SISTEMA DE EXPRESIONES EMOCIONALES
// ═══════════════════════════════════════════════════
const EXPR_PROFILES = {
  idle:      { happy: 0.0, sad: 0.0, angry: 0.0, surprised: 0.0 },
  talking:   { happy: 0.3, sad: 0.0, angry: 0.0, surprised: 0.0 },
  thinking:  { happy: 0.0, sad: 0.1, angry: 0.0, surprised: 0.0 },
  happy:     { happy: 1.0, sad: 0.0, angry: 0.0, surprised: 0.1 },
  sad:       { happy: 0.0, sad: 0.9, angry: 0.0, surprised: 0.0 },
  angry:     { happy: 0.0, sad: 0.0, angry: 0.8, surprised: 0.0 },
  surprised: { happy: 0.1, sad: 0.0, angry: 0.0, surprised: 1.0 },
};
const curExpr = { happy: 0, sad: 0, angry: 0, surprised: 0 };

// Qué expresiones (claves de EXPR_PROFILES/_exprMap) bindean morphs de boca
// en ESTE modelo y hay que suprimir mientras hay audio, para que no compitan
// con los visemes — ver CONFIG.modelos[...].expresionesSuprimirHabla. Un
// Set, no el array crudo, para el chequeo por frame de abajo.
const _expresionesSuprimirHabla = new Set(PERFIL_MODELO.expresionesSuprimirHabla ?? []);

function updateExpressions(dt) {
  const profile = EXPR_PROFILES[estado] ?? EXPR_PROFILES.idle;
  const suprimirBocaExpr = _audioActivo;
  for (const [k, target] of Object.entries(profile)) {
    curExpr[k] = lerp(curExpr[k], target, dt * 2.5);
    trySetExpr(k, (suprimirBocaExpr && _expresionesSuprimirHabla.has(k)) ? 0 : curExpr[k]);
  }
}

// ═══════════════════════════════════════════════════
// SISTEMA DE PARPADEO NATURAL
// ═══════════════════════════════════════════════════
let blinkPhase = 'wait'; // 'wait' | 'closing' | 'opening' | 'doubleWait'
let blinkTimer  = 2.5 + Math.random() * 2;
let blinkVal    = 0;
let blinkDouble = false;
let blinkDoubleWait = 0;

function updateBlink(dt) {
  // Intervalo base por estado — thinking parpadea más
  const baseInterval = estado === 'thinking' ? 1.8
                     : estado === 'talking'   ? 2.2 : 3.5;

  switch (blinkPhase) {
    case 'wait':
      blinkTimer -= dt;
      if (blinkTimer <= 0) {
        blinkPhase = 'closing';
        blinkDouble = Math.random() < 0.05; // 5% doble parpadeo
      }
      break;
    case 'closing':
      blinkVal += dt / 0.08; // cierra en 80ms
      if (blinkVal >= 1) { blinkVal = 1; blinkPhase = 'opening'; }
      break;
    case 'opening':
      blinkVal -= dt / 0.12; // abre en 120ms
      if (blinkVal <= 0) {
        blinkVal = 0;
        if (blinkDouble) { blinkDouble = false; blinkDoubleWait = 0.07; blinkPhase = 'doubleWait'; }
        else              { blinkPhase = 'wait'; blinkTimer = baseInterval * (0.7 + Math.random() * 0.8); }
      }
      break;
    case 'doubleWait':
      blinkDoubleWait -= dt;
      if (blinkDoubleWait <= 0) blinkPhase = 'closing';
      break;
  }
  trySetExpr('blink', blinkVal);
}

// ═══════════════════════════════════════════════════
// LIPSYNC REAL — audio del backend + timeline de visemes (lipsync.py)
// ═══════════════════════════════════════════════════
// Un <audio> de HTML en vez de Web Audio API: el audio puede empezar a sonar
// antes de que el usuario interactúe con la página (primera respuesta de Rem
// apenas se abre la ventana), y un AudioContext se queda 'suspended' hasta un
// gesto real — set_media_playback_requires_user_gesture(False) en WebKit2 no
// lo destraba porque esa política es solo para elementos de medios, no para
// la Web Audio API. HTMLMediaElement.play() sí arranca sin gesto en este
// WebView (con WebsitePolicies(autoplay=ALLOW), ver rem_chat.py), así que
// elimina el problema de raíz en vez de trabajar alrededor de él.
const _audioEl = new Audio();
let _audioActivo = false; // true entre 'playing' y 'ended'/'error'

function _avanzarCola() {
  _audioActivo = false;
  _timeline = [];
  if (_audioPlayQueue.length > 0) {
    _reproducirSiguienteDeCola();
  } else {
    _audioPlaying = false;
    if (estado === 'talking') estado = 'idle';
    // Cola de voz vacía: es el momento de soltar un clip que gira el cuerpo y
    // quedó esperando a que Rem terminara de hablar (ver _clipEnEspera).
    _intentarLanzarClipEnEspera();
  }
}

// Logs de diagnóstico explícitos alrededor de toda la reproducción — el
// volcado de consola de rem_chat.py a rem_chat.log deja verlos en vivo.
_audioEl.addEventListener('playing', () => {
  console.log('[Lipsync] evento "playing" ->', _audioEl.src);
  _audioActivo = true;
  estado = 'talking';
});
_audioEl.addEventListener('ended', _avanzarCola);
// MediaError.code: 1=ABORTED 2=NETWORK 3=DECODE 4=SRC_NOT_SUPPORTED.
// code=3 confirmaría que WebKit no puede decodificar el WAV (RVC produce
// 40000 Hz, un sample rate inusual) — distinto de un NotAllowedError de
// play(), que sería la política de autoplay todavía activa.
const _MEDIA_ERROR_NOMBRES = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'SRC_NOT_SUPPORTED' };
_audioEl.addEventListener('error', () => {
  const err = _audioEl.error;
  console.error('[Lipsync] evento "error" para', _audioEl.src,
    '| code:', err?.code, `(${_MEDIA_ERROR_NOMBRES[err?.code] ?? '?'})`,
    '| message:', err?.message,
    '| readyState:', _audioEl.readyState, '| networkState:', _audioEl.networkState);
  _avanzarCola();
});
_audioEl.addEventListener('stalled', () => {
  console.warn('[Lipsync] evento "stalled" para', _audioEl.src,
    '| readyState:', _audioEl.readyState, '| networkState:', _audioEl.networkState);
});

// Vocabulario canónico de 15 visemes que manda el timeline de lipsync.py
// (timeline[].viseme, "vrc.v_*") — es una convención INTERNA de este
// proyecto para hablar de "el viseme de la vocal a", no un nombre que se
// asuma presente en ningún VRM. Cada modelo declara en CONFIG.modelos[...]
// .lipsync.visemas a qué morph(s) REAL(es) de SU archivo contribuye cada uno
// de estos 15 nombres, y con qué peso — ver localizarMallaFacial() más abajo,
// que resuelve esos nombres reales contra morphTargetDictionary. Ya no hay
// ningún índice fijo en el código: si un modelo no declara un viseme, o
// declara un morph que no existe en el archivo, se loguea y ese viseme
// simplemente no mueve nada (nunca se escribe a ciegas en una posición).
const VISEME_NAMES = [
  'vrc.v_aa', 'vrc.v_e', 'vrc.v_ih', 'vrc.v_oh', 'vrc.v_ou',
  'vrc.v_pp', 'vrc.v_ff', 'vrc.v_ss', 'vrc.v_dd', 'vrc.v_kk',
  'vrc.v_nn', 'vrc.v_rr', 'vrc.v_ch', 'vrc.v_sil', 'vrc.v_th',
];

const JAW_MAX_RAD        = 0.25;  // apertura máxima del hueso jaw, en radianes (eje X)
const JAW_SMOOTH_SPEED   = 20;    // suavizado exponencial (lerp con dt)

// nombre canónico -> [{mesh, idx, peso}, ...], resuelto en localizarMallaFacial()
// contra el perfil del modelo activo (PERFIL_MODELO.lipsync.visemas).
let _visemeSlots = {};
// Deduplicado de TODOS los (mesh,idx) que aparecen en _visemeSlots — para
// poder poner todo en 0 una vez por frame antes de sumar los visemes activos
// (varios visemes canónicos pueden compartir el mismo morph real, ver el
// perfil "reducido" del modelo nuevo: dd/nn/ss/th/rr/ch comparten "ih").
let _visemeSlotsUnicos = [];
let _audioPlayQueue = [];  // cola FIFO: {url, timeline} — para no solapar frases
let _audioPlaying  = false;
let _timeline       = [];
let _timelineIdx     = 0;
let _jawApertura     = 0;
// "Energía del habla": versión suavizada de _jawApertura, usada para que la
// gesticulación de brazos en modo talking siga la intensidad real de lo que
// se está diciendo (ver "BRAZOS ACOPLADOS AL CUERPO" y getStatePose(),
// case 'talking') en vez de moverse siempre igual. Sube rápido, baja rápido
// también (mismo dt*8) — no hace falta que sea más lenta al bajar, el
// envolvente de ruido de getStatePose() ya aporta la parte "lenta".
let _hablaEnergia = 0;
function actualizarHablaEnergia(dt) {
  const objetivo = _audioActivo ? clamp(_jawApertura * 1.3, 0, 1) : 0;
  _hablaEnergia = lerp(_hablaEnergia, objetivo, dt * 8);
}

// Dos vías de lipsync, en orden de preferencia:
//   'directo'           — resuelve PERFIL_MODELO.lipsync.visemas contra
//                         morphTargetDictionary (por NOMBRE, nunca por índice
//                         fijo) y escribe morphTargetInfluences. Cubre tanto
//                         un modelo con los 15 visemes completos (rem.vrm)
//                         como uno con un set reducido (el modelo nuevo).
//   'expressionManager' — último recurso, si el perfil del modelo no resolvió
//                         NINGÚN morph real: 5 presets estándar de VRM
//                         (aa/ee/ih/oh/ou) vía setValue().
let _viaLipsync = 'expressionManager';
const VRM_VISEME_KEYS = ['aa', 'ee', 'ih', 'oh', 'ou'];

// Normaliza nombres de morph target para comparar sin depender de mayúsculas/
// puntuación exacta (defensivo: GLTFLoader usa los nombres crudos de
// extras.targetNames sin sanitizar, pero no cuesta nada ser tolerante).
function _normalizarNombreMorph(s) {
  return s.toLowerCase().replace(/[^a-z0-9]/g, '');
}

function localizarMallaFacial() {
  _visemeSlots = {};
  for (const nombre of VISEME_NAMES) _visemeSlots[nombre] = [];

  let mallasConDiccionario = 0;
  let mallasSinDiccionario = 0;
  const clavesUnicas = new Set();   // diagnóstico: unión de TODAS las claves reales vistas
  const mallasGrandes = [];         // diagnóstico: mallas con > 40 claves (candidatas a "la" malla facial)
  // nombre real de morph (tal cual aparece en morphTargetDictionary) -> [{mesh, idx}, ...]
  // — varias mallas (primitives de un mismo mesh baked) pueden compartir la
  // misma clave, hay que escribir en todas o la cara se movería a trozos.
  const todosLosMorphsPorNombre = {};

  vrm.scene.traverse(obj => {
    if (!obj.isMesh) return;

    const morphCount = obj.geometry?.morphAttributes?.position?.length ?? 0;

    if (!obj.morphTargetDictionary) {
      if (morphCount > 0) {
        // GLTFLoader solo construye morphTargetDictionary si
        // mesh.morphTargetInfluences.length === extras.targetNames.length.
        // Si este primitive trae una cantidad de morph attributes distinta a
        // la de targetNames (común cuando el exportador reparte los morphs
        // de forma desigual entre primitives), el diccionario NUNCA se crea
        // — sin importar el nombre. Buscá en la consola el warning
        // "THREE.GLTFLoader: Invalid extras.targetNames length" para confirmarlo.
        mallasSinDiccionario++;
        console.warn(`[Lipsync] malla "${obj.name}": ${morphCount} morph attributes en la geometría` +
          ` pero SIN morphTargetDictionary (mismatch de longitud con extras.targetNames — ver warning de GLTFLoader arriba)`);
      }
      return;
    }

    mallasConDiccionario++;
    const claves = Object.keys(obj.morphTargetDictionary);
    console.log(`[Lipsync] malla "${obj.name}" — ${claves.length} morph targets:`, claves.join(', '));
    for (const c of claves) clavesUnicas.add(c);
    if (claves.length > 40) mallasGrandes.push(obj.name);

    for (const clave of claves) {
      (todosLosMorphsPorNombre[clave] ??= []).push({ mesh: obj, idx: obj.morphTargetDictionary[clave] });
    }
  });

  console.log(`[Lipsync][diag] claves únicas en los ${mallasConDiccionario} diccionarios `
            + `(${clavesUnicas.size} distintas):`, [...clavesUnicas].sort());
  console.log('[Lipsync][diag] mallas con más de 40 claves:', mallasGrandes);

  // Resolver PERFIL_MODELO.lipsync.visemas contra lo que realmente existe en
  // este archivo. Nunca se escribe a ciegas: un morph declarado que no
  // aparece en NINGÚN diccionario queda logueado y sin efecto.
  const tabla = PERFIL_MODELO.lipsync?.visemas ?? {};
  const morphsNoEncontrados = [];
  const visemesSinDeclarar = [];
  const _visemeSlotsUnicosSet = new Set(); // dedupe por mesh+idx (mesh.uuid+':'+idx)

  for (const nombre of VISEME_NAMES) {
    const entradas = tabla[nombre];
    if (entradas === undefined) { visemesSinDeclarar.push(nombre); continue; }
    for (const { morph, peso } of entradas) {
      const encontrados = todosLosMorphsPorNombre[morph];
      if (!encontrados || encontrados.length === 0) {
        morphsNoEncontrados.push(`${nombre} -> "${morph}"`);
        continue;
      }
      for (const { mesh, idx } of encontrados) {
        _visemeSlots[nombre].push({ mesh, idx, peso });
        const clave = mesh.uuid + ':' + idx;
        if (!_visemeSlotsUnicosSet.has(clave)) {
          _visemeSlotsUnicosSet.add(clave);
          _visemeSlotsUnicos.push({ mesh, idx });
        }
      }
    }
  }

  const resueltos = VISEME_NAMES.filter(n => _visemeSlots[n].length > 0);
  console.log(`[Lipsync] perfil "${MODELO_ACTIVO}": ${resueltos.length}/${VISEME_NAMES.length} `
            + `visemes resueltos por nombre, ${_visemeSlotsUnicos.length} slot(s) de morph únicos ->`, resueltos);
  if (visemesSinDeclarar.length) {
    console.log(`[Lipsync] visemes sin declarar en el perfil (se quedan en 0 siempre): ${visemesSinDeclarar.join(', ')}`);
  }
  if (morphsNoEncontrados.length) {
    console.warn(`[Lipsync] morphs del perfil que NO existen en este VRM (sin efecto): ${morphsNoEncontrados.join(', ')}`);
  }

  _viaLipsync = resueltos.length > 0 ? 'directo' : 'expressionManager';
  if (_viaLipsync === 'expressionManager') {
    console.warn(`[Lipsync] VÍA ACTIVA: fallback a vrm.expressionManager (aa/ee/ih/oh/ou) — `
               + `el perfil de "${MODELO_ACTIVO}" no resolvió ningún morph real.`,
               'expressionManager expone:', vrm.expressionManager?.expressions?.map(e => e.expressionName) ?? []);
  } else {
    console.log(`[Lipsync] VÍA ACTIVA: directo (por nombre) — ${resueltos.length}/${VISEME_NAMES.length} visemes`);
  }

  diagnosticarExpressionBinds();
}

// Investigación (no toca el sistema de lipsync): para cada expresión de
// expressionManager, qué (malla, índice de morph) apunta realmente cada bind.
// Sirve para recuperar el mapeo real cuando morphTargetDictionary trae nombres
// genéricos (ej. "Bodybaked_NN") en vez de los vrc.* originales del glTF —
// los binds del VRM apuntan a (malla, índice) directo, sin pasar por el nombre.
function diagnosticarExpressionBinds() {
  if (!vrm?.expressionManager) return;
  const expresiones = vrm.expressionManager.expressions ?? [];
  console.log(`[Diag] expressionManager: ${expresiones.length} expresiones`);
  for (const expr of expresiones) {
    const binds = expr._binds ?? [];
    if (binds.length === 0) {
      console.log(`[Diag] expresión "${expr.expressionName}" — sin binds de morph target`);
      continue;
    }
    console.log(`[Diag] expresión "${expr.expressionName}" — ${binds.length} bind(s):`);
    for (const bind of binds) {
      const mallas = (bind.primitives ?? []).map(p => p.name || '<sin name>').join(', ');
      console.log(`    -> malla(s)=[${mallas}]  morph_index=${bind.index}  weight=${bind.weight}`);
    }
  }
}

// Escribe los visemes ACTIVOS de este frame (0, 1 o 2 — actual + siguiente
// durante el crossfade del timeline) resueltos vía _visemeSlots. Pone a 0
// primero TODOS los slots únicos (varios visemes canónicos pueden compartir
// el mismo morph real — ver el perfil "reducido" del modelo nuevo, donde
// dd/nn/ss/th/rr/ch comparten "ih") y después SUMA (no pisa) cada
// contribución activa, para que dos visemes que comparten morph se mezclen
// bien durante el crossfade en vez de que el segundo pise al primero.
// activos: [{nombre, peso}, ...] — nombre es un canónico de VISEME_NAMES.
function _escribirVisemes(activos) {
  for (const { mesh, idx } of _visemeSlotsUnicos) mesh.morphTargetInfluences[idx] = 0;
  for (const { nombre, peso } of activos) {
    const entradas = _visemeSlots[nombre];
    if (!entradas) continue;
    for (const { mesh, idx, peso: pesoConfig } of entradas) {
      mesh.morphTargetInfluences[idx] += peso * pesoConfig;
    }
  }
}

// Encola audio+timeline recibidos por WS; reproduce en orden, nunca solapa frases.
function encolarAudio(url, timeline) {
  _audioPlayQueue.push({ url, timeline });
  if (!_audioPlaying) _reproducirSiguienteDeCola();
}

function _reproducirSiguienteDeCola() {
  const siguiente = _audioPlayQueue.shift();
  if (!siguiente) { _audioPlaying = false; return; }
  _audioPlaying = true;

  _timeline    = siguiente.timeline || [];
  _timelineIdx = 0;
  _audioEl.src = siguiente.url;

  console.log('[Lipsync] llamando a play() para', siguiente.url);
  const promesa = _audioEl.play();
  if (promesa?.then) {
    promesa
      .then(() => console.log('[Lipsync] play() resuelto (promesa) para', siguiente.url))
      .catch(err => console.error('[Lipsync] play() rechazado para', siguiente.url,
        '- name:', err?.name, '| message:', err?.message));
  }
}

// Estado del viseme activo, calculado una vez por frame y reusado por las dos
// fases de abajo (pre/post vrm.update). null si no hay audio sonando.
let _estadoVisemeFrame = null;

function _calcularEstadoViseme() {
  if (!_audioActivo || _timeline.length === 0) return null;
  // audio.currentTime ya es la posición dentro del archivo actual — no hace
  // falta llevar un start time aparte como con Web Audio API. A 60fps sobra
  // de precisión para el lipsync.
  const t = _audioEl.currentTime;

  while (_timelineIdx < _timeline.length - 1 && _timeline[_timelineIdx + 1].t <= t) _timelineIdx++;

  const actual    = _timeline[_timelineIdx];
  const siguiente = _timeline[_timelineIdx + 1] ?? actual;

  let alpha = 0;
  if (siguiente !== actual) {
    const span = siguiente.t - actual.t;
    alpha = span > 0 ? clamp((t - actual.t) / span, 0, 1) : 1;
  }
  return { actual, siguiente, alpha };
}

// FASE 1 — ANTES de vrm.update(dt). Necesaria solo para la vía de fallback:
// expressionManager.update() (llamado dentro de vrm.update()) es lo que consume
// los pesos puestos por setValue() y escribe los morphs reales — si los
// seteamos después, vrm.update() ya pasó y no hacen efecto hasta el frame
// siguiente (mismo motivo por el que updateExpressions()/updateBlink() ya
// corrían antes de vrm.update(), más arriba en animate()).
function aplicarVisemesPreUpdate() {
  _estadoVisemeFrame = _calcularEstadoViseme();
  if (_viaLipsync !== 'expressionManager') return;

  const pesos = { aa: 0, ee: 0, ih: 0, oh: 0, ou: 0 };
  if (_estadoVisemeFrame) {
    const { actual, siguiente, alpha } = _estadoVisemeFrame;
    if (actual.viseme_vrm) pesos[actual.viseme_vrm] += actual.peso_vrm * (1 - alpha);
    if (siguiente !== actual && siguiente.viseme_vrm) pesos[siguiente.viseme_vrm] += siguiente.peso_vrm * alpha;
  }
  for (const key of VRM_VISEME_KEYS) trySetExpr(key, pesos[key]);
}

// FASE 2 — DESPUÉS de vrm.update(dt). Los morph targets vrc.* van acá porque
// expressionManager escribe cero en SUS morphs en cada update() (no toca los
// vrc.* directos, así que a esos sí hay que aplicarlos después). El jaw
// siempre va acá, en ambas vías, vía getRawBoneNode (hueso real, no el
// proxy normalizado — ver CLAUDE.md).
function aplicarVisemesPostUpdate(dt) {
  let objetivoApertura = 0;

  if (_viaLipsync !== 'expressionManager') {
    if (_estadoVisemeFrame) {
      const { actual, siguiente, alpha } = _estadoVisemeFrame;
      const activos = [{ nombre: actual.viseme, peso: 1 - alpha }];
      if (siguiente !== actual) activos.push({ nombre: siguiente.viseme, peso: alpha });
      _escribirVisemes(activos);
    } else {
      _escribirVisemes([]);
    }
  }

  if (_estadoVisemeFrame) objetivoApertura = _estadoVisemeFrame.actual.apertura ?? 0;

  _jawApertura = lerp(_jawApertura, objetivoApertura, dt * JAW_SMOOTH_SPEED);
  // Modelos sin hueso jaw (ver CONFIG.modelos / models/README.md): la
  // apertura de mandíbula simplemente no se anima por hueso — los visemes
  // (arriba) siguen moviendo la boca igual, jawB es la única fuente de esa
  // apertura extra y su ausencia no es un error.
  const jawB = vrm?.humanoid?.getRawBoneNode('jaw');
  if (jawB) jawB.rotation.x = _jawApertura * JAW_MAX_RAD;
}

// ═══════════════════════════════════════════════════
// SISTEMA DE MIRADA POR ESTADO
// ═══════════════════════════════════════════════════
const lookCur = { x: 0, y: 0 };
let lookDrift = { x: 0, y: 0 };
let lookChangeTimer = 2 + Math.random() * 3;

function updateLook(dt, t) {
  lookChangeTimer -= dt;
  if (lookChangeTimer <= 0 && (estado === 'idle' || estado === 'happy' || estado === 'sad')) {
    lookDrift.x = (Math.random() - 0.5) * 0.22;
    lookDrift.y = (Math.random() - 0.5) * 0.10;
    lookChangeTimer = 2.5 + Math.random() * 3.5;
  }

  let tgtX, tgtY, lerpSpd;
  switch (estado) {
    case 'thinking':
      tgtX = -0.18; tgtY = 0.12; lerpSpd = 1.2; // arriba-izquierda
      break;
    case 'talking':
      tgtX = Math.sin(t * 0.12) * 0.04; tgtY = Math.sin(t * 0.09) * 0.03; lerpSpd = 2.5;
      break;
    default:
      tgtX = lookDrift.x; tgtY = lookDrift.y; lerpSpd = 1.3;
  }
  lookCur.x = lerp(lookCur.x, tgtX, dt * lerpSpd);
  lookCur.y = lerp(lookCur.y, tgtY, dt * lerpSpd);
}

// ═══════════════════════════════════════════════════
// SISTEMA DE SPRINGS (AMORTIGUADORES)
// ═══════════════════════════════════════════════════
class Spring {
  constructor(init = 0, k = 20, d = 6) { this.v = init; this.vel = 0; this.k = k; this.d = d; }
  step(target, dt) {
    const f = -this.k * (this.v - target) - this.d * this.vel;
    this.vel += f * dt; this.v += this.vel * dt; return this.v;
  }
  tune(k, d) { this.k = k; this.d = d; }
}

const spr = {
  hX: new Spring(0,    18, 5.5),
  hY: new Spring(0,    18, 5.5),
  hZ: new Spring(-0.04,18, 5.5),
  bZ: new Spring(0,    14, 4.5),
  bX: new Spring(0,    12, 4.0),
  ruZ: new Spring(-1.28, 22, 7.0),
  luZ: new Spring( 1.28, 22, 7.0),
  ruX: new Spring(0.05,  16, 5.0),
  luX: new Spring(0.05,  16, 5.0),
  // Antebrazos (flexión de codo) — un poco más blandas que ruX/luX a
  // propósito: el antebrazo "va detrás" del hombro, un retardo sobre otro
  // retardo (ver "BRAZOS ACOPLADOS AL CUERPO" en animate()).
  rlX: new Spring(-0.30, 14, 5.5),
  llX: new Spring(-0.30, 14, 5.5),
};

// Perfiles de stiffness/damping por estado
const SPRING_CFG = {
  idle:      [18, 5.5, 14, 4.5],
  talking:   [20, 5.0, 16, 4.0],
  thinking:  [14, 6.0, 10, 5.0],
  happy:     [22, 4.5, 18, 3.5],
  sad:       [10, 7.0,  8, 6.0],
  angry:     [26, 3.0, 22, 2.8], // menos damping = más brusco
  surprised: [30, 4.0, 25, 3.5],
};

function applySpringConfig() {
  const [hk, hd, bk, bd] = SPRING_CFG[estado] ?? SPRING_CFG.idle;
  spr.hX.tune(hk, hd); spr.hY.tune(hk, hd); spr.hZ.tune(hk, hd);
  spr.bZ.tune(bk, bd); spr.bX.tune(bk, bd);
}

// ═══════════════════════════════════════════════════
// POSE PROCEDURAL POR ESTADO
// ═══════════════════════════════════════════════════
let surprisedSnap = 0;

// Canales hX/hY/hZ/bZ/ruZ/luZ/ruX/luX: ruido Perlin, no senos (ver más abajo,
// "RUIDO PERLIN 1D" — un producto de senos sigue siendo periódico, aunque no
// lo parezca a simple vista; el ruido no lo es). bX (respiración) sigue con
// un seno limpio a propósito: la respiración real SÍ es rítmica, eso no es
// lo que hacía ver a Rem como un robot.
function getStatePose(t) {
  // Velocidades de animación por estado
  const SPEEDS = { idle:1.0, talking:1.8, thinking:0.5, happy:1.5, sad:0.4, angry:1.3, surprised:2.0 };
  const sp = SPEEDS[estado] ?? 1.0;
  const ts = t * sp; // tiempo escalado por emoción

  // Respiración siempre presente
  const breath = Math.sin(ts * 0.8 / sp) * 0.018;

  switch (estado) {

    case 'idle': {
      const S = CONFIG.brazos;
      // _idleAmpMult (>1) amplifica el ruido cuando hay clip de pose base de
      // idle activo — el clip fija la pose, el ruido rompe la periodicidad del
      // bucle. Vale 1 en procedural puro (ver actualizarAnimacionClips).
      const A = _idleAmpMult;
      return {
        hX: ruido(10, 0.15, ts) * 0.028 * A,
        hY: ruido(20, 0.12, ts) * 0.020 * A,
        hZ: -0.04 + ruido(30, 0.13, ts) * 0.016 * A,
        bZ: ruido(40, 0.10, ts) * 0.009 * A,
        bX: breath,
        ruZ: -S.separacion + ruido(50, 0.07, ts) * 0.02 * A,
        luZ:  S.separacion + ruido(51, 0.07, ts) * 0.02 * A,
        ruX:  S.balanceoDelante + ruido(60, 0.08, ts) * 0.02 * A,
        luX:  S.balanceoDelante + ruido(61, 0.08, ts) * 0.02 * A,
      };
    }

    case 'talking': {
      // Gesticulación con ruido, no senos: cada brazo con su propia fase y
      // amplitud generosa, para que se lea como alguien hablando con las
      // manos, no como un metrónomo. gestoAmp combina dos señales (ver
      // "BRAZOS ACOPLADOS AL CUERPO" más abajo para _hablaEnergia): un
      // envolvente de ruido lento (Math.max(0,...) pasa ~la mitad del
      // tiempo en 0 — eso es lo que crea pausas de verdad, no solo menos
      // amplitud) más la energía real del habla (apertura de mandíbula
      // suavizada). Con gestoAmp≈0 los brazos vuelven al mismo reposo que
      // en idle — "gestos que van y vuelven", no oscilación continua.
      const S = CONFIG.brazos;
      const envolvente = Math.max(0, ruido(200, 0.18, ts));
      const gestoAmp = clamp(envolvente * S.gestoRuidoAmp + _hablaEnergia * S.gestoHablaAmp, 0, 1);
      return {
        hX: ruido(10, 0.55, ts) * 0.09,
        hY: ruido(20, 0.48, ts) * 0.12,
        hZ: ruido(30, 0.60, ts) * 0.13,
        bZ: ruido(40, 0.65, ts) * 0.024,
        bX: breath,
        ruZ: -S.separacion + ruido(50, 0.30, ts) * 0.10 * gestoAmp,
        luZ:  S.separacion + ruido(51, 0.35, ts) * 0.16 * gestoAmp,
        ruX:  S.balanceoDelante + ruido(60, 0.40, ts) * 0.14 * gestoAmp,
        luX:  S.balanceoDelante + ruido(61, 0.45, ts) * 0.20 * gestoAmp,
      };
    }

    case 'thinking': {
      // Pose distinta y reconocible a propósito: mirada arriba a un lado
      // (ver también updateLook()/updateSaccades()), mano derecha elevada
      // hacia la cara (upperArm MÁS levantado que antes + codo MÁS
      // flexionado que la base universal, rlX propio en vez del genérico
      // de CONFIG.brazos.codoFlexionBase — ver animate()), movimiento más
      // lento que cualquier otro estado.
      const S = CONFIG.brazos;
      return {
        hX:  0.18 + ruido(10, 0.045, ts) * 0.016,
        hY:  0.15 + ruido(20, 0.040, ts) * 0.012,
        hZ: -0.22 + ruido(30, 0.050, ts) * 0.012,
        bZ: ruido(40, 0.045, ts) * 0.005,
        bX: breath * 0.7,
        ruZ: -0.85 + ruido(50, 0.03, ts) * 0.02, // brazo derecho bien elevado, hacia la cara
        luZ: S.separacion,
        ruX:  0.35 + ruido(60, 0.035, ts) * 0.02, // codo adelantado, no solo el hombro
        luX: S.balanceoDelante,
        rlX: -0.95 + ruido(65, 0.03, ts) * 0.03,  // codo bien flexionado — la mano llega a la cara
      };
    }

    case 'happy': {
      const bob = ruido(5, 1.1, ts) * 0.018; // pequeño rebote de cabeza
      return {
        hX: bob + ruido(10, 0.5, ts) * 0.03,
        hY: ruido(20, 0.6, ts) * 0.045,
        hZ: ruido(30, 0.7, ts) * 0.055,
        bZ: ruido(40, 0.7, ts) * 0.02,
        bX: breath * 1.2,
        ruZ: -1.15 + ruido(50, 0.3, ts) * 0.03, luZ: 1.15 + ruido(51, 0.3, ts) * 0.03,
        ruX:  0.09 + ruido(60, 0.3, ts) * 0.02, luX: 0.09 + ruido(61, 0.3, ts) * 0.02,
      };
    }

    case 'sad':
      return {
        hX:  0.25 + ruido(10, 0.06, ts) * 0.012, // cabeza caída
        hY:  ruido(20, 0.05, ts) * 0.008,
        hZ:  0.05 + ruido(30, 0.05, ts) * 0.006,
        bZ:  ruido(40, 0.05, ts) * 0.004,
        bX:  0.05 + breath * 0.5, // spine ligeramente inclinada
        ruZ: -1.30, luZ: 1.30,
        ruX: 0.02, luX: 0.02,
      };

    case 'angry': {
      // Ruido a frecuencia alta en vez de sign(sin())*sin(): igual de
      // brusco/entrecortado a la vista, pero no forma un patrón que se
      // repita exacto — antes SÍ era periódico, solo que con un período
      // largo que lo disimulaba a corto plazo.
      return {
        hX: 0.06 + ruido(10, 1.5, ts) * 0.02,
        hY: ruido(20, 3.5, ts) * 0.014,
        hZ: ruido(30, 4.0, ts) * 0.020,
        bZ: ruido(40, 0.6, ts) * 0.018,
        bX: 0.02,
        ruZ: -1.24, luZ: 1.24,
        ruX: 0.08, luX: 0.08,
      };
    }

    case 'surprised': {
      const snap = clamp(surprisedSnap, 0, 1);
      return {
        hX: -0.20 * snap + ruido(10, 0.12, ts) * 0.018 * (1 - snap),
        hY:  ruido(20, 0.09, ts) * 0.015,
        hZ:  ruido(30, 0.15, ts) * 0.010,
        bZ: -0.04 * snap,
        bX: -0.03 * snap + breath,
        ruZ: -1.28 - 0.12 * snap,
        luZ:  1.28 + 0.12 * snap,
        ruX: 0.12, luX: 0.12,
      };
    }

    default:
      return { hX:0, hY:0, hZ:-0.04, bZ:0, bX:0,
               ruZ:-CONFIG.brazos.separacion, luZ:CONFIG.brazos.separacion,
               ruX:CONFIG.brazos.balanceoDelante, luX:CONFIG.brazos.balanceoDelante };
  }
}

// ═══════════════════════════════════════════════════
// RUIDO PERLIN 1D — reemplaza los Math.sin() de getStatePose()
// ═══════════════════════════════════════════════════
// El ojo detecta la periodicidad de sumas/productos de senos en pocos
// segundos (se lee como robot, no como alguien vivo) por más frecuencias
// que se combinen — siguen siendo, técnicamente, funciones periódicas. El
// ruido Perlin no lo es: es la misma técnica que "flow noise" para
// animación procedural de idle en personajes 3D. Implementación chica,
// clásica (Ken Perlin, tabla de permutación de 256 valores), sin
// dependencias externas — 1D alcanza: cada canal (cabeza X, cabeza Y, brazo
// derecho...) es noise1D(t * frecuencia + fase), con una fase fija propia
// por canal para que no se muevan todos en sincronía.
const _PERLIN_PERM = (() => {
  const p = new Uint8Array(256);
  for (let i = 0; i < 256; i++) p[i] = i;
  // Barajado con un PRNG determinístico (LCG) — no importa cuál en
  // particular, solo que la permutación sea siempre la misma entre cargas
  // de la página (si no, cada recarga tendría una "personalidad" de ruido
  // distinta, sin que eso aporte nada).
  let seed = 1337;
  const rand = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  for (let i = 255; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    const tmp = p[i]; p[i] = p[j]; p[j] = tmp;
  }
  const perm = new Uint8Array(512);
  for (let i = 0; i < 512; i++) perm[i] = p[i & 255];
  return perm;
})();

const _fade = t => t * t * t * (t * (t * 6 - 15) + 10);
const _gradiente1D = (hash, x) => ((hash & 1) === 0 ? x : -x);

// Devuelve un valor suave en, aproximadamente, [-1, 1].
function noise1D(x) {
  const xi = Math.floor(x) & 255;
  const xf = x - Math.floor(x);
  const u  = _fade(xf);
  const a  = _PERLIN_PERM[xi], b = _PERLIN_PERM[xi + 1];
  return lerp(_gradiente1D(a, xf), _gradiente1D(b, xf - 1), u);
}

// Un canal de ruido con su propia fase (frecuencia baja = movimiento lento).
const ruido = (fase, freq, t) => noise1D(t * freq + fase);

// ═══════════════════════════════════════════════════
// TRASLADO DE PESO — cadera lenta de un pie a otro, sin caminar
// ═══════════════════════════════════════════════════
// Reemplaza el bob/rock de la caminata eliminada: Rem se queda fija en su
// sitio (sin desplazamiento en X), pero una cadera muerta se ve tan
// artificial como una cabeza inmóvil. Frecuencia muy baja (periodo ~20s) a
// propósito — un traslado de peso real es lento y ocasional, no un tic.
// Devuelve {rock} además de mutar hips/spine — hombros y brazos lo reusan
// para "acompañar" el traslado de peso (ver BRAZOS ACOPLADOS AL CUERPO en
// animate()), en vez de tener su propia señal de ruido desconectada.
function updateTrasladoPeso(dt, t) {
  const rock = ruido(500, 0.05, t) * 0.035;
  const lean = ruido(510, 0.05, t) * 0.012; // leve inclinación de vuelta, para el balance
  const hipB = getB('hips');
  if (hipB) { hipB.rotation.z = rock; hipB.rotation.x = ruido(520, 0.04, t) * 0.01; }
  const spineB = getB('spine');
  if (spineB) spineB.rotation.z += -rock * 0.35 + lean;
  return { rock };
}

// ═══════════════════════════════════════════════════
// MIRADA A CÁMARA + MICRO-SACCADES — ojos, vía vrm.lookAt (huesos leftEye/rightEye)
// ═══════════════════════════════════════════════════
// Antes las saccades eran TODO el control de los ojos: saltos aleatorios
// alrededor de un centro fijo (0,0) en grados, sin relación con dónde está
// el usuario. Ahora hay una base real (_miradaBase(), justo abajo) — sigue
// a la cámara de verdad vía vrm.lookAt.lookAt(posición de la cámara), el
// mismo método que usaría el auto-tracking de three-vrm si target/autoUpdate
// estuvieran en el modo automático (ver el callback de carga del VRM, más
// arriba: se dejan target=camera + autoUpdate=false a propósito, así este
// código controla CUÁNDO se recalcula y puede sumarle encima saccades y
// apartar-la-mirada antes de que vrm.update() aplique el resultado a los
// huesos). Las saccades (rápidas, 20-40ms) y el apartar-la-mirada (más
// lento, con sostén) son DESVIACIONES sobre esa base, no un centro fijo —
// updateSaccades() sigue siendo el punto de entrada llamado desde animate().
let _saccadeYaw = 0, _saccadePitch = 0;                 // desvío actual (relativo a la base), no un ángulo absoluto
let _saccadeYawIni = 0, _saccadePitchIni = 0;           // punto de partida del salto en curso
let _saccadeYawObjetivo = 0, _saccadePitchObjetivo = 0; // punto de llegada del salto en curso
let _saccadeT = 1, _saccadeDur = 0.03;                  // progreso 0..1 del salto actual, y su duración
let _saccadeTimer = 0.5 + Math.random() * 1.5;

// Versión con retardo de la mirada final (base + saccade), para que la
// cabeza/cuello la sigan detrás de los ojos — ver "cabeza acompaña a la
// mirada" más abajo (usado en animate(), no acá).
let _cabezaMiradaYaw = 0, _cabezaMiradaPitch = 0;

let _miradaLogTimer = 2; // diagnóstico: cada cuántos segundos se loguea el yaw/pitch pedido

const _miradaCamPos = new THREE.Vector3(); // reusado cada frame, evita basura de GC

let _miradaFase = 'siguiendo';  // 'siguiendo' | 'apartando'
let _miradaTimer = CONFIG.mirada.apartarIntervaloMinS
                  + Math.random() * (CONFIG.mirada.apartarIntervaloMaxS - CONFIG.mirada.apartarIntervaloMinS);
let _miradaT = 0;
let _miradaOffsetYaw = 0, _miradaOffsetPitch = 0;

// Envolvente de "apartar la mirada": entra (fade), se sostiene plana, sale
// (fade) — no es un pulso simétrico tipo seno (necesita el sostén en el
// medio), así que se arma a mano con _fade() en los dos tramos.
function _envolventeApartar(p) {
  const M = CONFIG.mirada;
  const dur = M.apartarEntradaS + M.apartarSostenS + M.apartarSalidaS;
  const fEntrada = M.apartarEntradaS / dur, fSalida = M.apartarSalidaS / dur;
  if (p < fEntrada) return _fade(p / fEntrada);
  if (p > 1 - fSalida) return _fade((1 - p) / fSalida);
  return 1;
}

// Base de la mirada (antes de sumarle las saccades): sigue a la cámara con
// vrm.lookAt.lookAt(), salvo en 'thinking' (mismo punto fijo arriba-a-un-
// lado de siempre — Rem está pensando, no mirando al usuario, y las
// saccades de esa pose ya orbitaban ese punto). "Apartar la mirada" se
// superpone encima del seguimiento normal, nunca durante 'thinking' (que ya
// tiene su propio desvío). Devuelve {yaw, pitch} en grados.
function _miradaBase(dt) {
  const M = CONFIG.mirada;

  if (estado === 'thinking') return { yaw: -10, pitch: 8 };

  let yaw = 0, pitch = 0;
  if (vrm?.lookAt) {
    vrm.lookAt.lookAt(camera.getWorldPosition(_miradaCamPos));
    yaw   = vrm.lookAt.yaw   * M.intensidadSeguimiento;
    pitch = vrm.lookAt.pitch * M.intensidadSeguimiento;
  }

  _miradaTimer -= dt;
  if (_miradaFase === 'siguiendo' && _miradaTimer <= 0) {
    _miradaFase = 'apartando';
    _miradaT = 0;
    const angulo = Math.random() * Math.PI * 2; // dirección al azar, no siempre "hacia el mismo lado"
    _miradaOffsetYaw   = Math.cos(angulo) * M.apartarAmpYaw;
    _miradaOffsetPitch = Math.sin(angulo) * M.apartarAmpPitch;
    console.log(`[Mirada] apartando (yaw=${_miradaOffsetYaw.toFixed(1)}, pitch=${_miradaOffsetPitch.toFixed(1)})`);
  }
  if (_miradaFase === 'apartando') {
    const dur = M.apartarEntradaS + M.apartarSostenS + M.apartarSalidaS;
    _miradaT += dt;
    const p = Math.min(1, _miradaT / dur);
    const env = _envolventeApartar(p);
    yaw   += _miradaOffsetYaw   * env;
    pitch += _miradaOffsetPitch * env;
    if (p >= 1) {
      _miradaFase = 'siguiendo';
      _miradaTimer = M.apartarIntervaloMinS + Math.random() * (M.apartarIntervaloMaxS - M.apartarIntervaloMinS);
      console.log(`[Mirada] de vuelta a cámara, próximo apartado en ~${_miradaTimer.toFixed(1)}s`);
    }
  }

  return { yaw, pitch };
}

function updateSaccades(dt) {
  const { yaw: yawBase, pitch: pitchBase } = _miradaBase(dt);

  _saccadeTimer -= dt;
  if (_saccadeTimer <= 0) {
    _saccadeYawIni = _saccadeYaw;
    _saccadePitchIni = _saccadePitch;
    // Relativo a la base (ya no a un centro fijo): un salto pequeño desde
    // donde sea que esté mirando en este momento (cámara, o apartada).
    _saccadeYawObjetivo   = (Math.random() - 0.5) * 14;
    _saccadePitchObjetivo = (Math.random() - 0.5) * 8;
    _saccadeDur   = 0.02 + Math.random() * 0.02;  // 20-40ms, como pide la especificación
    _saccadeT     = 0;
    _saccadeTimer = 0.5 + Math.random() * 1.5;    // próxima saccade en 0,5-2s
  }
  if (_saccadeT < 1) {
    _saccadeT = Math.min(1, _saccadeT + dt / _saccadeDur);
    const u = _fade(_saccadeT); // mismo suavizado que el ruido — un salto, no un tirón lineal
    _saccadeYaw   = lerp(_saccadeYawIni,   _saccadeYawObjetivo,   u);
    _saccadePitch = lerp(_saccadePitchIni, _saccadePitchObjetivo, u);
  }

  // Se escribe SIEMPRE, no solo mientras hay un salto en curso: a diferencia
  // de la versión vieja (centro fijo, no hacía falta reescribir entre
  // saltos), la base ahora se mueve todo el tiempo (sigue a la cámara/la
  // cabeza) y hay que reaplicarla cada frame o los ojos se quedan pegados al
  // último valor hasta la próxima saccade.
  const yawFinal = yawBase + _saccadeYaw;
  const pitchFinal = pitchBase + _saccadePitch;
  if (vrm?.lookAt) {
    vrm.lookAt.yaw   = yawFinal;
    vrm.lookAt.pitch = pitchFinal;
  }

  // La cabeza (y el cuello, ver animate()) siguen una fracción de ESTA
  // MISMA mirada final (base de cámara + saccade + apartar, ya combinados
  // arriba) — pero con un retardo propio: un lerp más lento que la
  // respuesta instantánea de los ojos (que ya se escribieron sin demora,
  // arriba), así que la cabeza "llega después". CONFIG.mirada.cabezaVelocidad
