# Configuración no sensible de Rem (los secretos van en .env, no acá).

[llm]
# Proveedor activo. Override: variable de entorno REM_LLM_PROVIDER.
# Valores: "ollama" (local, por defecto) | "claude" (API de Anthropic)
provider = "ollama"


[llm.ollama]
# Proveedor por defecto. Corre local, sin API key ni coste.
#
# keep_alive mantiene el modelo en VRAM entre turnos:
#   primer turno en frío ~4,2s | turnos siguientes ~0,2-0,3s
# Con keep_alive = 0 se descarga tras cada respuesta y cada turno paga los ~4s.
base_url   = "http://127.0.0.1:11434"
model      = "hf.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive:Q4_K_M"
keep_alive = "10m"

# Sampling recomendado por el autor del modelo para modo NO-thinking.
# El thinking está desactivado en el código (think: false), no acá:
# con thinking activo genera cientos de tokens de razonamiento antes de
# responder, lo que hace inviable un asistente hablado.
temperature = 0.7
top_p       = 0.8
top_k       = 20
min_p       = 0.0
num_ctx     = 4096

# Capas offloadeadas a GPU. 99 = todo: las 32 capas, la de salida y el
# proyector de visión (clip, 333M parámetros), que Ollama solo sube a GPU
# cuando caben todas las capas. La voz (Piper) y el STT van en CPU: la GPU es
# toda del LLM. Medido con la ventana abierta (RTX 3050 4 GB, con corriente,
# GPU P0, 3 turnos cada uno, prompt real de ~1270 tok):
#
#   num_gpu | pico VRAM | tok/s     | ollama ps
#   --------|-----------|-----------|----------------------------------------
#   99 (33) | 3572 MiB  | 50,6-52,4 | 100% GPU                <- valor actual
#   32      | 2864 MiB  | 42,5-45,6 | 11%/89% (1 capa + visión en CPU)
#   30      | 2724 MiB  | ~35,6     |
#   28      | 2584 MiB  | 27,8-31,4 |
#   24      | 2326 MiB  | ~26       |
#
# Con 99 quedan ~520 MiB libres: no hubo OOM ni errores 500, pero subir
# num_ctx o pasar a un cuantizado más grande (Q5_K_M/Q6_K) ya no entra sin
# quitar el proyector de visión (Yoru no usa imágenes; serían ~600 MiB).
# En batería la GPU baja a P5 y los tok/s caen ~3x (ver CLAUDE.md).
num_gpu = 99


[llm.claude]
# API de Anthropic. Requiere ANTHROPIC_API_KEY en .env y saldo de API
# (la suscripción Pro de claude.ai NO incluye créditos de API).
#
# Sonnet 5 (familia intermedia): para un asistente conversacional de
# escritorio la latencia importa más que la capacidad máxima, y cada turno
# reenvía el system prompt completo (cacheado). Los modelos tope son caros
# y lentos para esto; Haiku 4.5 es la alternativa más barata y rápida, a
# costa de fidelidad de personaje.
model      = "claude-sonnet-5"
max_tokens = 1024


[tts]
# Voz de salida: Piper, 100% local y en CPU (rem_chat.py y bench_chat.py).
# Ruta relativa a la raíz del proyecto; la config del modelo va al lado con el
# mismo nombre + ".json" (de ahí sale el sample rate). Los parámetros de
# síntesis (noise_scale, noise_w, length_scale) son los del .onnx.json tal
# cual. Pon tu propio modelo Piper (.onnx + .onnx.json) en esta ruta; los
# modelos de voz no se versionan (ver .gitignore).
modelo = "models/piper/model.onnx"


[avatar]
# Modelo VRM con el que arranca el avatar — ruta relativa a la raíz del
# proyecto. Los VRM viven en models/vrm/ y son SOLO locales (no van a git:
# .gitignore + hooks/). Se cambia en caliente desde la ventana (botón "Modelo" del
# chat o /modelo) y desde el panel de control; esa elección se guarda en
# preferencias.json y pisa este valor. rem_avatar.html autodetecta lo que
# necesita de cada modelo (VRM 0.x/1.0, lipsync, expresiones): para agregar
# uno nuevo basta con dejar el .vrm en models/vrm/. Créditos y licencias en
# models/README.md.
modelo = "models/vrm/neru.vrm"


[app]
# Cómo se presenta Rem. Override: rem_chat.py --modo ventana|overlay.
#   "ventana" → ventana GTK normal con avatar + panel de chat (el de siempre).
#   "overlay" → layer surface transparente en una esquina (ver [overlay]).
# Nunca los dos a la vez: es un solo proceso con un solo modo, y un segundo
# rem_chat.py aborta con un error claro si ya hay uno corriendo.
modo = "ventana"


[overlay]
# Superficie del modo overlay (rem_chat.py --modo overlay), anclada
# IZQUIERDA + ABAJO. Transparente y click-through en todo salvo la caja de
# texto (su rectángulo lo mide rem_avatar.html y se lo manda a GTK).
ancho = 420
alto  = 600
# Separación respecto de los bordes de la pantalla, en px.
margen_izquierdo = 0
margen_inferior  = 0
# "top" queda sobre las ventanas normales y bajo las fullscreen; "overlay"
# queda sobre todo, fullscreen incluidas.
capa = "top"
# 0 = respeta la zona exclusiva de otros paneles (Rem se apoya sobre la barra);
# -1 = ignora los paneles y se solapa con ellos.
zona_exclusiva = 0


[stt]
# Voz de entrada (push-to-talk). Override: variable REM_STT_PROVIDER.
# "local" → faster-whisper en CPU (el único implementado).
provider = "local"
# Tope de una grabación, por si se pierde el ptt_stop (tecla soltada fuera
# de foco, proceso muerto...). Al vencer se corta y se procesa lo grabado.
max_grabacion_s = 30
# Grabaciones más cortas que esto se descartan (un toque accidental de la tecla).
min_grabacion_s = 0.4
# Cuánto se muestra lo transcrito en la caja de texto ANTES de mandárselo al
# LLM, para ver qué entendió.
mostrar_transcripcion_s = 1.0
# Margen tras el último audio de Rem antes de aceptar otro ptt_start (cola de
# reproducción/eco de sala).
espera_tras_habla_s = 0.5
# Micrófono: "" = el predeterminado del sistema (PipeWire). Índice o nombre de
# sounddevice (p. ej. "pulse"). Override: variable REM_MIC_DEVICE.
dispositivo_entrada = ""


[stt.local]
# faster-whisper. EN CPU a propósito: la VRAM (4 GB) es para Ollama (ver
# [llm.ollama].num_gpu), no se toca la GPU.
model        = "small"
compute_type = "int8"
device       = "cpu"
language     = "es"
# 1 = decodificación voraz (la más rápida); subir mejora algo la precisión
# a costa de latencia. Medido en CLAUDE.md, "Voz de entrada".
beam_size    = 1
# 0 = que decida ctranslate2.
cpu_threads  = 0
# Sesga el vocabulario hacia los nombres propios/técnicos que Rem oye seguido.
initial_prompt = "Conversación con Rem, una asistente virtual. Vocabulario: Rem, Esteban, Ollama, Claude, Anthropic, Hyprland, Arch Linux, Python, PipeWire, GTK, WebKit, Whisper, Piper, VRM."


[contexto]
# Contexto que rem_chat (ventana y overlay) antepone al mensaje del usuario:
# solo la línea de fecha/hora, según su modo:
#   "condicional" → solo si el mensaje contiene alguna de palabras_fecha
#   "siempre"     → en cada turno
#   "nunca"       → nunca
# Con la FECHA siempre puesta, ~2 de 23 respuestas a "Hola, Rem." la leyeron en
# voz alta sin que nadie la pidiera — por eso es condicional (ver CLAUDE.md).
# El estado de la PC ya NO va acá: con la línea de PC inyectada, 6 de 6 "Hola"
# comentaban el disco. Ahora es la herramienta de solo lectura estado_pc
# (acciones.py), que el modelo llama solo si le preguntan por la PC.
linea_fecha = "condicional"
# Coincidencia por PALABRA COMPLETA (o frase), sin distinguir mayúsculas ni
# tildes. Incluye variantes con y sin tilde por lo que pueda devolver el STT.
palabras_fecha = [
    "hora", "fecha", "día", "dia", "hoy", "mañana", "ayer", "semana", "mes", "año",
    "anoche", "madrugada", "tarde", "noche",
]
