# Configuración no sensible de Rem (los secretos van en .env, no acá).

[llm]
# Proveedor activo. Override: variable de entorno REM_LLM_PROVIDER.
# Valores: "ollama" (local, por defecto) | "claude" (API de Anthropic)
provider = "ollama"


[llm.ollama]
# Proveedor por defecto. Corre local, sin API key ni coste.
#
# keep_alive mantiene el modelo en VRAM entre turnos:
#   primer turno en frío ~4,2s | turnos siguientes ~0,2-0,3s
# Con keep_alive = 0 se descarga tras cada respuesta y cada turno paga los ~4s.
base_url   = "http://127.0.0.1:11434"
model      = "hf.co/HauhauCS/Qwen3.5-4B-Uncensored-HauhauCS-Aggressive:Q4_K_M"
keep_alive = "10m"

# Sampling recomendado por el autor del modelo para modo NO-thinking.
# El thinking está desactivado en el código (think: false), no acá:
# con thinking activo genera cientos de tokens de razonamiento antes de
# responder, lo que hace inviable un asistente hablado.
temperature = 0.7
top_p       = 0.8
top_k       = 20
min_p       = 0.0
num_ctx     = 4096

# Capas offloadeadas a GPU. 99 = todo: las 32 capas, la de salida y el
# proyector de visión (clip, 333M parámetros), que Ollama solo sube a GPU
# cuando caben todas las capas. La voz (Piper) y el STT van en CPU: la GPU es
# toda del LLM. Medido con la ventana abierta (RTX 3050 4 GB, con corriente,
# GPU P0, 3 turnos cada uno, prompt real de ~1270 tok):
#
#   num_gpu | pico VRAM | tok/s     | ollama ps
#   --------|-----------|-----------|----------------------------------------
#   99 (33) | 3572 MiB  | 50,6-52,4 | 100% GPU                <- valor actual
#   32      | 2864 MiB  | 42,5-45,6 | 11%/89% (1 capa + visión en CPU)
#   30      | 2724 MiB  | ~35,6     |
#   28      | 2584 MiB  | 27,8-31,4 |
#   24      | 2326 MiB  | ~26       |
#
# Con 99 quedan ~520 MiB libres: no hubo OOM ni errores 500, pero subir
# num_ctx o pasar a un cuantizado más grande (Q5_K_M/Q6_K) ya no entra sin
# quitar el proyector de visión (Yoru no usa imágenes; serían ~600 MiB).
# En batería la GPU baja a P5 y los tok/s caen ~3x (ver CLAUDE.md).
num_gpu = 99


[llm.claude]
# API de Anthropic. Requiere ANTHROPIC_API_KEY en .env y saldo de API
# (la suscripción Pro de claude.ai NO incluye créditos de API).
#
# Sonnet 5 (familia intermedia): para un asistente conversacional de
# escritorio la latencia importa más que la capacidad máxima, y cada turno
# reenvía el system prompt completo (cacheado). Los modelos tope son caros
# y lentos para esto; Haiku 4.5 es la alternativa más barata y rápida, a
# costa de fidelidad de personaje.
model      = "claude-sonnet-5"
max_tokens = 1024


[tts]
# Voz de salida: Piper, 100% local y en CPU (rem_chat.py y bench_chat.py).
# Ruta relativa a la raíz del proyecto; la config del modelo va al lado con el
# mismo nombre + ".json" (de ahí sale el sample rate). Los parámetros de
# síntesis (noise_scale, noise_w, length_scale) son los del .onnx.json tal
# cual. Pon tu propio modelo Piper (.onnx + .onnx.json) en esta ruta; los
# modelos de voz no se versionan (ver .gitignore).
modelo = "models/piper/model.onnx"


[avatar]
# Modelo VRM con el que arranca el avatar — ruta relativa a la raíz del
# proyecto. Los VRM viven en models/vrm/ y son SOLO locales (no van a git:
# .gitignore + hooks/). Se cambia en caliente desde la ventana (botón "Modelo" del
# chat o /modelo) y desde el panel de control; esa elección se guarda en
# preferencias.json y pisa este valor. rem_avatar.html autodetecta lo que
# necesita de cada modelo (VRM 0.x/1.0, lipsync, expresiones): para agregar
# uno nuevo basta con dejar el .vrm en models/vrm/. Créditos y licencias en
# models/README.md.
modelo = "models/vrm/neru.vrm"


[app]
# Cómo se presenta Rem. Override: rem_chat.py --modo ventana|overlay.
#   "ventana" → ventana GTK normal con avatar + panel de chat (el de siempre).
#   "overlay" → layer surface transparente en una esquina (ver [overlay]).
#   "escritorio" → avatar de cuerpo entero que se arrastra por el escritorio,
#                  con el chat en una ventana aparte (ver [escritorio]).
# Nunca los dos a la vez: es un solo proceso con un solo modo, y un segundo
# rem_chat.py aborta con un error claro si ya hay uno corriendo.
modo = "ventana"


[overlay]
# Superficie del modo overlay (rem_chat.py --modo overlay), anclada
# IZQUIERDA + ABAJO. Transparente y click-through en todo salvo la caja de
# texto (su rectángulo lo mide rem_avatar.html y se lo manda a GTK).
ancho = 420
alto  = 600
# Separación respecto de los bordes de la pantalla, en px.
margen_izquierdo = 0
margen_inferior  = 0
# "top" queda sobre las ventanas normales y bajo las fullscreen; "overlay"
# queda sobre todo, fullscreen incluidas.
capa = "top"
# 0 = respeta la zona exclusiva de otros paneles (Rem se apoya sobre la barra);
# -1 = ignora los paneles y se solapa con ellos.
zona_exclusiva = 0


[apariencia]
# Tema de la ventana de chat, el menú y los botones del avatar y el panel:
# "synthwave" (cian y violeta), "cristal" (gris translúcido) o "yoru" (negro y morado).
# El panel de control lo pisa (pestaña Apariencia).
tema = "synthwave"


[escritorio]
# Avatar de escritorio (rem_chat.py --modo escritorio): layer surface
# transparente, click-through salvo el cuerpo del modelo, que se arrastra con
# el ratón (solo en Hyprland: la posición sale de `hyprctl cursorpos`). La
# última posición se guarda en escritorio_estado.json y se recupera al abrir;
# estos márgenes son solo los de la primera vez.
ancho = 380
alto  = 620
margen_izquierdo = 40
margen_inferior  = 0
# "top": sobre las ventanas normales; "overlay": sobre todo (fullscreen
# incluidas); "bottom": bajo las ventanas, sobre el fondo de pantalla.
capa = "top"
zona_exclusiva = 0
# Ventana de chat aparte (botón 💬, menú del clic derecho).
chat_ancho = 440
chat_alto  = 640


[stt]
# Voz de entrada (push-to-talk). Override: variable REM_STT_PROVIDER.
# "local" → faster-whisper en CPU (el único implementado).
provider = "local"
# Tope de una grabación, por si se pierde el ptt_stop (tecla soltada fuera
# de foco, proceso muerto...). Al vencer se corta y se procesa lo grabado.
max_grabacion_s = 30
# Grabaciones más cortas que esto se descartan (un toque accidental de la tecla).
min_grabacion_s = 0.4
# Cuánto enseña la interfaz lo transcrito (caja del overlay, burbuja del
# escritorio), para ver qué entendió. No retrasa el envío al LLM.
mostrar_transcripcion_s = 1.0
# Margen tras el último audio de Rem antes de aceptar otro ptt_start (cola de
# reproducción/eco de sala).
espera_tras_habla_s = 0.5
# Micrófono: "" = el predeterminado del sistema (PipeWire). Índice o nombre de
# sounddevice (p. ej. "pulse"). Override: variable REM_MIC_DEVICE.
dispositivo_entrada = ""


[stt.voz]
# Cuándo hay voz (stt/analisis.py). El umbral NO es fijo: es el piso de ruido de
# la propia grabación (la mínima mediana de ventanas de 0,4 s) + voz_sobre_ruido_db,
# y nunca por debajo de voz_min_dbfs. Los tiempos sí son fijos:
gracia_s           = 0.65   # al empezar a hablar, el silencio aún no cuenta
silencio_s         = 1.0    # silencio seguido tras la voz que cierra la frase (micrófono en automático)
max_voz_s          = 15     # tope de una frase en automático, desde que empieza la voz
voz_sobre_ruido_db = 12
voz_min_dbfs       = -45
voz_inicio_tramas  = 3      # tramas de 20 ms seguidas sobre el umbral para dar la voz por empezada
muerto_dbfs        = -80    # pico por debajo de esto = no llega audio del micrófono
muerto_temprano_s  = 4      # en automático: cortar si en este tiempo no llegó nada
muerto_min_s       = 1.5    # veredicto: "micrófono muerto" (≥) o "no llegó audio" (<)
espera_voz_toque_s = 8      # toque del botón 🎙 sin que nadie hable: se corta a los N s
# Transcripción adelantada (solo en automático): tras adelantar_s de silencio se
# transcribe ya lo dicho, y si al cortar no hubo voz nueva se usa ese texto
# (esconde Whisper dentro de silencio_s). Solo con adelantar_min_voz_s de voz:
# sobre un trozo corto Whisper alucina y bloquea a la de verdad. 0 = no adelantar.
adelantar_s         = 0.35
adelantar_min_voz_s = 1.0
# Frases que Whisper se inventa sobre el silencio: se descartan si la grabación
# tuvo menos de alucinacion_max_voz_ms de voz (con voz de verdad se respetan).
alucinacion_max_voz_ms = 120
frases_inventadas = [
    "Gracias.", "Muchas gracias.", "Gracias por ver.", "Gracias por ver el video.",
    "Subtítulos realizados por la comunidad de Amara.org", "Subtítulos por la comunidad de Amara.org",
    "Suscríbete.", "Suscríbete al canal.", "Música.", "[Música]", "Thank you.", "Thanks for watching.",
    "Hasta la próxima.", "Chao.", "...",
]
# Modo conversación (si está activo en el panel, pestaña Micrófono): si la
# respuesta termina en "?", el micrófono se reabre en automático
# reabrir_tras_s después de que termine de hablar, y la conversación se cierra
# si en cierre_inactividad_s nadie habla.
reabrir_tras_s      = 0.55
cierre_inactividad_s = 30


[stt.local]
# faster-whisper. EN CPU a propósito: la VRAM (4 GB) es para Ollama (ver
# [llm.ollama].num_gpu), no se toca la GPU.
model        = "small"
compute_type = "int8"
device       = "cpu"
language     = "es"
# 1 = decodificación voraz (la más rápida); subir mejora algo la precisión
# a costa de latencia. Medido en CLAUDE.md, "Voz de entrada".
beam_size    = 1
# 0 = que decida ctranslate2.
cpu_threads  = 0
# Sesga el vocabulario hacia los nombres propios/técnicos que Rem oye seguido.
initial_prompt = "Conversación con Yoru, una asistente virtual. Vocabulario: Yoru, Rem, Esteban, Ollama, Claude, Anthropic, Hyprland, Arch Linux, Python, PipeWire, GTK, WebKit, Whisper, Piper, VRM."


[herramientas]
# Las tools (abrir programa, apagar, buscar en internet, buscar archivos) solo
# se le mandan al modelo si el mensaje del usuario contiene alguna de estas
# palabras. Sin ninguna, el turno va sin tools: ~530 tok menos de prompt, y el
# modelo de 4B no puede llamarlas por error ("me despidieron" -> estado_pc,
# medido 2 de 2 cuando las tools iban siempre).
# Coincidencia por palabra completa, sin mayúsculas ni tildes; "*" al final =
# cualquier terminación ("busca*" -> busca, buscar, búscame, buscalo).
disparadores = [
    "abre*", "abrir*", "abrime",
    "lanza", "lanzar*", "lanzame", "inicia", "iniciar*", "iniciame", "ejecuta*", "arranca*",
    "busca*", "googlea*", "google",
    "apaga*", "shutdown",
    "archivo*", "carpeta*", "encuentra*", "encontrar", "localiza*",
]


[modo_serio]
# Si el mensaje del usuario contiene un disparador de alguna categoría (y
# ninguna excepción), al final de ESE turno se le pega al mensaje una
# instrucción corta de modo serio con el ejemplo de esa categoría
# (chat_sesion.EJEMPLOS_MODO_SERIO). No va en el system ni queda en el
# historial: no toca la caché del prefijo. Medido 2026-11-05: con la regla
# larga siempre en el system, 0 de 5 frases serias salían bien.
# Coincidencia por palabra completa o frase, sin mayúsculas ni tildes; "*" al
# final = cualquier terminación.
#
# Si aparece alguna excepción, el turno NO es serio aunque haya disparador
# ("se murió mi personaje", "me echaron de la partida"). Contrapartida
# aceptada: un mensaje serio que mencione un juego ("murió mi tío y no tengo
# ganas ni de jugar la partida") no activa el modo.
excepciones = [
    "personaje", "pj", "jefe", "boss", "juego", "videojuego", "partida", "nivel",
    "elden ring", "malenia", "anime", "serie", "manga", "película", "capítulo", "episodio",
]
# Aclaraciones que se añaden a la instrucción si el mensaje las contiene: el
# 4B leyó "ya no aguanto la u" como "la uva".
glosario = { "la u" = "la universidad" }

[modo_serio.categorias]
# Una categoría por tipo de golpe; si el mensaje cae en dos, gana la primera en
# este orden ("mi novia me dejó, estoy destrozado" -> ruptura). Cada una tiene
# su ejemplo en chat_sesion.EJEMPLOS_MODO_SERIO.
muerte = ["murió", "falleció", "fallecimiento", "perdí a mi", "funeral", "velorio"]
ruptura = [
    "me dejó", "lo dejamos", "nos dejamos", "terminamos", "terminé con", "rompimos",
    "ruptura", "me fue infiel",
]
trabajo = [
    "me echaron", "me despidieron", "perdí el trabajo", "perdí mi trabajo",
    "me quedé sin trabajo", "despido",
]
# "solo" suelto no: "solo quería saber..." dispararía.
soledad = [
    "me siento solo", "me siento sola", "estoy solo", "estoy sola", "muy solo", "muy sola",
    "aislado", "aislada", "soledad", "nadie me quiere",
]
estres = [
    "estresado", "estresada", "estrés", "ansioso", "ansiosa", "ansiedad", "agobiado", "agobiada",
    "no aguanto", "no puedo más", "todo me sale mal", "deprimido", "deprimida", "depresión",
    "triste", "mal en serio", "estoy fatal", "destrozado", "destrozada", "quiero llorar", "llorando",
]


[respuesta]
# Tope de oraciones por respuesta: al completar la N-ésima se corta la
# generación (se cierra la conexión con Ollama) y lo cortado no llega ni al
# chat, ni a la voz, ni al historial. 0 = sin tope. La regla LONGITUD del
# prompt pide 1-3, pero en conversaciones largas el 4B se iba a 4-6 y el
# historial lo realimentaba (medido 2026-11-05).
max_oraciones = 3


[contexto]
# Contexto que rem_chat (ventana y overlay) antepone al mensaje del usuario:
# solo la línea de fecha/hora, según su modo:
#   "condicional" → solo si el mensaje contiene alguna de palabras_fecha
#   "siempre"     → en cada turno
#   "nunca"       → nunca
# Con la FECHA siempre puesta, ~2 de 23 respuestas a "Hola, Rem." la leyeron en
# voz alta sin que nadie la pidiera — por eso es condicional (ver CLAUDE.md).
# El estado de la PC ya NO va acá: con la línea de PC inyectada, 6 de 6 "Hola"
# comentaban el disco. Después fue la herramienta estado_pc, quitada el
# 2026-11-05 porque el modelo la llamaba sin que nadie preguntara.
linea_fecha = "condicional"
# Solo preguntas EXPLÍCITAS por la hora, la fecha o el día (2026-11-05): con
# palabras sueltas ("hoy", "día", "tarde"...) la fecha se inyectaba en charla
# normal y Yoru la recitaba ("Jueves 5 de noviembre de 2026, 18:31" ante "me
# compré un teclado"). Frases completas, sin distinguir mayúsculas ni tildes
# ("qué hora" también pega con "que hora").
palabras_fecha = [
    "qué hora", "hora es", "tienes hora", "dime la hora",
    "qué fecha", "fecha de hoy", "dime la fecha",
    "qué día es", "qué día estamos", "a qué día estamos", "a cuántos estamos",
    "día de la semana", "qué año es", "en qué año estamos", "qué mes es", "en qué mes estamos",
]
